      <button class="btn-ghost" onclick="closeTicketPointSearch()">Отмена</button>
    </div>
    <div class="modal-body">
      <label>Название города или аэропорта</label>
<div class="coords-row">
  <input id="tp-query" placeholder="Например: Шереметьево, Москва" value="${esc(curValue)}" autocomplete="off" />
  <button type="button" onclick="runTicketPointSearch(${segmentIndex}, '${field}')" title="Найти">🔍</button>
  <button type="button" class="gmaps-btn" onclick="openGoogleMapsFromInput('tp-query')" title="Открыть в Google Maps">🌍</button>
  <button type="button" class="paste-btn" onclick="pasteCoordsForTicket(${segmentIndex}, '${field}')" title="Вставить координаты из буфера">📋</button>
</div>

    <li>Вернитесь сюда и нажмите <b>📋</b> — координаты подставятся автоматически.</li>
  </ol>
</details>
<div class="suggestions" id="tp-suggestions"></div>

        <p class="muted" style="margin:0;font-size:12px">

        </p>

      <p class="muted" style="margin:0;font-size:12px">
        Выбери точку из подсказок — координаты сохранятся в билете.

    </div>

  const input = document.getElementById('tp-query');
  if(input){
    input.addEventListener('input', ()=> runTicketPointSearch(segmentIndex, field));
    input.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); runTicketPointSearch(segmentIndex, field); }
    });

}

function runTicketPointSearch(segmentIndex, field){
  const input = document.getElementById('tp-query');
  const box = document.getElementById('tp-suggestions');
  if(!input || !box) return;
  const q = input.value.trim();
  if(q.length < 3){ box.innerHTML = ''; return; }

  if(ticketPointAbort) ticketPointAbort.abort();
  clearTimeout(ticketPointTimer);

  ticketPointTimer = setTimeout(async ()=>{
    box.innerHTML = '<div class="loading">Ищу...</div>';
    ticketPointAbort = new AbortController();
    try{
      const results = await geocodeSearch(q, ticketPointAbort.signal);
      renderSuggestions(box, results, (r) => {
        pickTicketPoint(segmentIndex, field, r.lat, r.lng, r.name);
      });
    }catch(e){
      if(e.name === 'AbortError') return;
      box.innerHTML = '<div class="loading">Ошибка поиска.</div>';
    }
  }, 500);
}

function pickTicketPoint(segmentIndex, field, lat, lng, fullName){
  const sg = state.ticketSegments[segmentIndex];
  if(!sg) return;

  // Если пользователь не менял название — оставляем то, что ввёл
  const input = document.getElementById('tp-query');
  if(input && input.value.trim()){
    sg[field] = input.value.trim();
  } else {
    sg[field] = (fullName || '').split(',')[0] || sg[field];
  }
  sg[field + 'Lat'] = lat;
  sg[field + 'Lng'] = lng;

  // Сохраняем прямо в билет, чтобы координаты не потерялись при пересоздании state
  const trip = ensureTrip(trips.find(t => t.id === state.tripId));
  const ticketId = state._editingTicketId;
  if(ticketId){
    const ticket = trip.tickets.find(t => t.id === ticketId);
    if(ticket && ticket.segments && ticket.segments[segmentIndex]){
      ticket.segments[segmentIndex][field] = sg[field];
      ticket.segments[segmentIndex][field + 'Lat'] = lat;
      ticket.segments[segmentIndex][field + 'Lng'] = lng;
      syncTrip(trip.id);
    }
  }

  renderTicketSegments();
  closeTicketPointSearch();
}

function clearTicketPoint(segmentIndex, field){
  const sg = state.ticketSegments[segmentIndex];
  if(!sg) return;
  sg[field + 'Lat'] = null;
  sg[field + 'Lng'] = null;

  const trip = ensureTrip(trips.find(t => t.id === state.tripId));
  const ticketId = state._editingTicketId;
  if(ticketId){
    const ticket = trip.tickets.find(t => t.id === ticketId);
    if(ticket && ticket.segments && ticket.segments[segmentIndex]){
      ticket.segments[segmentIndex][field + 'Lat'] = null;
      ticket.segments[segmentIndex][field + 'Lng'] = null;
      syncTrip(trip.id);
    }
  }

  renderTicketSegments();
  closeTicketPointSearch();
}

function closeTicketPointSearch(){
  // Возвращаемся к модалке билета
  openTicketModalAgain();
}

function openTicketModalAgain(){
  // Перерисовываем модалку билета с текущими сегментами
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const isNew = !state.editingTicketId;
  // Просто заново открываем модалку билета, используя уже существующий state
  // Мы должны знать, редактировали ли билет. Используем трюк: если state.editingId — то это
  // активность, не билет. Для билетов сохраним отдельный маркер.
  // Проще: восстановим модалку через openTicketModal, передав id, если он был.
  const id = state._editingTicketId || null;
  openTicketModal(id);
}

function saveTicket(id){
    state._ticketDraft = null;
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const box = document.getElementById('tk-segments');
  if(box){
    box.querySelectorAll('input[data-k]').forEach(el => {
      const i = parseInt(el.dataset.i, 10);
      const k = el.dataset.k;
      if(state.ticketSegments[i]) state.ticketSegments[i][k] = el.value;
    });
  }
  const type = document.getElementById('tk-type').value || 'other';
  const carrier = document.getElementById('tk-carrier').value.trim();
  const ticketNumber = document.getElementById('tk-ticket-number').value.trim();
  const price = parseFloat(document.getElementById('tk-price').value) || 0;
  const link = document.getElementById('tk-link').value.trim();
  const notes = document.getElementById('tk-notes').value.trim();
  const addExpense = document.getElementById('tk-add-expense').checked;
  const toPlan = document.getElementById('tk-to-plan').checked;
  const validSegs = state.ticketSegments.filter(sg => sg.from && sg.to);
  if(!validSegs.length){ alert('Заполни хотя бы один сегмент'); return; }
        const data = {
    type, carrier, ticketNumber, price, link, notes,
    toPlan,
    // Привязка вложения
    attachmentId:   null,
    attachmentName: null,
    attachmentSize: null,
    attachmentType: null,
    segments: state.ticketSegments.map(sg => ({
      id: sg.id || uid(),
      from: sg.from || '', to: sg.to || '',
      fromLat: (typeof sg.fromLat === 'number') ? sg.fromLat : null,
      fromLng: (typeof sg.fromLng === 'number') ? sg.fromLng : null,
      toLat: (typeof sg.toLat === 'number') ? sg.toLat : null,
      toLng: (typeof sg.toLng === 'number') ? sg.toLng : null,
      departDate: sg.departDate || '', departTime: sg.departTime || '',
      arriveDate: sg.arriveDate || '', arriveTime: sg.arriveTime || '',
      carrier: sg.carrier || '', number: sg.number || '', seat: sg.seat || ''
    }))
  };
    // Определяем итоговое вложение
  let attach;
  if(state._ticketAttachDraft){
    attach = state._ticketAttachDraft;
    state._ticketAttachDraft = null;
  } else if(id){
    const existing = trip.tickets.find(x=>x.id===id);
    if(existing && existing.attachmentId){
      attach = {
        id: existing.attachmentId,
        name: existing.attachmentName,
        size: existing.attachmentSize,
        type: existing.attachmentType
      };
    }
  }
  if(attach){
    data.attachmentId   = attach.id;
    data.attachmentName = attach.name || 'файл';
    data.attachmentSize = attach.size || 0;
    data.attachmentType = attach.type || '';
  }

    let ticketId;
  if(id){
    const t = trip.tickets.find(x=>x.id===id);
    Object.assign(t, data);
    ticketId = t.id;
  } else {
    const newTicket = { id: uid(), ...data };
    trip.tickets.push(newTicket);
    ticketId = newTicket.id;
  }

  // Синхронизация мест-билетов в плане
  syncTicketActivities(trip, ticketId);
  if(addExpense && price > 0){
    let cat = trip.budget.categories.find(c => c.name.toLowerCase() === 'транспорт');
    if(!cat){ cat = { id: uid(), name:'Транспорт', planned:0, color:'#34c759' }; trip.budget.categories.push(cat); }
    const first = data.segments[0];
    const last = data.segments[data.segments.length-1];
    trip.budget.expenses.push({
      id: uid(),
      title: `${ticketLabel(type)}: ${first.from || '—'} → ${last.to || '—'}`,
      amount: price,
      date: first.departDate || todayISO(),
      categoryId: cat.id,
      note: ticketNumber ? `бронь ${ticketNumber}` : '',
      priceInRUB: true,
      isPrepaid: true
    });
  }
  closeModal();
  render();
  syncTrip(trip.id);
}
function deleteTicket(id){
  if(!confirm('Удалить билет?')) return;
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const doomed = trip.tickets.find(t => t.id === id);
  if(doomed && doomed.attachmentId){
    deleteAttachment(doomed.attachmentId);
  }
  // Удаляем связанные места-билеты
  trip.activities = (trip.activities || []).filter(a => a.linkedTicketId !== id);
  trip.tickets = trip.tickets.filter(t => t.id !== id);
  closeModal();
  render();
  syncTrip(trip.id);
}

async function deleteExpense(id){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const doomed = trip.budget.expenses.find(x => x.id === id);
  if(!doomed) return;

  const linked = doomed.linkedActivityId
    ? trip.activities.find(a => a.id === doomed.linkedActivityId)
    : null;

  // Трата без привязки — обычный confirm
  if(!linked){
    if(!confirm('Удалить трату?')) return;
    trip.budget.expenses = trip.budget.expenses.filter(x => x.id !== id);
    closeModal();
    render();
    syncTrip(trip.id);
    return;
  }

  // Трата привязана к месту — открываем контекстную модалку
  const dateLine = linked.date
    ? `${fmtDate(linked.date)}${linked.time ? ', ' + esc(linked.time) : ''}`
    : 'без даты';
  const cat = trip.budget.categories.find(c => c.id === doomed.categoryId);
  const catLine = cat ? esc(cat.name) : '—';
  const amountLine = fmtMoney(doomed.amount || 0, 'RUB');

  const choice = await confirmModal({
    title: 'Удалить трату?',
    bodyHtml: `
      <div class="confirm-context">
        <div class="confirm-icon">💸</div>
        <div class="confirm-body">
          <div class="confirm-name">${esc(doomed.title || 'Трата')}</div>
          <div class="confirm-meta">${amountLine} · ${catLine}</div>
        </div>
      </div>
      <p class="confirm-text">
        Эта трата привязана к месту <b>«${esc(linked.title)}»</b>
        во вкладке «План» (<span class="muted">${dateLine}</span>).
      </p>
      <p class="confirm-text" style="font-size:12.5px;text-align:center">
        <a href="#" onclick="event.preventDefault();jumpToLinkedPlace('${linked.id}');return false;"
           style="color:var(--accent);text-decoration:none;font-weight:600">
          ↗ Открыть место в плане
        </a>
      </p>
    `,
    buttons: [
      { label: 'Удалить только трату', value: 'expense', danger: false },
      { label: 'Удалить и место',      value: 'both',    danger: true  }
    ]
  });

  if(choice === 'expense'){
    if(linked) linked.addToExpense = false;
    trip.budget.expenses = trip.budget.expenses.filter(x => x.id !== id);
  } else if(choice === 'both'){
    trip.budget.expenses = trip.budget.expenses.filter(x => x.id !== id);
    trip.activities = trip.activities.filter(a => a.id !== linked.id);
  }

  syncTrip(trip.id);
  render();
}

  const title = document.getElementById('m-title').value.trim();

  const coords = document.getElementById('m-coords').value;

  const price = parseFloat(document.getElementById('m-price').value) || 0;

  let activityId;

    const a = trip.activities.find(x=>x.id===state.editingId);
    Object.assign(a, {title, date, time, notes, lat, lng, type, duration, openFrom, openTo, price, addToExpense});

  } else {
    const newAct = {
      id: uid(), title, date, time, notes, lat, lng, type, duration,
      openFrom, openTo, price, addToExpense, checklist: []
    };
    if(state.tempChecklist && state.tempChecklist.length) newAct.checklist = state.tempChecklist;
    trip.activities.push(newAct);
    activityId = newAct.id;
  }

  // Синхронизация с бюджетом
  syncActivityExpense(trip, activityId);

  closeModal();
  render();
  syncTrip(trip.id);
}

/* Синхронизирует трату в бюджете с параметрами места:
   - если addToExpense=true и price>0 — создаёт/обновляет запись
   - если addToExpense=false или price=0 — удаляет запись
*/
function syncActivityExpense(trip, activityId){
  const a = trip.activities.find(x => x.id === activityId);
  if(!a) return;

  // Ищем связанную трату
  const existing = (trip.budget.expenses || []).find(e => e.linkedActivityId === activityId);

  const shouldHave = !!(a.addToExpense && a.price > 0);

  if(shouldHave){
    // Убедимся, что есть категория «Активности»
    let cat = trip.budget.categories.find(c => c.name.toLowerCase() === 'активности');
    if(!cat){
      cat = { id: uid(), name:'Активности', planned:0, color:'#af52de' };
      trip.budget.categories.push(cat);
    }
    const dateForExpense = a.date || trip.start || todayISO();
    const title = a.title || 'Место';

    if(existing){
      // Обновляем
      existing.title = title;
      existing.amount = a.price;
      existing.date = dateForExpense;
      existing.categoryId = cat.id;
      existing.priceInRUB = true;
      existing.isPrepaid = false;
      existing.note = 'из карточки места';
    } else {
      trip.budget.expenses.push({
        id: uid(),
        title,
        amount: a.price,
        date: dateForExpense,
        categoryId: cat.id,
        note: 'из карточки места',
        priceInRUB: true,
        isPrepaid: false,
        paidBy: trip.me || 'Я',
        splitWith: 1,
        linkedActivityId: activityId
      });
    }
  } else {
    // Должно быть удалено
    if(existing){
      trip.budget.expenses = trip.budget.expenses.filter(e => e.id !== existing.id);
    }
  }
}
async function delActivity(id){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const a = trip.activities.find(x => x.id === id);
  if(!a) return;

  // Если это место-билет — предупреждаем и удаляем только из плана,
  // снимая галочку toPlan у связанного билета, чтобы место
  // не пересоздалось при следующем сохранении билета.
  if(a.linkedTicketId){
    const tk = trip.tickets.find(t => t.id === a.linkedTicketId);
    const msg = tk
      ? `Это место создано билетом «${tk.type ? ticketLabel(tk.type) : 'билет'}».\nУдалить из плана и снять галочку «Добавлять в план как место» у билета?`
      : 'Это место создано билетом. Удалить его из плана?';
    if(!confirm(msg)) return;
    if(tk) tk.toPlan = false;
    trip.activities = trip.activities.filter(x => x.id !== id);
    closeModal();
    render();
    syncTrip(trip.id);
    return;
  }

  const linkedExpense = (trip.budget.expenses || []).find(e => e.linkedActivityId === id);

  // Нет связанной траты — обычный confirm
  if(!linkedExpense){
    if(!confirm('Удалить это место?')) return;
    trip.activities = trip.activities.filter(x => x.id !== id);
    closeModal();
    render();
    syncTrip(trip.id);
    return;
  }

  const amountLine = fmtMoney(linkedExpense.amount || 0, 'RUB');

  const choice = await confirmModal({
    title: 'Удалить место?',
    bodyHtml: `
      <div class="confirm-context">
        <div class="confirm-icon">${placeTypeIcon(a.type)}</div>
        <div class="confirm-body">
          <div class="confirm-name">${esc(a.title || 'Место')}</div>
          <div class="confirm-meta">${a.date ? fmtDate(a.date) : 'без даты'}${a.time ? ', ' + esc(a.time) : ''}</div>
        </div>
      </div>
      <p class="confirm-text">
        К этому месту привязана трата в бюджете:
        <b>«${esc(linkedExpense.title || '—')}»</b>
        на <b>${amountLine}</b>.
      </p>
      <p class="confirm-text muted" style="font-size:12.5px">
        Если удалить только место — трата останется в бюджете как обычная ручная запись.
      </p>
    `,
    buttons: [
      { label: 'Удалить только место', value: 'activity', danger: false },
      { label: 'Удалить и трату',      value: 'both',     danger: true  }
    ]
  });

  if(choice === 'activity'){
    linkedExpense.linkedActivityId = null;
    linkedExpense.note = linkedExpense.note
      ? linkedExpense.note.replace(/\s*из карточки места\s*/,'').trim() || ''
      : '';
    trip.activities = trip.activities.filter(x => x.id !== id);
  } else if(choice === 'both'){
    trip.budget.expenses = trip.budget.expenses.filter(e => e.id !== linkedExpense.id);
    trip.activities = trip.activities.filter(x => x.id !== id);
  }

  closeModal();
  render();
  syncTrip(trip.id);
}

function attachChecklistSwipe(el){
  let startX=0, startY=0, dx=0, dragging=false, decided=false, isHorizontal=false;
  let longPressTimer = null, longPressFired = false;
  const MAX = 170, THRESHOLD = 70;
  const cancelLongPress = ()=>{ if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; } };
  el.addEventListener('pointerdown', e=>{
    if(e.target.closest('a,button')) return;
    startX = e.clientX; startY = e.clientY;
    dx = 0; dragging = true; decided = false; isHorizontal = false;
    longPressFired = false;
    cancelLongPress();
    const id = el.dataset.id;
    const section = el.dataset.section;
    longPressTimer = setTimeout(()=>{
      if(dragging && !decided){
        longPressFired = true;
        dragging = false;
        el.classList.remove('dragging');
        if(navigator.vibrate) navigator.vibrate(15);
        openChecklistItemModal(section, id);
      }
    }, 500);
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const mx = e.clientX - startX;
    const my = e.clientY - startY;
    if(!decided){
      if(Math.abs(mx) > 6 || Math.abs(my) > 6){
        decided = true;
        cancelLongPress();
        isHorizontal = Math.abs(mx) > Math.abs(my);
        if(!isHorizontal){ dragging = false; el.classList.remove('dragging'); }
      }
    }
    if(isHorizontal){
      dx = Math.max(-MAX, Math.min(0, mx));
      el.style.transform = `translateX(${dx}px)`;
      if(Math.abs(mx) > 4) e.preventDefault();
    }
  });
  const finish = ()=>{
    cancelLongPress();
    if(!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    if(dx < -THRESHOLD){
      el.style.transform = `translateX(-${MAX}px)`;
      el.dataset.open = '1';
    } else {
      el.style.transform = 'translateX(0)';
      el.dataset.open = '';
    }
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', finish);
  el.addEventListener('pointerleave', finish);
  el.addEventListener('click', e=>{
    if(longPressFired){ e.preventDefault(); e.stopPropagation(); longPressFired = false; return; }
    if(el.dataset.open === '1'){ e.preventDefault(); e.stopPropagation(); el.style.transform = 'translateX(0)'; el.dataset.open = ''; return; }
    e.preventDefault(); e.stopPropagation();
    toggleChecklistItem(el.dataset.section, el.dataset.id);
  }, true);
}

function saveChecklistItem(id, originalSection){

const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
function openModal(html){
  const wasOpen = modal.classList.contains('show');
  modal.innerHTML = html;
  overlay.classList.add('show');
  modal.classList.add('show');
  // Пуш в историю только при переходе из закрытого состояния
  // (подмодалки — тоже push, это ок)
  HistoryMgr.push({ ...HistoryMgr.current(), modal: true });
}
let modalCloseTimer = null;

function closeModal(){
  const wasOpen = modal.classList.contains('show');
  overlay.classList.remove('show');
  modal.classList.remove('show');
  // Если модалка была открыта и мы закрываем её вручную —
  // убираем запись из стека, чтобы кнопка «назад» не пыталась её закрыть снова
  if(wasOpen) HistoryMgr.popSilently();
  if(modalCloseTimer) clearTimeout(modalCloseTimer);

    if(modal.classList.contains('show')) return;

    state.editingId=null;

    state._editingLodgingId = null;
    state._lodgingAttachDraft = null;
    modalCloseTimer = null;

}

/* Универсальная модалка-подтверждение.
   Возвращает Promise<boolean> или Promise<'primary'|'secondary'>.
   Кнопки: массив [{label, value, danger?}, ...] + всегда «Отмена».
*/
/* Универсальная модалка-подтверждение.
   Возвращает Promise<string> — значение value нажатой кнопки.
   Если пользователь закрыл модалку любым другим способом —
   promise никогда не разрешится, и код после await не выполнится. */
function confirmModal({ title, bodyHtml, buttons }){
  return new Promise((resolve) => {
    const btnHtml = buttons.map(b =>
      `<button class="btn ${b.danger ? 'btn-danger' : ''}" data-choice="${esc(b.value)}" style="flex:1">${esc(b.label)}</button>`
    ).join('');

    openModal(`
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button class="btn-ghost" onclick="closeModal()">Закрыть</button>
      </div>
      <div class="modal-body">
        ${bodyHtml}
      </div>
      <div class="modal-foot" style="flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px;width:100%">${btnHtml}</div>
      </div>
    `);

    const modalEl = document.getElementById('modal');
    const handler = (e) => {
      const btn = e.target.closest('button[data-choice]');
      if(!btn) return;
      const choice = btn.dataset.choice;
      modalEl.removeEventListener('click', handler);
      closeModal();
      resolve(choice);
    };
    modalEl.addEventListener('click', handler);
  });
}

function toggleBannedUrl(btn, url){
  const box = btn.nextElementSibling;
  if(!box) return;
  const shown = !box.hasAttribute('hidden');
  if(shown){
    box.setAttribute('hidden', '');
    btn.textContent = 'Показать ссылку';
  } else {
    box.removeAttribute('hidden');
    btn.textContent = 'Скрыть ссылку';
    // Выделяем текст, чтобы удобно скопировать
    try{
      const range = document.createRange();
      range.selectNodeContents(box.querySelector('code'));
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }catch(e){}
  }
}

function doPrint(){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  if(!trip) return;

    const include = {
    info: document.getElementById('pr-info').checked,
    lodging: document.getElementById('pr-lodging').checked,
    tickets: document.getElementById('pr-tickets').checked,
    activities: document.getElementById('pr-activities').checked,
    checklists: document.getElementById('pr-checklists').checked,
    budget: document.getElementById('pr-budget').checked,
    bw: document.getElementById('pr-bw').checked
  };

  closeModal();

  const html = buildPrintHtml(trip, include);
  const win = window.open('', '_blank');
  if(!win){
    alert('Разреши всплывающие окна в браузере, чтобы открыть окно печати.');
    return;
  }
  win.document.write(html);
  win.document.close();

  // Ждём загрузки и вызываем печать
  win.onload = ()=>{
    setTimeout(()=>{ win.focus(); win.print(); }, 300);
  };
  // Резерв на случай, если onload не сработал
  setTimeout(()=>{
    try { win.focus(); win.print(); } catch(e){}
  }, 800);
}

function buildPrintHtml(trip, include){
  const days = daysBetween(trip.start, trip.end);
  const esc2 = s => (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDateRu = d => d ? new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}) : '—';
  const fmtDateShort = d => d ? new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}) : '';
  const fmtDayWeek = d => d ? new Date(d).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}) : '';

  const BW = !!include.bw;
  // Палитра (при BW — серые оттенки)
  const C = BW ? {
    green:'#1a1a1a', greenDark:'#000000', gold:'#4a4a4a',
    text:'#000000', muted:'#555555', border:'#cccccc',
    bgSoft:'#f4f4f4', bgCard:'#fafafa', bgCover:'#f0f0f0'
  } : {
    green:'#0c3b2c', greenDark:'#0d5c3f', gold:'#c8951e',
    text:'#0c3b2c', muted:'#5c7a6d', border:'#d9cfb4',
    bgSoft:'#f6f2e7', bgCard:'#fbf8f0', bgCover:'#0c3b2c'
  };
  const coverText = BW ? '#000000' : '#f5f2e8';
  const coverAccent = BW ? '#cccccc' : '#eec33a';

  const printedAt = new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});

  /* ---------- ОБЛОЖКА ---------- */
  const cover = `
    <section class="cover">
      <div class="cover-brand">
        <div class="cover-logo">БериЛети</div>
        <div class="cover-tagline">тур-компания</div>
      </div>
      <div class="cover-title">${esc2(trip.title)}</div>
      <div class="cover-meta">
        ${trip.place ? `<div>${esc2(trip.place)}</div>` : ''}
        ${trip.start || trip.end ? `<div>${fmtDateRu(trip.start)} — ${fmtDateRu(trip.end)}${days.length ? ' · ' + days.length + ' дн.' : ''}</div>` : ''}
      </div>
      <div class="cover-foot">Дорожная книга · ${printedAt}</div>
    </section>
    <div class="page-break"></div>
  `;

  let body = '';

  /* ---------- ОБЩАЯ ИНФОРМАЦИЯ ---------- */
  if(include.info){
    const notes = trip.notes ? `<div class="info-notes"><div class="info-notes-label">Заметки</div><div class="info-notes-body">${esc2(trip.notes).replace(/\n/g,'<br>')}</div></div>` : '';
    body += `
      <section class="block">
        <h2 class="block-title"><span class="block-title-bar"></span>О поездке</h2>
        <div class="info-grid">
          <div class="info-cell">
            <div class="info-label">Место</div>
            <div class="info-value">${esc2(trip.place||'—')}</div>
          </div>
          <div class="info-cell">
            <div class="info-label">Даты</div>
            <div class="info-value">${fmtDateRu(trip.start)} — ${fmtDateRu(trip.end)}</div>
          </div>
          <div class="info-cell">
            <div class="info-label">Длительность</div>
            <div class="info-value">${days.length ? days.length + ' дн.' : '—'}</div>
          </div>
          <div class="info-cell">
            <div class="info-label">Валюта</div>
            <div class="info-value">${esc2(trip.currency||'RUB')} ${curSym(trip.currency||'RUB')}</div>
          </div>
        </div>
        ${notes}
      </section>`;
  }

  /* ---------- БИЛЕТЫ ---------- */
  if(include.tickets && (trip.tickets||[]).length){
    body += `
      <section class="block">
        <h2 class="block-title"><span class="block-title-bar"></span>Билеты</h2>
        ${(trip.tickets||[]).map(tk => {
          const segs = tk.segments || [];
          const first = segs[0] || {};
          const last = segs[segs.length-1] || {};
          const route = [first.from, ...segs.map(s=>s.to)].filter(Boolean).join('  →  ');
          const attach = tk.attachmentId ? `<div class="attach-note">📎 Прикреплён файл: ${esc2(tk.attachmentName||'файл')}${tk.attachmentSize?' · '+fmtBytes(tk.attachmentSize):''}</div>` : '';
          return `
            <div class="ticket-print">
              <div class="ticket-print-head">
                <span class="ticket-print-type">${ticketIcon(tk.type)} ${ticketLabel(tk.type)}</span>
                ${tk.ticketNumber ? `<span class="ticket-print-num">${esc2(tk.ticketNumber)}</span>` : ''}
              </div>
              <div class="ticket-print-route">${esc2(route || '—')}</div>
              <div class="ticket-print-grid">
                ${first.departDate ? `<div><span class="lbl">🛫 Отправление</span><span class="val">${fmtDateRu(first.departDate)}${first.departTime?' · '+esc2(first.departTime):''}</span></div>` : ''}
                ${last.arriveDate ? `<div><span class="lbl">🛬 Прибытие</span><span class="val">${fmtDateRu(last.arriveDate)}${last.arriveTime?' · '+esc2(last.arriveTime):''}</span></div>` : ''}
                ${tk.carrier ? `<div><span class="lbl">Перевозчик</span><span class="val">${esc2(tk.carrier)}</span></div>` : ''}
                ${tk.price ? `<div><span class="lbl">💰 Стоимость</span><span class="val">${fmtMoney(tk.price, 'RUB')}</span></div>` : ''}
              </div>
              ${segs.length > 1 ? `
                <div class="ticket-print-segs">
                  ${segs.map((sg,i)=>`
                    <div class="seg-line">
                      <span class="seg-idx">${i+1}</span>
                      <span class="seg-route">${esc2(sg.from||'—')} → ${esc2(sg.to||'—')}</span>
                      ${sg.departDate?`<span class="seg-date">${fmtDateShort(sg.departDate)}${sg.departTime?' '+esc2(sg.departTime):''}</span>`:''}
                      ${sg.number?`<span class="seg-num">рейс ${esc2(sg.number)}</span>`:''}
                      ${sg.seat?`<span class="seg-seat">место ${esc2(sg.seat)}</span>`:''}
                    </div>`).join('')}
                </div>` : ''}
              ${tk.notes ? `<div class="ticket-print-notes">${esc2(tk.notes).replace(/\n/g,'<br>')}</div>` : ''}
              ${attach}
            </div>`;
        }).join('')}
      </section>`;
  }

  /* ---------- ЖИЛЬЁ ---------- */
  if(include.lodging && (trip.lodging||[]).length){
    body += `
      <section class="block">
        <h2 class="block-title"><span class="block-title-bar"></span>Жильё</h2>
        ${(trip.lodging||[]).map(l => {
          const dates = (l.checkInDate||l.checkOutDate) ?
            `${l.checkInDate?fmtDateShort(l.checkInDate):''}${l.checkInTime?', '+esc2(l.checkInTime):''} → ${l.checkOutDate?fmtDateShort(l.checkOutDate):''}${l.checkOutTime?', '+esc2(l.checkOutTime):''}`
            : '';
          const attach = l.attachmentId ? `<div class="attach-note">📎 Прикреплён файл: ${esc2(l.attachmentName||'файл')}${l.attachmentSize?' · '+fmtBytes(l.attachmentSize):''}</div>` : '';
          return `
            <div class="lodging-print">
              <div class="lodging-print-title">🏠 ${esc2(l.title||'Жильё')}</div>
              ${dates ? `<div class="lodging-print-dates">📅 ${dates}</div>` : ''}
              ${l.address ? `<div class="lodging-print-line">📍 ${esc2(l.address)}</div>` : ''}
              ${l.price ? `<div class="lodging-print-line">💰 ${fmtMoney(l.price, 'RUB')}${l.priceNote?' · '+esc2(l.priceNote):''}</div>` : ''}
              ${l.link ? `<div class="lodging-print-line">🔗 ${esc2(l.link)}</div>` : ''}
              ${l.notes ? `<div class="lodging-print-notes">${esc2(l.notes).replace(/\n/g,'<br>')}</div>` : ''}
              ${attach}
            </div>`;
        }).join('')}
      </section>`;
  }

  /* ---------- МЕСТА ПО ДНЯМ ---------- */
  if(include.activities && (trip.activities||[]).length && days.length){
    const undated = (trip.activities||[]).filter(a=>!a.date);
    body += `
      <section class="block">
        <h2 class="block-title"><span class="block-title-bar"></span>План по дням</h2>
        ${days.map((d, idx) => {
          const list = (trip.activities||[]).filter(a => a.date === d);
          const lodges = (trip.lodging||[]).filter(l => {
            const from = l.checkInDate || l.checkOutDate || '';
            const to = l.checkOutDate || l.checkInDate || '';
            return from && d >= from && d <= to;
          });
          return `
            <div class="day-print">
              <div class="day-print-head">
                <span class="day-print-num">День ${idx+1}</span>
                <span class="day-print-date">${fmtDayWeek(d)}</span>
              </div>
              ${lodges.length ? lodges.map(l=>`<div class="day-print-lodge">🏠 ${esc2(l.title||'Жильё')}${l.checkInDate===d?' · заезд':''}${l.checkOutDate===d?' · выезд':''}</div>`).join('') : ''}
              ${list.length
                ? `<div class="day-print-list">${list.map(a => `
                    <div class="day-print-act">
                      <span class="act-time">${a.time?esc2(a.time):'—'}</span>
                      <span class="act-icon">${placeTypeIcon(a.type)}</span>
                      <div class="act-body">
                        <div class="act-title">${esc2(a.title)}</div>
                        ${a.notes?`<div class="act-note">${esc2(a.notes)}</div>`:''}
                      </div>
                      ${a.duration?`<span class="act-dur">${fmtDuration(a.duration)}</span>`:''}
                    </div>`).join('')}</div>`
                : `<div class="day-print-empty">— пусто —</div>`}
            </div>`;
        }).join('')}
        ${undated.length ? `
          <div class="day-print">
            <div class="day-print-head"><span class="day-print-num">Без даты</span></div>
            <div class="day-print-list">${undated.map(a => `
              <div class="day-print-act">
                <span class="act-time">—</span>
                <span class="act-icon">${placeTypeIcon(a.type)}</span>
                <div class="act-body"><div class="act-title">${esc2(a.title)}</div></div>
              </div>`).join('')}</div>
          </div>` : ''}
      </section>`;
  }

  /* ---------- ЧЕК-ЛИСТЫ ---------- */
  if(include.checklists && trip.checklists && ((trip.checklists.packing||[]).length || (trip.checklists.shopping||[]).length)){
    const pack = trip.checklists.packing || [];
    const shop = trip.checklists.shopping || [];
    body += `
      <section class="block">
        <h2 class="block-title"><span class="block-title-bar"></span>Чек-листы</h2>
        <div class="checklists-print">
          ${pack.length ? `
            <div class="cl-print">
              <div class="cl-print-title">🧳 Сборы <span class="cl-print-count">${pack.filter(x=>x.done).length}/${pack.length}</span></div>
              ${pack.map(item => `
                <div class="cl-line ${item.done?'done':''}">
                  <span class="cl-box">${item.done?'☑':'☐'}</span>
                  <span class="cl-text">${esc2(item.text)}${item.note?' — '+esc2(item.note):''}</span>
                </div>`).join('')}
            </div>` : ''}
          ${shop.length ? `
            <div class="cl-print">
              <div class="cl-print-title">🛍️ Покупки <span class="cl-print-count">${shop.filter(x=>x.done).length}/${shop.length}</span></div>

                <div class="cl-line ${item.done?'done':''}">

                </div>`).join('')}
            </div>` : ''}
        </div>
      </section>`;
  }

  /* ---------- БЮДЖЕТ ---------- */
  if(include.budget){
    const b = calcBudget(trip);
    const percent = b.percent || 0;
    body += `
      <section class="block">
        <h2 class="block-title"><span class="block-title-bar"></span>Бюджет</h2>
        <div class="budget-print-hero">
          <div class="budget-print-main">${fmtMoney(b.factRUB, 'RUB')} <span class="budget-print-of">из ${fmtMoney(b.total, 'RUB')}</span></div>
          <div class="budget-print-sub">Осталось: ${fmtMoney(b.left, 'RUB')} · ${percent}% использовано</div>
          <div class="budget-print-bar"><div style="width:${Math.min(100,percent)}%"></div></div>
        </div>
        ${b.byCat.length ? `
          <div class="budget-print-cats">
            ${b.byCat.map(x => `
              <div class="budget-print-row">
                <span class="bp-dot" style="background:${BW?'#666':(x.cat.color||'#8e8e93')}"></span>

                <span class="bp-amount">${fmtMoney(x.fact, 'RUB')} <span class="bp-plan">/ ${fmtMoney(x.planned, 'RUB')}</span></span>
              </div>`).join('')}
          </div>` : ''}
        ${(trip.budget.expenses||[]).length ? `
          <div class="budget-print-expenses">
            <div class="bp-exp-title">Траты</div>
            ${(trip.budget.expenses||[]).slice().sort((a,b2)=> (a.date||'').localeCompare(b2.date||'')).map(e => {
              const cat = trip.budget.categories.find(c=>c.id===e.categoryId);
              const rub = e.priceInRUB ? (e.amount||0) : toRUB(e.amount||0, trip.currency, trip);
              return `<div class="bp-exp-row">
                <span class="bp-exp-date">${e.date?fmtDateShort(e.date):'—'}</span>
                <span class="bp-exp-name">${esc2(e.title||'—')}${cat?' <span class="bp-exp-cat">· '+esc2(cat.name)+'</span>':''}</span>
                <span class="bp-exp-sum">${fmtMoney(rub, 'RUB')}</span>
              </div>`;
            }).join('')}
          </div>` : ''}
      </section>`;
  }

  /* ---------- ФИНАЛЬНЫЙ HTML ---------- */
  return `<!DOCTYPE html>
<html lang="ru">

<style>

  .bp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .bp-name{flex:1;color:${C.text}}
  .bp-amount{font-weight:700;color:${C.text};white-space:nowrap}

  @media print{
    body{font-size:11.5px}
    .cover{min-height:auto;height:100vh;padding:40mm 24mm}
    .cover-logo{font-size:40px}

</style>
</head>
<body>
${cover}

</body>
</html>`;

/* =============== ЭКСПОРТ / ИМПОРТ =============== */
function downloadJSON(data, filename){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportAll(){
  if(!trips.length){ alert('Нет поездок'); return; }
  downloadJSON({ app:'trips-planner', version:12, exportedAt:new Date().toISOString(), trips }, `trips-all-${todayISO()}.json`);
  closeModal();
}
function exportTrip(id){
  const trip = ensureTrip(trips.find(t=>t.id===id));
  if(!trip) return;
  downloadJSON({ app:'trips-planner', version:1, exportedAt:new Date().toISOString(), trips:[trip] }, `trip-${(trip.title||'trip').replace(/[^\wа-яА-Я\-]+/g,'_').slice(0,40)}-${todayISO()}.json`);
  closeModal();
}
const importInput = document.getElementById('import-file');
function triggerImport(){ closeModal(); importInput.value = ''; importInput.click(); }
importInput.addEventListener('change', async (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const incoming = normalizeImport(data);
    if(!incoming.length){ alert('В файле не найдено поездок.'); return; }
    askImportMode(incoming);
  }catch(err){
    console.error(err);
    alert('Не удалось прочитать файл: ' + err.message);
  }
});
function normalizeImport(data){
  let raw;
  if(Array.isArray(data)) raw = data;
  else if(data && Array.isArray(data.trips)) raw = data.trips;
  else return [];
  return raw.map(t => {
    if(!t || typeof t !== 'object') return null;
    const trip = {
      id: t.id || uid(),
      title: String(t.title || 'Без названия'),
      place: String(t.place || ''),
      start: String(t.start || ''),
      end: String(t.end || ''),
      notes: String(t.notes || ''),
      currency: t.currency || 'RUB',
      me: String(t.me || 'Я'),
      dayStart: String(t.dayStart || '09:00'),
      dayEnd: String(t.dayEnd || '21:00'),
      rates: (t.rates && typeof t.rates === 'object') ? t.rates : { ...DEFAULT_RATES },
                        activities: Array.isArray(t.activities) ? t.activities.map(a=>({
        id: a.id || uid(), title: String(a.title || 'Без названия'),
        date: String(a.date || ''), time: String(a.time || ''),
        notes: String(a.notes || ''),
        lat: (typeof a.lat === 'number') ? a.lat : null,
        lng: (typeof a.lng === 'number') ? a.lng : null,
        type: String(a.type || 'other'),
        duration: Number(a.duration) || 60,
        openFrom: String(a.openFrom || ''),
        openTo: String(a.openTo || ''),
        price: Number(a.price) || 0,
        addToExpense: !!a.addToExpense,
                linkedTicketId: a.linkedTicketId || null,
        linkedTicketRole: a.linkedTicketRole || null,
        linkedTicketSegmentIdx: (typeof a.linkedTicketSegmentIdx === 'number') ? a.linkedTicketSegmentIdx : null,
        lockedByTicket: !!a.lockedByTicket,
        checklist: Array.isArray(a.checklist) ? a.checklist.map(c=>({ id: c.id || uid(), text: String(c.text || ''), done: !!c.done })) : []
      })) : []
    };
    if(t.budget && typeof t.budget === 'object'){
      trip.budget = {
        total: Number(t.budget.total) || 0,
        categories: Array.isArray(t.budget.categories) ? t.budget.categories.map(c=>({ id: c.id || uid(), name: String(c.name || 'Категория'), planned: Number(c.planned) || 0, color: c.color || '#8e8e93' })) : [],
                expenses: Array.isArray(t.budget.expenses) ? t.budget.expenses.map(e=>({
          id: e.id || uid(), title: String(e.title || ''),
          amount: Number(e.amount) || 0, date: String(e.date || ''),
          categoryId: e.categoryId || '', note: String(e.note || ''),
          priceInRUB: !!e.priceInRUB, isPrepaid: !!e.isPrepaid,
          paidBy: String(e.paidBy || ''), splitWith: Math.max(1, parseInt(e.splitWith, 10) || 1),
          linkedActivityId: e.linkedActivityId || null
        })) : [],
        savings: Array.isArray(t.budget.savings) ? t.budget.savings.map(s=>({
          id: s.id || uid(), title: String(s.title || ''),
          target: Number(s.target) || 0, deadline: String(s.deadline || ''),
          transactions: Array.isArray(s.transactions) ? s.transactions.map(tr=>({ id: tr.id || uid(), amount: Number(tr.amount) || 0, date: String(tr.date || ''), note: String(tr.note || '') })) : []
        })) : []
      };
    }
        trip.lodging = Array.isArray(t.lodging) ? t.lodging.map(l => ({
      id: l.id || uid(), title: String(l.title || ''), address: String(l.address || ''),
      lat: (typeof l.lat === 'number') ? l.lat : null,
      lng: (typeof l.lng === 'number') ? l.lng : null,
      checkInDate: String(l.checkInDate || ''), checkInTime: String(l.checkInTime || ''),
      checkOutDate: String(l.checkOutDate || ''), checkOutTime: String(l.checkOutTime || ''),
      price: Number(l.price) || 0, priceNote: String(l.priceNote || ''),
      link: String(l.link || ''), notes: String(l.notes || ''),
      attachmentId:   l.attachmentId   || null,
      attachmentName: l.attachmentName || null,
      attachmentSize: l.attachmentSize || null,
      attachmentType: l.attachmentType || null
    })) : [];
    trip.tickets = Array.isArray(t.tickets) ? t.tickets.map(tk => {
      if(Array.isArray(tk.segments)){
                        return {
          id: tk.id || uid(), type: tk.type || 'other',
          ticketNumber: String(tk.ticketNumber || ''), carrier: String(tk.carrier || ''),
          price: Number(tk.price) || 0, link: String(tk.link || ''), notes: String(tk.notes || ''),
          toPlan: !!tk.toPlan,
          attachmentId:   tk.attachmentId   || null,
          attachmentName: tk.attachmentName || null,
          attachmentSize: tk.attachmentSize || null,
          attachmentType: tk.attachmentType || null,
                    segments: tk.segments.map(sg => ({
            id: sg.id || uid(),
            from: String(sg.from || ''), to: String(sg.to || ''),
            fromLat: (typeof sg.fromLat === 'number') ? sg.fromLat : null,
            fromLng: (typeof sg.fromLng === 'number') ? sg.fromLng : null,
            toLat: (typeof sg.toLat === 'number') ? sg.toLat : null,
            toLng: (typeof sg.toLng === 'number') ? sg.toLng : null,
            departDate: String(sg.departDate || ''), departTime: String(sg.departTime || ''),
            arriveDate: String(sg.arriveDate || ''), arriveTime: String(sg.arriveTime || ''),
            carrier: String(sg.carrier || ''), number: String(sg.number || ''), seat: String(sg.seat || '')
          }))
        };
      }
            const legacy = migrateTicket({
        id: tk.id || uid(), type: tk.type || 'other',
        ticketNumber: tk.number || '', carrier: tk.carrier || '',
        price: Number(tk.price) || 0, link: String(tk.link || ''), notes: String(tk.notes || ''),
        from: tk.from || '', to: tk.to || '',
        departDate: tk.departDate || '', departTime: tk.departTime || '',
        arriveDate: tk.arriveDate || '', arriveTime: tk.arriveTime || '',
        number: tk.number || '', seat: tk.seat || ''
      });
      legacy.attachmentId   = tk.attachmentId   || null;
      legacy.attachmentName = tk.attachmentName || null;
      legacy.attachmentSize = tk.attachmentSize || null;
      legacy.attachmentType = tk.attachmentType || null;
      return legacy;
    }) : [];
    trip.checklists = {
      packing: (t.checklists && Array.isArray(t.checklists.packing))

        : []
    };
        const t2 = ensureTrip(trip);

    (t2.tickets || []).forEach(tk => syncTicketActivities(t2, tk.id));

  }).filter(Boolean);

function doImport(mode, incoming){
  if(typeof incoming === 'string') incoming = JSON.parse(incoming);

  let addedCount = 0;
  let skippedCount = 0;

  if(mode === 'replace'){
    // Полная замена: стираем всё, кладём как есть (с их id)
    trips = incoming.map(t => ensureTrip(t));
    addedCount = trips.length;
  }
  else if(mode === 'add-new'){
    // Добавляем всё, каждой поездке даём новый id,
    // чтобы гарантированно не пересекаться с существующими
    const prepared = incoming.map(t => {
      const copy = JSON.parse(JSON.stringify(t)); // глубокая копия
      copy.id = uid();
      // Вложения не переносятся (blob в JSON нет) — чистим ссылки,
      // чтобы на карточках не было "мёртвых" 📎.
      // PDF нужно прикрепить заново — это ожидаемое поведение.
      if(Array.isArray(copy.tickets)){
        copy.tickets.forEach(tk => {
          if(tk.attachmentId){
            delete tk.attachmentId;
            delete tk.attachmentName;
            delete tk.attachmentSize;
            delete tk.attachmentType;
          }
        });
      }
      if(Array.isArray(copy.lodging)){
        copy.lodging.forEach(l => {
          if(l.attachmentId){
            delete l.attachmentId;
            delete l.attachmentName;
            delete l.attachmentSize;
            delete l.attachmentType;
          }
        });
      }
      // Не переносим временные кэши в новую поездку
      delete copy._weatherByDate;
      delete copy._ticketGeoCache;
      delete copy._autoFailed;
      return ensureTrip(copy);
    });
    trips = trips.concat(prepared);
    addedCount = prepared.length;
  }
  else {
    // merge: добавляем только те, чьи id ещё не заняты
    const existingIds = new Set(trips.map(t => t.id));
    const added = incoming.filter(t => !existingIds.has(t.id));
    skippedCount = incoming.length - added.length;
    trips = trips.concat(added.map(t => ensureTrip(t)));
    addedCount = added.length;
  }

    closeModal();
  render();

  // Синхронизируем все поездки (только что добавленные)
  if(sb && currentUser){
    (async () => {
      updateSyncStatus('syncing');
      for(const t of trips){
        try{ await cloudSaveTrip(t); }catch(e){ console.error('sync fail', t.id, e); }
      }
      updateSyncStatus('synced');
    })();
  }

  let msg = '';
  if(mode === 'replace')      msg = `Загружено: ${addedCount}.`;
  else if(mode === 'add-new') msg = `Добавлено новых поездок: ${addedCount}.`;
  else                        msg = `Добавлено: ${addedCount}.${skippedCount ? ' Пропущено дублей: ' + skippedCount + '.' : ''}`;

  setTimeout(() => alert(msg), 50);
}

   УЛУЧШЕННЫЙ ГЕОКОДИНГ — Nominatim + Photon + кэш
   ========================================================= */

/* Кэш поисковых запросов в localStorage.
   Ключ: 'geoc_' + нормализованный запрос.
   TTL: 7 дней. */
const GEO_CACHE_PREFIX = 'geoc_';
const GEO_CACHE_TTL = 7 * 24 * 60 * 60 * 1000;

function geoCacheKey(q){
  return GEO_CACHE_PREFIX + q.trim().toLowerCase();
}
function geoCacheGet(q){
  try{
    const raw = localStorage.getItem(geoCacheKey(q));
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(!obj || !obj.ts || Date.now() - obj.ts > GEO_CACHE_TTL) return null;
    return obj.results || null;
  }catch(e){ return null; }
}
function geoCacheSet(q, results){
  try{
    localStorage.setItem(geoCacheKey(q), JSON.stringify({ ts: Date.now(), results }));
  }catch(e){}
}
/* Раз в сутки чистим старые записи кэша */
function geoCacheCleanup(){
  try{
    const now = Date.now();
    const keysToRemove = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || !k.startsWith(GEO_CACHE_PREFIX)) continue;
      try{
        const obj = JSON.parse(localStorage.getItem(k) || 'null');
        if(!obj || !obj.ts || now - obj.ts > GEO_CACHE_TTL) keysToRemove.push(k);
      }catch(e){ keysToRemove.push(k); }
    }
    keysToRemove.forEach(k => localStorage.removeItem(k));
  }catch(e){}
}
geoCacheCleanup();

/* Запрос к Nominatim. Возвращает массив {name, addr, lat, lng, source}. */
async function geocodeNominatim(q, signal){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=ru&q=${encodeURIComponent(q)}`;
  const res = await fetch(url, { signal, headers: { 'Accept': 'application/json' } });
  if(!res.ok) throw new Error('Nominatim HTTP ' + res.status);
  const data = await res.json();
  return data.map(d => {
    const parts = (d.display_name || '').split(',');
    const name = (parts[0] || '').trim() || q;
    const addr = parts.slice(1).join(',').trim();
    return {
      name, addr,
      lat: parseFloat(d.lat),
      lng: parseFloat(d.lon),
      source: 'OSM'
    };
  });
}

/* Запрос к Photon. Возвращает массив в том же формате. */
async function geocodePhoton(q, signal){
  const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=5&lang=ru`;
  const res = await fetch(url, { signal });
  if(!res.ok) throw new Error('Photon HTTP ' + res.status);
  const data = await res.json();
  const features = (data && data.features) || [];
  return features.map(f => {
    const p = f.properties || {};
    const coords = (f.geometry && f.geometry.coordinates) || [];
    const name = p.name || p.street || p.city || q;
    const addrParts = [
      p.street && p.housenumber ? `${p.street}, ${p.housenumber}` : (p.street || null),
      p.district,
      p.city,
      p.state,
      p.country
    ].filter(Boolean);
    return {
      name: String(name),
      addr: addrParts.join(', '),
      lat: parseFloat(coords[1]),
      lng: parseFloat(coords[0]),
      source: 'Photon'
    };
  }).filter(r => !isNaN(r.lat) && !isNaN(r.lng));
}

/* Дедупликация: если два результата ближе 100 м — оставляем первый. */
function dedupeGeo(results){
  const out = [];
  const R = 6371000; // метров
  const toRad = x => x * Math.PI / 180;
  function dist(a, b){
    const dLat = toRad(b.lat - a.lat);
    const dLon = toRad(b.lng - a.lng);
    const x = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  results.forEach(r => {
    if(out.some(o => dist(o, r) < 100)) return;
    out.push(r);
  });
  return out;
}

/* Основной поиск: кэш → Nominatim → Photon (если мало) → дедуп. */
async function geocodeSearch(q, signal){
  const cached = geoCacheGet(q);
  if(cached) return cached;

  let results = [];
  try{
    results = await geocodeNominatim(q, signal);
  }catch(e){
    if(e.name === 'AbortError') throw e;
    // тихо игнорируем — попробуем Photon
  }

  // Если Nominatim вернул мало, добавим Photon
  if(results.length < 3){
    try{
      const photon = await geocodePhoton(q, signal);
      results = results.concat(photon);
    }catch(e){
      if(e.name === 'AbortError') throw e;
      // тихо игнорируем
    }
  }

  results = dedupeGeo(results).slice(0, 7);
  if(results.length) geoCacheSet(q, results);
  return results;
}

/* Открывает Google Maps в новой вкладке.
   Если есть координаты — по ним, иначе — поиск по тексту. */

/* Специально для модалки точки билета: если в буфере координаты —
   сразу сохраняем их в сегмент, а поле оставляем пустым или с названием. */
async function pasteCoordsForTicket(segmentIndex, field){
  if(!navigator.clipboard || !navigator.clipboard.readText){
    alert('Ваш браузер не разрешает автоматическое чтение буфера обмена.\nСкопируйте координаты и вставьте их в поле вручную.');
    return;
  }
  let text = '';
  try{
    text = await navigator.clipboard.readText();
  }catch(err){
    alert('Не удалось прочитать буфер обмена.\nРазрешите доступ к буферу обмена в настройках браузера.');
    return;
  }
  if(!text || !text.trim()){
    showToast('Буфер обмена пуст');
    return;
  }

  const {lat, lng} = parseCoords(text);
  if(lat == null || lng == null){
    showToast('Не удалось распознать координаты. Скопируйте их в Google Maps: зажмите точку на карте и нажмите «Скопировать».');
    return;
  }

  // Сначала синхронизируем все поля сегментов из DOM в state
  const box = document.getElementById('tk-segments');
  if(box){
    box.querySelectorAll('input[data-k]').forEach(el => {
      const i = parseInt(el.dataset.i, 10);
      const k = el.dataset.k;
      if(state.ticketSegments[i]) state.ticketSegments[i][k] = el.value;
    });
  }

  const sg = state.ticketSegments[segmentIndex];
  if(!sg) return;

  // Записываем координаты в нужное поле сегмента
  sg[field + 'Lat'] = lat;
  sg[field + 'Lng'] = lng;
  // Если пользователь оставил название пустым — заполним понятным текстом
  if(!sg[field] || !sg[field].trim()){
    sg[field] = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  }

  // Сохраняем прямо в билет, если редактируем существующий
  const trip = ensureTrip(trips.find(t => t.id === state.tripId));
  const ticketId = state._editingTicketId;
  if(ticketId){
    const ticket = trip.tickets.find(t => t.id === ticketId);
    if(ticket && ticket.segments && ticket.segments[segmentIndex]){
      ticket.segments[segmentIndex][field] = sg[field];
      ticket.segments[segmentIndex][field + 'Lat'] = lat;
      ticket.segments[segmentIndex][field + 'Lng'] = lng;
      syncTrip(trip.id);
    }
  }

  renderTicketSegments();
  showToast('✓ Координаты вставлены');
}

/* Вставляет координаты из буфера обмена в указанное поле.

async function pasteCoordsFromClipboard(inputId){

    return;

  let text = '';

    text = await navigator.clipboard.readText();
  }catch(err){
    // Пользователь отклонил разрешение или браузер заблокировал
    alert('Не удалось прочитать буфер обмена.\nРазрешите доступ к буферу обмена в настройках браузера.');

let _toastTimer = null;

const TICKET_TITLE_PREFIXES = ['Самолёт:','Поезд:','Автобус:','Машина:','Паром:','Другое:','✈️','🚆','🚌','🚗','⛴️','🎫'];
function looksLikePrepaidExpense(e){
  if(e.isPrepaid) return true;
  const title = (e.title || '').trim();
  const note = (e.note || '').trim();
  if(title.includes('(жильё)')) return true;
  for(const p of TICKET_TITLE_PREFIXES){ if(title.startsWith(p)) return true; }
  if(note.startsWith('бронь ')) return true;
  if(e.priceInRUB) return true;
  return false;
}
function migratePrepaidExpenses(){
  let changed = 0;
  trips.forEach(t => {
    ensureTrip(t);
    (t.budget.expenses || []).forEach(e => {
      if(!e.isPrepaid && looksLikePrepaidExpense(e)){ e.isPrepaid = true; changed++; }
    });
  });
    if(changed > 0){
    DB.save(trips);
    console.log(`Миграция предоплат: помечено ${changed} трат.`);

(async function boot(){

  const ok = initSupabase();

  // 2) Загрузка пользователя (если сессия есть)
  if(ok){
    // 2a) Проверяем, не вернулся ли пользователь с ошибкой OAuth
    const params = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const urlError = params.get('error') || hashParams.get('error');
    const urlErrorDesc = params.get('error_description') || hashParams.get('error_description');
    if(urlError){
      history.replaceState({}, '', window.location.pathname);
      setTimeout(() => {
        if(urlError === 'access_denied'){
          showToast('Вы отменили вход через Google.');
        } else {
          showToast('Ошибка входа: ' + (urlErrorDesc || urlError));
        }
      }, 500);
    }

    // 2b) СНАЧАЛА подписка на изменения авторизации
    subscribeAuthChanges(async (event, session) => {
            if(event === 'SIGNED_OUT'){
        // currentUser уже null (subscribeAuthChanges обнулил его до колбэка).
        // Берём id старого пользователя из глобала, куда его положил subscribeAuthChanges.
        const oldUserId = window.__lastSignedOutUserId;
        window.__lastSignedOutUserId = null;

        currentUser = null;
        trips = [];
        try{
          if(oldUserId){
            localStorage.removeItem('trips_' + oldUserId);
          } else {
            // на всякий случай — не должно случаться, но пусть
            localStorage.removeItem('trips_guest');
          }
        }catch(e){}
        closeModal();
        render();
        return;
      }

      if(event === 'SIGNED_IN'){
        currentUser = session ? session.user : null;

        // Немедленно обнуляем локальные данные, чтобы не мелькали чужие
        trips = [];
        DB.save(trips);
        render();

        if(session && session.user){
          const meta = session.user.user_metadata || {};
          if(meta.full_name || meta.name){
            showToast(`✓ Привет, ${meta.full_name || meta.name}!`);
          }
        }

                const expectedUid = currentUser ? currentUser.id : null;
        try{
          const cloudTrips = await cloudLoadTrips();
          // Пока грузили — пользователь мог смениться. Если так — не применяем.
          if(!currentUser || currentUser.id !== expectedUid) return;
          trips = cloudTrips;
          DB.save(trips);
          updateSyncStatus('synced');
        }catch(e){
          if(!currentUser || currentUser.id !== expectedUid) return;
          console.error('Ошибка загрузки из облака:', e);
          trips = DB.load();
          updateSyncStatus('error');
        }

        render();
        setTimeout(() => maybeShowDueRemindersBanner(), 600);
        return;
      }

      if(event === 'TOKEN_REFRESHED'){
        // Молча — сессия обновилась
      }
    });

    // 2c) Теперь загружаем текущего пользователя
    await loadCurrentUser();

    // 2d) Если залогинен — тянем поездки из облака
        if(currentUser){
      const expectedUid = currentUser.id;
      try{
        const cloudTrips = await cloudLoadTrips();
        if(!currentUser || currentUser.id !== expectedUid) return;
        trips = cloudTrips;
        DB.save(trips);
        updateSyncStatus('synced');
      }catch(e){
        if(!currentUser || currentUser.id !== expectedUid) return;
        console.error('Ошибка загрузки из облака:', e);
        trips = DB.load();
        updateSyncStatus('error');
      }
    } else {
      trips = [];
    }
  }

  // 3) Применяем миграции к тому, что загрузили
  trips.forEach(ensureTrip);
  migratePrepaidExpenses();
  DB.save(trips);

  // 4) Первый рендер
  render();

  // 5) Показываем баннер созревших напоминаний (один раз за сессию)
  if(currentUser){
    setTimeout(() => maybeShowDueRemindersBanner(), 800);
  }
})();

/* =============== SERVICE WORKER =============== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(
      (reg) => console.log('SW зарегистрирован:', reg.scope),
      (err) => console.error('Ошибка SW:', err)
    );
  });
}

/* Глобальный ресайз для тулбара карты */
window.addEventListener('resize', () => {
  if(document.getElementById('route-toolbar')) updateRouteToolbarState();
}, { passive: true });
</script>
