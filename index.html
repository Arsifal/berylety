<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0b6b3a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Поездки" />
<link rel="apple-touch-icon" href="icon.png" />
<meta name="theme-color" content="#ffffff" />
<title>БЕРИЛЕТИ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  if (typeof L === 'undefined') {
    document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>');
  } else {
    L.TileLayer.prototype.options.referrerPolicy = 'strict-origin-when-cross-origin';
  }
</script>

<style>
  :root,
  [data-theme="light"]{
    --bg:#f7f9fb;
    --bg-soft:#eef2f6;
    --bg-elev:#ffffff;
    --text:#0f2540;
    --muted:#6b7a90;
    --accent:#0b6b3a;
    --accent-2:#095a31;
    --accent-soft:#e6f2ec;
    --border:#e2e8ef;
    --radius:18px;
    --radius-sm:12px;
    --radius-lg:24px;
    --danger:#c0392b;
    --overlay:rgba(15,37,64,.5);
    --shadow:0 4px 20px rgba(15,37,64,.06);
    --shadow-lg:0 12px 32px rgba(15,37,64,.10);
    --shadow-fab:0 8px 24px rgba(11,107,58,.35);
    --warn:#d99a1e;
    --ok:#1a9e5c;
    --font-head:"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif";
  }
  [data-theme="dark"]{
    --bg:#0d1520;
    --bg-soft:#15202f;
    --bg-elev:#1a2634;
    --text:#e8eef6;
    --muted:#7a8798;
    --accent:#2ecc71;
    --accent-2:#3ddc84;
    --accent-soft:#15321f;
    --border:#25303f;
    --danger:#e74c3c;
    --overlay:rgba(0,0,0,.7);
    --shadow:0 4px 20px rgba(0,0,0,.4);
    --shadow-lg:0 12px 32px rgba(0,0,0,.55);
    --shadow-fab:0 8px 24px rgba(46,204,113,.35);
    --warn:#f0b03f;
    --ok:#2ecc71;
  }
  [data-theme="picky"]{
    --bg:#fdf6f9; --bg-soft:#fbe3ed; --bg-elev:#ffffff;
    --text:#4a1f33; --muted:#a87d8f;
    --accent:#d95a8a; --accent-2:#c1487a; --accent-soft:#fbe3ed;
    --border:#f0d5e2; --radius:20px; --radius-sm:14px; --radius-lg:26px;
    --danger:#e5484d; --overlay:rgba(74,31,51,.35);
    --shadow:0 4px 20px rgba(217,90,138,.10);
    --shadow-lg:0 12px 32px rgba(217,90,138,.16);
    --shadow-fab:0 8px 24px rgba(217,90,138,.4);
    --warn:#e5974a; --ok:#3db77a;
  }
  [data-theme="punk"]{
    --bg:#0f0f0f; --bg-soft:#1c1c1c; --bg-elev:#181818;
    --text:#f0f0f0; --muted:#8a8a8a;
    --accent:#e6c200; --accent-2:#f4d117; --accent-soft:#2b2506;
    --border:#2a2a2a; --radius:10px; --radius-sm:8px; --radius-lg:16px;
    --danger:#e5484d; --overlay:rgba(0,0,0,.8);
    --shadow:0 4px 20px rgba(230,194,0,.10);
    --shadow-lg:0 12px 32px rgba(0,0,0,.7);
    --shadow-fab:0 8px 24px rgba(230,194,0,.45);
    --warn:#e6c200; --ok:#7fdd3f;
    --font-head:"Impact,'Arial Black',sans-serif";
  }
  [data-theme="punk"] .btn{color:#000;text-transform:uppercase;letter-spacing:1px}
  [data-theme="punk"] .btn:active{background:var(--accent-2)}
  [data-theme="punk"] header h1{text-transform:uppercase;letter-spacing:2px;font-family:var(--font-head)}
  [data-theme="punk"] .fab{color:#000;font-weight:900}
  [data-theme="noir"]{
    --bg:#111116; --bg-soft:#1a1a22; --bg-elev:#18181f;
    --text:#e8e8ec; --muted:#7a7a85;
    --accent:#c9a227; --accent-2:#dab53a; --accent-soft:#28220d;
    --border:#2a2a33; --radius:8px; --radius-sm:6px; --radius-lg:14px;
    --danger:#c0392b; --overlay:rgba(0,0,0,.8);
    --shadow:0 4px 20px rgba(0,0,0,.5);
    --shadow-lg:0 12px 32px rgba(0,0,0,.7);
    --shadow-fab:0 8px 24px rgba(201,162,39,.4);
    --warn:#c9a227; --ok:#6aab5c;
    --font-head:"Georgia,'Times New Roman',serif";
  }
  [data-theme="noir"] header h1{font-family:var(--font-head);letter-spacing:1px;font-style:italic}
  [data-theme="noir"] .day-title{letter-spacing:2px;color:var(--accent)}
  [data-theme="noir"] .fab{color:#000}
  [data-theme="oldmoney"]{
    --bg:#f2e8d5; --bg-soft:#e8d9b8; --bg-elev:#f8f0e0;
    --text:#3b2f2f; --muted:#8a7a5c;
    --accent:#7a4a20; --accent-2:#8e5a2a; --accent-soft:#e8d9b8;
    --border:#d4c5a3; --radius:12px; --radius-sm:8px; --radius-lg:18px;
    --danger:#a33; --overlay:rgba(59,47,47,.5);
    --shadow:0 4px 20px rgba(122,74,32,.12);
    --shadow-lg:0 12px 32px rgba(122,74,32,.18);
    --shadow-fab:0 8px 24px rgba(122,74,32,.45);
    --warn:#b8860b; --ok:#5a8c3a;
    --font-head:"Georgia,'Times New Roman',serif";
  }
  [data-theme="oldmoney"] header h1{font-family:var(--font-head);letter-spacing:1px;font-weight:700}
  [data-theme="oldmoney"] .day-title{letter-spacing:1.5px;font-family:var(--font-head);font-style:italic}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg-soft);color:var(--text);overflow-x:hidden;
    transition:background .3s, color .3s;
  }
  .app{
    max-width:760px;margin:0 auto;min-height:100vh;
    background:var(--bg);display:flex;flex-direction:column;
    position:relative;transition:background .3s, max-width .3s;
  }

  header{
    padding:16px 18px;display:flex;align-items:center;gap:8px;
    border-bottom:1px solid var(--border);position:sticky;top:0;
    z-index:10;transition:background .3s, border-color .3s;
  }
  header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;letter-spacing:-.3px}
  .back{cursor:pointer;color:var(--accent);font-size:24px;line-height:1;background:none;border:none;padding:4px 8px}
  .back:active{opacity:.5}
  .icon-btn{
    background:none;border:none;font-size:20px;cursor:pointer;
    padding:6px 8px;border-radius:10px;line-height:1;color:var(--text);
    transition:background .2s ease;
  }
  .icon-btn:active{background:var(--bg-soft)}

  .btn{
    background:var(--accent);color:#fff;border:none;border-radius:var(--radius);
    padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;
    letter-spacing:.2px;
    transition:transform .12s ease, box-shadow .2s ease, background .2s ease, border-radius .3s;
    box-shadow:var(--shadow-fab);
  }
  .btn:active{background:var(--accent-2);transform:scale(.96)}
  .btn-ghost{background:none;color:var(--accent);padding:8px 10px;border:none;font-size:14px;cursor:pointer;box-shadow:none}
  .btn-danger{background:var(--danger);color:#fff}
  .fab{
    position:fixed;right:calc(50% - 360px + 20px);bottom:24px;
    width:56px;height:56px;border-radius:50%;font-size:28px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-fab);z-index:20;
    transition:transform .12s ease;
  }
  .fab:active{transform:scale(.96)}
  @media(max-width:760px){.fab{right:20px}}

  .search-wrap{padding:12px 12px 4px;display:flex;flex-direction:column;gap:10px}
  .search-box{position:relative}
  .search-box input{padding-left:38px}
  .search-box .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
  .search-box .clear-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:6px 10px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;background:var(--bg-soft);color:var(--text);
    border:1px solid transparent;border-radius:999px;
    padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;
    transition:background .2s, color .2s, border-color .2s;
  }
  .chip.active{background:var(--accent);color:#fff}
  .chip:active{opacity:.7}

  .group{margin-bottom:6px}
  .group-head{display:flex;align-items:center;gap:8px;padding:14px 4px 6px;cursor:pointer;user-select:none}
  .group-head .arrow{font-size:11px;color:var(--muted);transition:transform .2s;display:inline-block}
  .group.collapsed .group-head .arrow{transform:rotate(-90deg)}
  .group-head .title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .group-head .count{margin-left:auto;font-size:11px;color:var(--muted);background:var(--bg-soft);border:1px solid var(--border);padding:2px 8px;border-radius:999px}
  .group.collapsed .group-body{display:none}
  .group.past .group-head .title{opacity:.6}
  .group.past .group-head .count{opacity:.6}

  .list{padding:8px 12px;flex:1}
  .card{
    background:var(--bg-elev);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;cursor:pointer;
    transition:background .15s, transform .15s, border-radius .3s;
    position:relative;box-shadow:var(--shadow);
    animation:softFade .25s ease;
  }
  .card:active{background:var(--bg-soft);transform:scale(.985)}
  .card h3{margin:0 0 4px;font-size:16px;padding-right:70px}
  .card .meta{color:var(--muted);font-size:13px}
  .card.past{opacity:.55}
  .card .badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--warn);color:#000;text-transform:uppercase;letter-spacing:.5px}
  .card .badge.active{background:var(--ok);color:#fff}
  .empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:15px}

  .form{padding:16px;display:flex;flex-direction:column;gap:12px}
  label{
  font-size: 13px;
  color: var(--text);
  opacity: .75;
  font-weight: 600;
  margin-bottom: 6px;
  display: block;
}
  input,textarea,select{
  width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:15px;font-family:inherit;background:var(--bg-elev);color:var(--text);
  transition:background .2s, box-shadow .2s, border-color .2s, border-radius .3s;
}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--bg-elev)}
  input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--text);
    -webkit-box-shadow:0 0 0 1000px var(--bg-soft) inset;
    transition:background-color 5000s ease-in-out 0s;
  }
  input[type="checkbox"]{accent-color:var(--accent)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}

  .act-wrap{position:relative;margin-bottom:8px;border-radius:var(--radius);overflow:hidden;background:var(--danger)}
  .act-delete{position:absolute;right:0;top:0;bottom:0;width:90px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;cursor:pointer;background:var(--danger);border:none}
  .act{
    position:relative;display:flex;gap:12px;align-items:flex-start;
    background:var(--bg-elev);border-radius:var(--radius);
    padding:12px;cursor:pointer;touch-action:pan-y;
    transition:transform .2s ease, background .3s, border-radius .3s;
    will-change:transform;user-select:none;
    box-shadow:var(--shadow);
    animation:softFade .25s ease;
  }
  .act.dragging{transition:none}
  .act .pin{font-size:20px;flex-shrink:0}
  .act .body{flex:1;min-width:0}
  .act .body b{font-size:15px;display:block}
  .act .body .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .act .body p{margin:4px 0 0;font-size:13px;color:var(--muted);word-break:break-word}
  .act .check-progress{font-size:12px;color:var(--accent);margin-top:4px}

  .day-title{font-size:13px;font-weight:600;color:var(--muted);padding:14px 4px 6px;text-transform:uppercase;letter-spacing:.5px}

  .trip-tabs{
    display:flex;background:var(--bg);border-bottom:1px solid var(--border);
    position:sticky;top:53px;z-index:9;overflow-x:auto;scrollbar-width:none;
  }
  .trip-tabs::-webkit-scrollbar{display:none}
  .trip-tab{
    flex:1 0 auto;min-width:80px;text-align:center;padding:12px 6px;font-size:13px;
    color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
    transition:color .2s, border-color .2s;user-select:none;white-space:nowrap;
  }
  .trip-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .trip-tab .ic{display:block;font-size:16px;margin-bottom:2px}

  .budget-hero{
    margin:12px;background:linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius:var(--radius);color:#fff;padding:16px;box-shadow:var(--shadow-fab);
  }
  .budget-hero .label{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.9;font-weight:600}
  .budget-hero .main{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
  .budget-hero .sub{font-size:13px;opacity:.9;margin-top:4px}
  .budget-bar{height:8px;border-radius:999px;margin-top:12px;background:rgba(255,255,255,.25);overflow:hidden}
  .budget-bar > div{height:100%;background:#fff;border-radius:999px;transition:width .4s}
  .budget-bar.warn > div{background:#ffd400}
  .budget-bar.danger > div{background:#ff5545}

  .budget-section{
    margin:16px 12px;background:var(--bg-elev);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);
  }
  .budget-section-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;border-bottom:1px solid var(--border);
    font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  }
  .budget-section-body{padding:6px 0}
  .budget-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
  .budget-row:last-child{border-bottom:none}
  .budget-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .budget-row .name{flex:1;min-width:0;font-size:14px}
  .budget-row .name .note{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .budget-row .amount{font-size:14px;font-weight:600;text-align:right;white-space:nowrap}
  .budget-row .amount .plan{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .budget-row .del{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 6px}
  .budget-row .del:active{color:var(--danger)}
  .budget-add{display:block;width:100%;background:none;border:none;padding:12px 14px;color:var(--accent);font-size:14px;text-align:left;cursor:pointer;font-family:inherit}
  .budget-add:active{background:var(--bg-soft)}

  .cat-bar{height:6px;border-radius:999px;background:var(--bg-soft);margin-top:6px;overflow:hidden}
  .cat-bar > div{height:100%;border-radius:999px}

  .saving-card{padding:12px 14px;border-bottom:1px solid var(--border)}
  .saving-card:last-child{border-bottom:none}
  .saving-head{display:flex;align-items:center;gap:10px}
  .saving-head .name{flex:1;font-weight:600;font-size:14px}
  .saving-head .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px}
  .saving-head .del:active{color:var(--danger)}
  .saving-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .saving-bar{height:6px;border-radius:999px;background:var(--bg-soft);margin-top:6px;overflow:hidden}
  .saving-bar > div{height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
  .saving-actions{display:flex;gap:6px;margin-top:8px}
  .saving-actions .btn-mini{flex:1;background:var(--bg-soft);color:var(--text);border:1px solid transparent;border-radius:10px;padding:8px;font-size:13px;cursor:pointer;font-family:inherit}
  .saving-actions .btn-mini:active{background:var(--border)}

  .lodge-card{background:var(--bg-elev);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:background .15s;box-shadow:var(--shadow)}
  .lodge-card:active{background:var(--bg-soft)}
  .lodge-card .title{font-size:16px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .lodge-card .title .icon{font-size:18px}
  .lodge-card .dates{font-size:13px;color:var(--muted);margin-top:2px}
  .lodge-card .price{font-size:13px;color:var(--accent);margin-top:4px;font-weight:600}
  .lodge-card .addr{font-size:13px;color:var(--muted);margin-top:4px;word-break:break-word}
  .lodge-card .notes{font-size:13px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);white-space:pre-wrap;word-break:break-word}
  .lodge-day{display:flex;align-items:center;gap:8px;margin:6px 4px 0;padding:8px 10px;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--muted);cursor:pointer}
  .lodge-day:active{background:var(--border)}
  .lodge-day .icon{font-size:14px}
  .lodge-day .name{color:var(--text);font-weight:600}

  .ticket-card{background:var(--bg-elev);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;cursor:pointer;transition:background .15s;position:relative;box-shadow:var(--shadow)}
  .ticket-card:active{background:var(--bg-soft)}
  .ticket-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .ticket-head .type{display:flex;align-items:center;gap:6px}
  .ticket-head .num{background:rgba(255,255,255,.25);padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.5px}
  .ticket-body{padding:14px}
  .ticket-route{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;font-weight:700;line-height:1.3}
  .ticket-route .point{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
  .ticket-route .arr{color:var(--accent);font-size:14px;flex-shrink:0}
  .ticket-route .more{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg-soft);border:1px solid var(--border);padding:2px 8px;border-radius:999px}
  .ticket-dates{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .ticket-dates .seg{display:inline-flex;align-items:center;gap:4px}
  .ticket-dates .seg b{color:var(--text);font-weight:600}
  .ticket-perf{position:relative;height:1px;border-top:1px dashed var(--border);margin:0 14px}
  .ticket-perf::before,.ticket-perf::after{content:'';position:absolute;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg-soft);border:1px solid var(--border)}
  .ticket-perf::before{left:-21px}
  .ticket-perf::after{right:-21px}
  .ticket-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 14px;gap:10px;font-size:12px}
  .ticket-foot .carrier{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .ticket-foot .seat{color:var(--muted);padding:2px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;white-space:nowrap}
  .ticket-foot .price{font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap}
  .ticket-barcode{display:flex;gap:1px;align-items:flex-end;height:22px;padding:0 14px 10px;opacity:.65}
  .ticket-barcode > span{display:block;width:2px;background:var(--text);border-radius:1px}
  .ticket-day{display:flex;align-items:flex-start;gap:8px;margin:6px 4px 0;padding:8px 10px;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--muted);cursor:pointer}
  .ticket-day:active{background:var(--border)}

  /* =========================================================
   ПОЛИРОВКА 13.5 — hover, анимации, пустые состояния
   ========================================================= */

/* ---------- Hover-эффекты (только для мыши) ---------- */
@media (hover: hover) and (pointer: fine){

  /* Карточки поездок */
  .card:hover{
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    transition: transform .2s ease, box-shadow .2s ease;
  }

  /* Карточки активностей, жилья, билетов, мест */
  .act:hover,
  .lodge-card:hover,
  .ticket-card:hover,
  .place-item:hover,
  .checklist-item:hover{
    background: var(--bg-soft);
    transition: background .15s ease;
  }

  /* Кнопки */
  .btn:hover:not(:active){
    background: var(--accent-2);
    box-shadow: 0 10px 28px rgba(11,107,58,.42);
    transform: translateY(-1px);
  }
  .btn-ghost:hover{
    background: var(--bg-soft);
    border-radius: 10px;
  }
  .icon-btn:hover{
    background: var(--bg-soft);
  }
  .btn-danger:hover:not(:active){
    background: #a52f22;
    box-shadow: 0 10px 28px rgba(192,57,43,.4);
  }

  /* FAB */
  .fab:hover{
    transform: scale(1.06);
    box-shadow: 0 12px 32px rgba(11,107,58,.5);
  }

  /* Чипы */
  .chip:hover:not(.active){
    background: var(--border);
  }

  /* Вкладки поездки */
  .trip-tab:hover:not(.active){
    color: var(--text);
  }

  /* Ссылки в карточках */
  .map-links a:hover{
    background: var(--bg-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Кнопки в меню */
  .menu-item:hover{
    background: var(--bg-soft);
  }

  /* Бюджетные строки */
  .budget-row:hover{
    background: var(--bg-soft);
  }
  .budget-row[style*="cursor:default"]:hover{
    background: transparent;
  }

  /* Пункты списка поездок в группе */
  .group-head:hover{
    color: var(--text);
  }
  .group-head:hover .title{
    color: var(--text);
  }

  /* Клик по ссылке в модалке */
  .suggestion:hover{
    background: var(--bg-soft);
  }
}

/* ---------- Фокус для клавиатуры ---------- */
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
.chip:focus-visible,
.trip-tab:focus-visible{
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.empty{

}
.empty.empty-places::before{ content: '📍'; }
.empty.empty-map::before{ content: '🗺️'; }
.empty.empty-lodging::before{ content: '🏠'; }
.empty.empty-tickets::before{ content: '✈️'; }
.empty.empty-checklists::before{ content: '🧳'; }
.empty.empty-budget::before{ content: '💰'; }
.empty.empty-places::before{ content: '📍'; }

/* Алиас-классы для разнообразия эмодзи */
.empty.emoji-search::before{ content: '🔍'; }
.empty.emoji-plane::before{ content: '🛫'; }

/* ---------- Плавное появление экранов ---------- */
.list,
.places-wrap,
.checklists-wrap,
.map-wrap,
.desktop-detail #tab-content{
  animation: fadeIn .25s ease;
}
@keyframes fadeIn{
  from{opacity: 0}
  to{opacity: 1}
}

/* Заголовки дней — липкие в плане */
.day-title{

  top: 53px;
  z-index: 5;
  background: var(--bg);

/* На ПК с двухколоночным... ах, мы откатили. Но на всякий — учтём если вернём */

/* ---------- Модалка — плавное появление и уход ---------- */

}
.modal-body{
  scroll-behavior: smooth;
}

/* ---------- Групповой разделитель в списке ---------- */
.group + .group{

}

/* ---------- Клик по карточке — мягкое «сжатие» ---------- */

  .lodge-card:active,

  .place-item:active{

/* ---------- Пустые состояния в контейнерах с другим фоном ---------- */

/* ---------- Анимация появления модалки ---------- */

}

/* На ПК — анимация другая (модалка центрируется) */

}

/* ---------- Мягкий пульс для FAB (привлечение внимания) ---------- */

}
@media (prefers-reduced-motion: reduce){

/* Явный row внутри сегментов */

<body>

<div class="app" id="app"></div>

<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div class="modal" id="modal"></div>

<input type="file" id="import-file" accept="application/json,.json" style="display:none" />

<script>
/* =============== ТЕМЫ =============== */
const THEMES = [
  { id:'light', icon:'☀️', label:'Светлая' },
  { id:'dark', icon:'🌑', label:'Тёмная' },
  { id:'picky', icon:'💅', label:'Пикми' },
  { id:'punk', icon:'🤘', label:'Панк' },
  { id:'noir', icon:'🎩', label:'Нуар' },
  { id:'oldmoney', icon:'📜', label:'Олдмани' }
];
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const map = { light:'#f7f9fb', dark:'#0d1520', picky:'#fdf6f9', punk:'#0f0f0f', noir:'#111116', oldmoney:'#f2e8d5' };
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', map[theme] || '#f7f9fb');
}
function initTheme(){
  const saved = localStorage.getItem('theme');
  if(saved && THEMES.some(t=>t.id===saved)){ applyTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const idx = THEMES.findIndex(t=>t.id===current);
  const next = THEMES[(idx + 1) % THEMES.length];
  applyTheme(next.id);
  localStorage.setItem('theme', next.id);
  render();
}
initTheme();
function themeIcon(){
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const idx = THEMES.findIndex(t=>t.id===current);
  return THEMES[(idx + 1) % THEMES.length].icon;
}
function themeLabel(){
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const idx = THEMES.findIndex(t=>t.id===current);
  return THEMES[(idx + 1) % THEMES.length].label;
}

/* =============== ВАЛЮТЫ =============== */
const CURRENCY_SYMBOLS = {
  RUB:'₽', USD:'$', EUR:'€', GEL:'₾', TRY:'₺',
  THB:'฿', JPY:'¥', CNY:'¥', GBP:'£', KZT:'₸',
  UAH:'₴', AMD:'֏', AED:'د.إ', INR:'₹', VND:'₫', KRW:'₩'
};
const DEFAULT_RATES = { USD:100, EUR:105, GEL:37, TRY:3, THB:2.8, KRW:0.07 };
const RATE_DISPLAY_MULT = { KRW:1000, JPY:100, VND:1000 };
function rateDisplayUnit(code){ return RATE_DISPLAY_MULT[code] || 1; }
function curSym(code){ return CURRENCY_SYMBOLS[code] || code; }
function fmtMoney(amount, code){
  if(amount == null || isNaN(amount)) return '—';
  const rounded = Math.round(amount*100)/100;
  const str = rounded.toLocaleString('ru-RU', {maximumFractionDigits:2});
  return `${str} ${curSym(code)}`;
}
function toRUB(amount, fromCur, trip){
  if(fromCur === 'RUB') return amount;
  const rate = (trip.rates && trip.rates[fromCur]) || DEFAULT_RATES[fromCur] || 1;
  return amount * rate;
}
function moneyTriple(amountRUB, trip){
  const usdRate = (trip.rates && trip.rates.USD) || DEFAULT_RATES.USD;
  const usd = usdRate ? amountRUB / usdRate : 0;
  const out = [fmtMoney(amountRUB, 'RUB'), fmtMoney(usd, 'USD')];
  if(trip.currency && trip.currency !== 'RUB' && trip.currency !== 'USD'){
    const r = (trip.rates && trip.rates[trip.currency]) || DEFAULT_RATES[trip.currency] || 1;
    out.push(fmtMoney(r ? amountRUB / r : 0, trip.currency));
  }
  return out.join(' · ');
}

/* =============== ХРАНИЛИЩЕ =============== */
const DB = {
  load(){ return JSON.parse(localStorage.getItem('trips') || '[]'); },
  save(trips){ localStorage.setItem('trips', JSON.stringify(trips)); }
};
let trips = DB.load();
let state = {
  view:'list', tripId:null, editingId:null, tempChecklist:null,
  query:'', filter:'all', collapsed:{},
  tripTab:'plan', ticketSegments:[], mapFilter:'all',
  mapMode:'points', routeDay:null, routeReturn:true, routeOrder:'distance'
};

const DEFAULT_CATEGORIES = [
  { name:'Жильё', color:'#2aabee' },
  { name:'Транспорт', color:'#34c759' },
  { name:'Еда', color:'#ff9500' },
  { name:'Активности', color:'#af52de' },
  { name:'Шоппинг', color:'#ff2d55' },
  { name:'Покупка Coca-Cola', color:'#ff0000' },
  { name:'Прочее', color:'#8e8e93' }
];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}) : ''; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){
  if(!a || !b) return [];
  const out=[]; const d=new Date(a); const end=new Date(b);
  while(d<=end){ out.push(new Date(d).toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return out;
}
function parseCoords(s){
  if(!s) return {lat:null,lng:null};
  const m = s.match(/(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/);
  if(!m) return {lat:null,lng:null};
  const lat=parseFloat(m[1]), lng=parseFloat(m[2]);
  if(isNaN(lat)||isNaN(lng)) return {lat:null,lng:null};
  return {lat,lng};
}
function daysUntil(dateStr){
  if(!dateStr) return Infinity;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}

function migrateTicket(t){
  if(Array.isArray(t.segments)) return t;
  return {
    id: t.id || uid(),
    type: t.type || 'plane',
    ticketNumber: t.ticketNumber || t.number || '',
    carrier: t.carrier || '',
    price: Number(t.price) || 0,
    link: t.link || '',
    notes: t.notes || '',
    segments: [{
      id: uid(),
      from: t.from || '', to: t.to || '',
      departDate: t.departDate || '', departTime: t.departTime || '',
      arriveDate: t.arriveDate || '', arriveTime: t.arriveTime || '',
      carrier: t.carrier || '', number: t.number || '', seat: t.seat || ''
    }]
  };
}

function ensureTrip(t){
  if(!t.budget){
    t.budget = {
      total: 0,
      categories: DEFAULT_CATEGORIES.map(c => ({ id: uid(), name: c.name, planned: 0, color: c.color })),
      expenses: [],
      savings: []
    };
  }
  if(!Array.isArray(t.lodging)) t.lodging = [];
  if(!Array.isArray(t.tickets)) t.tickets = [];
  t.tickets = t.tickets.map(migrateTicket);
  if(!t.checklists || typeof t.checklists !== 'object') t.checklists = { packing: [], shopping: [] };
  if(!Array.isArray(t.checklists.packing)) t.checklists.packing = [];
  if(!Array.isArray(t.checklists.shopping)) t.checklists.shopping = [];
  if(!t.currency) t.currency = 'RUB';
  if(!t.rates) t.rates = { ...DEFAULT_RATES };
  if(!t.me) t.me = 'Я';
  if(!t.dayStart) t.dayStart = '09:00';
  if(!t.dayEnd) t.dayEnd = '21:00';
  if(t.lunchStart === undefined) t.lunchStart = '13:00';
  if(t.lunchEnd === undefined) t.lunchEnd = '14:00';
  if(Array.isArray(t.activities)){
    t.activities.forEach(a => {
      if(typeof a.duration !== 'number') a.duration = 60;
      if(!a.type) a.type = 'other';
      if(a.openFrom === undefined) a.openFrom = '';
      if(a.openTo === undefined) a.openTo = '';
    });
  }
  if(t.budget && Array.isArray(t.budget.expenses)){
    t.budget.expenses.forEach(e => {
      if(!e.paidBy) e.paidBy = t.me || 'Я';
      if(typeof e.splitWith !== 'number' || e.splitWith < 1) e.splitWith = 1;
    });
  }
  return t;
}

function tripStatus(t){
  const today = todayISO();
  const end = t.end || t.start;
  if(!t.start && !t.end) return { kind:'undated' };
  if(end && end < today) return { kind:'past' };
  if(t.start && t.start > today){
    const d = daysUntil(t.start);
    if(d <= 30) return { kind:'soon', days:d };
    return { kind:'future' };
  }
  return { kind:'active' };
}
function getVisibleTrips(){
  const q = state.query.trim().toLowerCase();
  let list = trips.slice();
  if(q){
    list = list.filter(t =>
      (t.title||'').toLowerCase().includes(q) ||
      (t.place||'').toLowerCase().includes(q)
    );
  }
  if(state.filter === 'active'){
    list = list.filter(t => {
      const s = tripStatus(t).kind;
      return s === 'active' || s === 'soon' || s === 'future' || s === 'undated';
    });
  } else if(state.filter === 'past'){
    list = list.filter(t => tripStatus(t).kind === 'past');
  }
  return list;
}

const MONTHS_RU = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function monthKeyOf(t){
  const d = t.start || t.end;
  if(!d) return { key:'undated', label:'Без даты', order:Infinity };
  const dt = new Date(d + 'T00:00:00');
  const y = dt.getFullYear(); const m = dt.getMonth();
  const key = `${y}-${String(m+1).padStart(2,'0')}`;
  const label = `${MONTHS_RU[m][0].toUpperCase()}${MONTHS_RU[m].slice(1)} ${y}`;
  return { key, label, order: y*12 + m };
}
function groupTrips(list){
  const map = new Map();
  const now = new Date(); now.setHours(0,0,0,0);
  const currentOrder = now.getFullYear()*12 + now.getMonth();
  list.forEach(t => {
    const mk = monthKeyOf(t);
    if(!map.has(mk.key)){
      map.set(mk.key, { key: mk.key, label: mk.label, order: mk.order, trips: [], past: mk.order !== Infinity && mk.order < currentOrder });
    }
    map.get(mk.key).trips.push(t);
  });
  map.forEach(g => {
    g.trips.sort((a,b)=>{
      const da = a.start || a.end || '9999-99-99';
      const db = b.start || b.end || '9999-99-99';
      return da.localeCompare(db);
    });
  });
  const groups = Array.from(map.values());
  const future = groups.filter(g => g.order !== Infinity && g.order >= currentOrder).sort((a,b)=> a.order - b.order);
  const past   = groups.filter(g => g.order !== Infinity && g.order <  currentOrder).sort((a,b)=> b.order - a.order);
  const undated = groups.filter(g => g.order === Infinity);
  return [...future, ...past, ...undated];
}
function toggleGroup(key){
  if(state.collapsed[key]) delete state.collapsed[key];
  else state.collapsed[key] = true;
  render();
}

/* =============== БЮДЖЕТ =============== */
function calcBudget(t){
  ensureTrip(t);
  const b = t.budget;
  const total = b.total || 0;

  const shoppingInBudget = (t.checklists && t.checklists.shopping || [])
    .filter(x => x.addToBudget && !x.done)
    .reduce((a, x) => a + (Number(x.price) || 0), 0);

  let plannedRUB = 0;
  const byCat = {};
  b.categories.forEach(c => {
    byCat[c.id] = { cat:c, planned: c.planned||0, fact:0, shopping:0 };
    plannedRUB += (c.planned||0);
  });
  const shoppingCat = b.categories.find(c => c.name.toLowerCase() === 'шоппинг');
  if(shoppingCat && byCat[shoppingCat.id]){
    byCat[shoppingCat.id].shopping = shoppingInBudget;
    byCat[shoppingCat.id].planned += shoppingInBudget;
    plannedRUB += shoppingInBudget;
  }

  let factRUB = 0;
  b.expenses.forEach(e => {
    const sum = e.priceInRUB ? (e.amount||0) : toRUB(e.amount||0, t.currency, t);
    factRUB += sum;
    if(byCat[e.categoryId]) byCat[e.categoryId].fact += sum;
  });

  const left = total - factRUB;
  const percent = total ? Math.min(100, Math.round(factRUB / total * 100)) : 0;
  let barClass = '';
  if(percent >= 100) barClass = 'danger';
  else if(percent >= 80) barClass = 'warn';

  const savings = b.savings.map(s => {
    const saved = (s.transactions||[]).reduce((acc, tr)=> acc + (tr.amount||0), 0);
    const target = s.target||0;
    const pct = target ? Math.min(100, Math.round(saved/target*100)) : 0;
    return { ...s, saved, pct };
  });
  const totalSaved = savings.reduce((a,s)=> a + s.saved, 0);

  return { total, plannedRUB, factRUB, left, percent, barClass, byCat: Object.values(byCat), savings, totalSaved, shoppingInBudget };
}

function calcSplits(t){
  ensureTrip(t);
  const me = t.me || 'Я';
  const expenses = (t.budget && t.budget.expenses) || [];
  const rubOf = e => e.priceInRUB ? (e.amount||0) : toRUB(e.amount||0, t.currency, t);
  let myPaid = 0;
  let myShare = 0;
  const others = {};
  expenses.forEach(e => {
    const rub = rubOf(e);
    const n = Math.max(1, parseInt(e.splitWith, 10) || 1);
    const share = rub / n;
    const paidBy = e.paidBy || me;
    if(paidBy === me){
      myPaid += rub;
      if(n > 1){
        const perOther = (rub - share) / (n - 1);
        for(let i=1; i<n; i++){
          const name = `Участник ${i}`;
          others[name] = others[name] || { name, paid:0, owesMe:0, iOwe:0 };
          others[name].owesMe += perOther;
        }
      }
    } else {
      const name = paidBy;
      others[name] = others[name] || { name, paid:0, owesMe:0, iOwe:0 };
      others[name].paid += rub;
      myShare += share;
      others[name].iOwe += share;
    }
  });
  const balance = myPaid - myShare;
  return { me, myPaid, myShare, balance, others: Object.values(others).sort((a,b)=> (b.owesMe - b.iOwe) - (a.owesMe - a.iOwe)) };
}

function calcByDays(t){
  ensureTrip(t);
  const days = daysBetween(t.start, t.end);
  if(!days.length) return { days: [], totalPlan: 0, totalFact: 0, prepaidTotal: 0, diff: 0 };
  const total = t.budget.total || 0;
  const planPerDay = days.length ? total / days.length : 0;
  const rubOf = e => e.priceInRUB ? (e.amount||0) : toRUB(e.amount||0, t.currency, t);
  const expenses = t.budget.expenses || [];
  const prepaidTotal = expenses.filter(e => e.isPrepaid).reduce((a, e) => a + rubOf(e), 0);
  const dailyExpenses = expenses.filter(e => !e.isPrepaid);
  const rows = days.map(d => {
    const fact = dailyExpenses.filter(e => (e.date || '') === d).reduce((a, e) => a + rubOf(e), 0);
    return { date:d, plan:planPerDay, fact, diff:planPerDay - fact, isToday: d === todayISO() };
  });
  const totalPlan = planPerDay * days.length;
  const totalFact = rows.reduce((a,r)=> a + r.fact, 0);
  return { days: rows, totalPlan, totalFact, diff: totalPlan - totalFact, prepaidTotal };
}

/* =============== РЕНДЕР =============== */
const app = document.getElementById('app');

function isDesktop(){ return window.matchMedia && window.matchMedia('(min-width: 1100px)').matches; }

function render(){
  if(state.view==='list') renderList();
  else if(state.view==='new') renderNew();
  else if(state.view==='editTrip') renderEditTrip();
  else if(state.view==='trip') renderTrip();
}

/* ---------- Список ---------- */
function renderList(){
  const list = getVisibleTrips();
  const groups = groupTrips(list);
  const isEmpty = trips.length === 0;
  const noResults = !isEmpty && list.length === 0;

  app.innerHTML = `
    <header>
      <h1>✈️ Мои поездки</h1>
      <button class="icon-btn" onclick="openMenu()" title="Меню">⋯</button>
      <button class="icon-btn" onclick="toggleTheme()" title="Следующая: ${themeLabel()}">${themeIcon()}</button>
    </header>
    ${isEmpty ? '' : `
      <div class="search-wrap">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input id="search-input" placeholder="Поиск по названию или месту..."
                 value="${esc(state.query)}" oninput="onSearchInput(this.value)" />
          ${state.query ? `<button class="clear-btn" onclick="clearSearch()">✕</button>` : ''}
        </div>
        <div class="chips">
          <div class="chip ${state.filter==='all'?'active':''}" onclick="setFilter('all')">Все</div>
          <div class="chip ${state.filter==='active'?'active':''}" onclick="setFilter('active')">Активные</div>
          <div class="chip ${state.filter==='past'?'active':''}" onclick="setFilter('past')">Прошедшие</div>
        </div>
      </div>`}
    <div class="list">
      ${isEmpty
  ? `<div class="empty emoji-plane">Пока нет поездок.<br>Нажмите «+», чтобы создать первую.</div>`
  : noResults
    ? `<div class="empty emoji-search">Ничего не найдено.<br>Попробуйте изменить запрос или фильтр.</div>`
    : groups.map(groupBlock).join('')}
    </div>
    <button class="btn fab" onclick="state.view='new';render()">+</button>
  `;
  const si = document.getElementById('search-input');
  if(si && state.query){
    si.focus();
    si.setSelectionRange(si.value.length, si.value.length);
  }
}
function groupBlock(g){
  const collapsed = !!state.collapsed[g.key];
  const pastClass = g.past ? 'past' : '';
  return `
    <div class="group ${collapsed?'collapsed':''} ${pastClass}">
      <div class="group-head" onclick="toggleGroup('${g.key}')">
        <span class="arrow">▼</span>
        <span class="title">${esc(g.label)}</span>
        <span class="count">${g.trips.length}</span>
      </div>
      <div class="group-body">${g.trips.map(tripCard).join('')}</div>
    </div>`;
}
function tripCard(t){
  const st = tripStatus(t);
  let badge = '';
  if(st.kind === 'soon'){
    const label = st.days === 0 ? 'Сегодня' : st.days === 1 ? 'Завтра' : `Через ${st.days} дн.`;
    badge = `<span class="badge">${label}</span>`;
  } else if(st.kind === 'active'){
    badge = `<span class="badge active">Сейчас</span>`;
  }
  const past = st.kind === 'past' ? 'past' : '';
  let budgetLine = '';
  ensureTrip(t);
  if(t.budget.total){
    const factRUB = t.budget.expenses.reduce((a,e)=> a + (e.priceInRUB ? (e.amount||0) : toRUB(e.amount||0, t.currency, t)), 0);
    budgetLine = ` · 💰 ${fmtMoney(factRUB, 'RUB')} / ${fmtMoney(t.budget.total, 'RUB')}`;
  }
  return `
    <div class="card ${past}" onclick="openTrip('${t.id}')">
      ${badge}
      <h3>${esc(t.title)}</h3>
      <div class="meta">${esc(t.place||'—')} · ${fmtDate(t.start)} — ${fmtDate(t.end)} · ${t.activities.length} мест${budgetLine}</div>
    </div>`;
}
let searchTimer = null;
function onSearchInput(value){
  state.query = value;
  clearTimeout(searchTimer);

/* =============== ПОГОДА =============== */
const WEATHER_EMOJI = { 0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️', 45:'🌫️', 48:'🌫️', 51:'🌦️', 53:'🌦️', 55:'🌦️', 56:'🌧️', 57:'🌧️', 61:'🌧️', 63:'🌧️', 65:'🌧️', 66:'🌧️', 67:'🌧️', 71:'🌨️', 73:'🌨️', 75:'❄️', 77:'❄️', 80:'🌦️', 81:'🌧️', 82:'⛈️', 85:'🌨️', 86:'❄️', 95:'⛈️', 96:'⛈️', 99:'⛈️' };
const WEATHER_DESC = { 0:'ясно', 1:'почти ясно', 2:'переменная облачность', 3:'облачно', 45:'туман', 48:'туман', 51:'лёгкая морось', 53:'морось', 55:'сильная морось', 56:'лёгкий ледяной дождь', 57:'ледяной дождь', 61:'небольшой дождь', 63:'дождь', 65:'сильный дождь', 66:'лёгкий ледяной дождь', 67:'ледяной дождь', 71:'небольшой снег', 73:'снег', 75:'сильный снег', 77:'снежные зёрна', 80:'ливни', 81:'ливни', 82:'сильные ливни', 85:'снегопад', 86:'сильный снегопад', 95:'гроза', 96:'гроза с градом', 99:'сильная гроза с градом' };

function weatherCacheKey(tripId){ return 'weather_' + tripId; }

async function getWeatherForTrip(trip){
  let lat = trip.weatherLat, lng = trip.weatherLng;
  if(lat == null || lng == null){
    if(!trip.place) return null;
    const geoKey = 'geo_' + trip.id;
    try{
      const cached = JSON.parse(localStorage.getItem(geoKey) || 'null');
      if(cached && cached.place === trip.place && Date.now() - cached.ts < 86400000){
        lat = cached.lat; lng = cached.lng;
      } else {
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ru&q=${encodeURIComponent(trip.place)}`;
        const res = await fetch(url, { headers: { 'Accept':'application/json' } });
        if(!res.ok) return null;
        const data = await res.json();
        if(!data.length) return null;
        lat = parseFloat(data[0].lat);
        lng = parseFloat(data[0].lon);
        localStorage.setItem(geoKey, JSON.stringify({ place: trip.place, lat, lng, ts: Date.now() }));
      }
      trip.weatherLat = lat;
      trip.weatherLng = lng;
    }catch(e){ console.error('Ошибка геокодинга:', e); return null; }
  }
  const cacheKey = weatherCacheKey(trip.id);
  try{
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if(cached && cached.lat === lat && cached.lng === lng && Date.now() - cached.fetchedAt < 86400000){
      return cached.byDate;
    }
  }catch(e){}
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=16`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    if(!data.daily || !data.daily.time) return null;
    const byDate = {};
    data.daily.time.forEach((d, i) => {
      byDate[d] = { code: data.daily.weather_code[i], tmax: Math.round(data.daily.temperature_2m_max[i]), tmin: Math.round(data.daily.temperature_2m_min[i]) };
    });
    localStorage.setItem(cacheKey, JSON.stringify({ lat, lng, fetchedAt: Date.now(), byDate }));
    return byDate;
  }catch(e){ console.error('Ошибка загрузки погоды:', e); return null; }
}
function weatherLineHtml(dateStr, weather){
  const today = todayISO();
  if(dateStr < today) return '';
  if(!weather){
    const diff = daysUntil(dateStr);
    if(diff > 16) return `<div class="weather-line">🌤️ <span class="desc">прогноз появится позже</span></div>`;
    return '';
  }
  const w = weather[dateStr];
  if(!w){
    const diff = daysUntil(dateStr);
    if(diff > 16) return `<div class="weather-line">🌤️ <span class="desc">прогноз появится позже</span></div>`;
    return '';
  }
  const emoji = WEATHER_EMOJI[w.code] || '🌤️';
  const desc = WEATHER_DESC[w.code] || '';
  return `<div class="weather-line"><span class="emoji">${emoji}</span><span class="temp">+${w.tmax}° / +${w.tmin}°</span><span class="desc">${desc}</span></div>`;
}

/* =============== ВКЛАДКА «ПЛАН» =============== */
function renderPlan(trip){
  const c = document.getElementById('tab-content');
  const days = daysBetween(trip.start, trip.end);
  let html = '<div class="list">';
  if(trip.notes) html += `<div class="card" style="cursor:default"><div class="meta">📝 ${esc(trip.notes)}</div></div>`;

  if(days.length===0){
    html += `<div class="empty">Укажите даты поездки, чтобы разбить план по дням.</div>`;
    if(trip.activities.length){
      html += `<div class="day-title">Без даты</div>`;
      html += trip.activities.filter(a=>!a.date).map(actCard).join('');
    }
  } else {
    const weatherByDate = trip._weatherByDate || null;
    days.forEach(d => {
      const isToday = d === todayISO();
      const list = trip.activities.filter(a=>a.date===d);
      const label = new Date(d).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'});
      html += `<div class="day-title">${isToday ? '🔵 ' : ''}${label}${isToday ? ' · сегодня' : ''}</div>`;
      const wLine = weatherLineHtml(d, weatherByDate);
      if(wLine) html += wLine;

      const lodges = (trip.lodging||[]).filter(l => {
        const from = l.checkInDate || l.checkOutDate || '';
        const to = l.checkOutDate || l.checkInDate || '';
        if(!from) return false;
        return d >= from && d <= to;
      });
      lodges.forEach(l => {
        html += `<div class="lodge-day" onclick="openLodgingModal('${l.id}')">
          <span class="icon">🏠</span>
          <span class="name">${esc(l.title||'Жильё')}</span>
          <span style="margin-left:auto">${l.checkOutDate===d?'выезд':(l.checkInDate===d?'заезд':'')}</span>
        </div>`;
      });

      const tks = (trip.tickets||[]).map(tk => {
        const legs = (tk.segments||[]).filter(sg => sg.departDate === d || sg.arriveDate === d);
        return legs.length ? { ticket: tk, legs } : null;
      }).filter(Boolean);
      tks.forEach(({ticket, legs}) => {
        const route = ticketRouteText(ticket);
        const legsText = legs.map(sg => {
          const isDep = sg.departDate === d;
          const isArr = sg.arriveDate === d;
          const time = isDep && sg.departTime ? `отпр. ${sg.departTime}` : isArr && sg.arriveTime ? `приб. ${sg.arriveTime}` : '';
          return `${esc(sg.from||'—')} → ${esc(sg.to||'—')}${time?' · '+time:''}`;
        }).join('<br>');
        html += `<div class="ticket-day" onclick="openTicketModal('${ticket.id}')">
          <span class="icon">${ticketIcon(ticket.type)}</span>
          <div class="info">
            <span class="route">${esc(route)}</span>
            <span class="legs">${legsText}</span>
          </div>
        </div>`;
      });

      html += list.length ? list.map(actCard).join('') : `<div class="meta" style="padding:4px 4px 10px">— пусто —</div>`;
    });
    const undated = trip.activities.filter(a=>!a.date);
    if(undated.length){
      html += `<div class="day-title">Без даты</div>` + undated.map(actCard).join('');
    }
  }
  html += '</div>';
  c.innerHTML = html;
  c.querySelectorAll('.act').forEach(el => attachSwipe(el));

  if(!trip._weatherByDate){
    getWeatherForTrip(trip).then(byDate => {
      trip._weatherByDate = byDate || {};
      if(state.view==='trip' && state.tripTab==='plan') render();
    }).catch(()=>{ trip._weatherByDate = {}; });
  }
}
function ticketRouteText(t){
  const segs = t.segments || [];
  if(!segs.length) return 'Билет';
  const points = [segs[0].from || '—'];
  segs.forEach(sg => points.push(sg.to || '—'));
  return points.join(' → ');
}
function actCard(a){
  const total = (a.checklist||[]).length;
  const done = (a.checklist||[]).filter(c=>c.done).length;
  const typeIcon = placeTypeIcon(a.type);
  const duration = a.duration ? fmtDuration(a.duration) : '';
  const openHours = (a.openFrom && a.openTo) ? `${a.openFrom}–${a.openTo}` : '';
  const metaParts = [];
  if(a.time) metaParts.push(`🕒 ${esc(a.time)}`);
  if(duration) metaParts.push(`⏱ ${duration}`);
  if(openHours) metaParts.push(`🕐 ${openHours}`);
  const metaLine = metaParts.length ? `<div class="meta">${metaParts.join(' · ')}</div>` : '';
  const mapLinks = a.lat!=null && a.lng!=null ? `
    <div class="map-links">
      <a href="https://yandex.ru/maps/?pt=${a.lng},${a.lat}&z=15&l=map" target="_blank" onclick="event.stopPropagation()">🟡 Яндекс</a>
      <a href="https://www.google.com/maps/search/?api=1&query=${a.lat},${a.lng}" target="_blank" onclick="event.stopPropagation()">🔵 Google</a>
    </div>` : '';
  return `
    <div class="act-wrap">
      <button class="act-delete" onclick="delActivity('${a.id}')">Удалить</button>
      <div class="act" data-id="${a.id}" onclick="openActivityModal('${a.id}')">
        <div class="pin">${typeIcon}</div>
        <div class="body">
          <b>${esc(a.title)}</b>
          ${metaLine}
          ${a.notes?`<p>${esc(a.notes)}</p>`:''}
          ${total?`<div class="check-progress">✓ ${done}/${total}</div>`:''}
          ${mapLinks}
        </div>
      </div>
    </div>`;
}

const PLACE_TYPES = [
  { id:'museum', icon:'🏛️', label:'Музей' },
  { id:'food', icon:'🍽️', label:'Еда' },
  { id:'walk', icon:'🚶', label:'Прогулка' },

  { id:'nature', icon:'🌳', label:'Природа' },
  { id:'fun', icon:'🎡', label:'Развлечение' },
  { id:'other', icon:'📍', label:'Другое' }
];
function placeTypeIcon(type){
  const t = PLACE_TYPES.find(x=>x.id===type);
  return t ? t.icon : '📍';
}
function placeTypeLabel(type){
  const t = PLACE_TYPES.find(x=>x.id===type);
  return t ? t.label : 'Другое';
}
function fmtDuration(min){
  if(!min || min <= 0) return '';
  if(min < 60) return `${min} мин`;
  const h = Math.floor(min/60); const m = min % 60;
  return m ? `${h} ч ${m} мин` : `${h} ч`;
}

function renderPlacesTab(trip){
  const c = document.getElementById('tab-content');
  const days = daysBetween(trip.start, trip.end);
  const unassigned = (trip.activities||[]).filter(a => !a.date);
  const assigned = (trip.activities||[]).filter(a => a.date);
  const byDay = {};
  days.forEach(d => { byDay[d] = []; });
  assigned.forEach(a => {
    if(!byDay[a.date]) byDay[a.date] = [];
    byDay[a.date].push(a);
  });
  Object.values(byDay).forEach(list => {
    list.sort((a,b)=>{
      const ta = a.time || '99:99';
      const tb = b.time || '99:99';
      return ta.localeCompare(tb);
    });
  });

  let html = '<div class="places-wrap">';
  html += `<div class="places-actions">
    <button class="btn-mini" onclick="openActivityModal()">+ Добавить место</button>
    <button class="btn-mini primary" onclick="openAutoDistributeModal()">🧭 Рассчитать по дням</button>
  </div>`;
  html += `<div class="places-section">
    <div class="places-section-head"><span>⏳ Не распределено</span><span class="counter">${unassigned.length}</span></div>
    <div>${unassigned.length === 0
      ? `<div class="places-empty">Все места распределены.</div>`
      : unassigned.map(a => placeCard(a, false)).join('')}</div>
  </div>`;

  if(days.length === 0){
    html += `<div class="places-section"><div class="places-empty">Укажи даты поездки.</div></div>`;
  } else {
    days.forEach(d => {
      const list = byDay[d] || [];
      const isToday = d === todayISO();
      const label = new Date(d).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'});
      html += `<div class="places-section">
        <div class="places-section-head"><span>${isToday ? '🔵 ' : ''}${esc(label)}</span><span class="counter">${list.length}</span></div>
        <div>${list.length === 0 ? `<div class="places-empty">— пусто —</div>` : list.map(a => placeCard(a, true)).join('')}</div>
      </div>`;
    });
  }

  const failedMap = {};
  (trip._autoFailed || []).forEach(f => { failedMap[f.id] = f.reason; });
  const failedItems = (trip.activities || []).filter(a => failedMap[a.id] && !a.date);
  if(failedItems.length){
    html += `<div class="places-section warning">
      <div class="places-section-head"><span>⚠️ Не поместилось</span><span class="counter">${failedItems.length}</span></div>
      <div>${failedItems.map(a => `
        <div class="place-item" onclick="openActivityModal('${a.id}')">
          <div class="pin">${placeTypeIcon(a.type)}</div>
          <div class="body">
            <div class="title">${esc(a.title||'Без названия')}</div>
            <div class="reason">${esc(failedMap[a.id] || 'не влезло по времени')}</div>
          </div>
        </div>`).join('')}</div>
    </div>`;
  }

  html += '</div>';
  c.innerHTML = html;
}
function placeCard(a, assigned){
  const typeIcon = placeTypeIcon(a.type);
  const duration = a.duration ? fmtDuration(a.duration) : '';
  const openHours = (a.openFrom && a.openTo) ? `${a.openFrom}–${a.openTo}` : '';
  const metaParts = [];
  if(duration) metaParts.push(`<span class="tag">⏱ ${duration}</span>`);
  if(openHours) metaParts.push(`<span class="tag">🕐 ${openHours}</span>`);
  if(a.type && a.type !== 'other') metaParts.push(`<span class="tag">${typeIcon} ${placeTypeLabel(a.type)}</span>`);
  if(!a.lat && !a.lng) metaParts.push(`<span class="tag" style="color:var(--danger)">⚠ нет координат</span>`);
  const timeBadge = assigned && a.time
    ? `<span class="time-badge">${a.time}</span>`
    : (assigned ? `<span class="time-badge">—</span>` : `<span class="time-badge">в пуле</span>`);
  return `<div class="place-item ${assigned?'':'unassigned'}" onclick="openActivityModal('${a.id}')">
    <div class="pin">${typeIcon}</div>
    <div class="body">
      <div class="title">${esc(a.title||'Без названия')}</div>
      ${metaParts.length ? `<div class="meta">${metaParts.join('')}</div>` : ''}
      ${a.notes?`<div class="meta" style="margin-top:4px">${esc(a.notes)}</div>`:''}
    </div>
    ${timeBadge}
  </div>`;
}

/* =============== АВТОРАСПРЕДЕЛЕНИЕ =============== */
function timeToMin(t){
  if(!t) return null;
  const [h, m] = t.split(':').map(x => parseInt(x, 10));
  if(isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}
function minToTime(min){
  min = Math.max(0, Math.min(24*60, Math.round(min)));
  const h = Math.floor(min / 60); const m = min % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

      <div class="auto-options">

          <option value="merge">Дозаполнить</option>
        </select>

    </div>
    <div class="modal-foot"><button class="btn" onclick="runAutoDistribute()">Рассчитать</button></div>
  `);
  const lunchOn = document.getElementById('ad-lunch-on');

function runAutoDistribute(){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const startStr = document.getElementById('ad-start').value || '09:00';
  const endStr = document.getElementById('ad-end').value || '21:00';
  const lunchOn = document.getElementById('ad-lunch-on').checked;
  const lunchStartStr = lunchOn ? (document.getElementById('ad-lunch-start').value || '') : '';
  const lunchEndStr = lunchOn ? (document.getElementById('ad-lunch-end').value || '') : '';
  const saveDefaults = document.getElementById('ad-save-defaults').checked;
  const evenMode = document.getElementById('ad-even').checked;
  const mode = document.getElementById('ad-mode').value;

  const dayStart = timeToMin(startStr);
  const dayEnd = timeToMin(endStr);
  if(dayStart == null || dayEnd == null || dayEnd <= dayStart){ alert('Проверь часы дня.'); return; }
  const lunchStart = timeToMin(lunchStartStr);
  const lunchEnd = timeToMin(lunchEndStr);
  if(lunchOn && lunchStart != null && lunchEnd != null && lunchEnd <= lunchStart){ alert('Проверь обед.'); return; }

  if(saveDefaults){
    trip.dayStart = startStr; trip.dayEnd = endStr;
    trip.lunchStart = lunchOn ? (lunchStartStr || '') : '';
    trip.lunchEnd = lunchOn ? (lunchEndStr || '') : '';
  }

  const days = daysBetween(trip.start, trip.end);
  if(!days.length){ alert('Нет дней.'); return; }

  let pool;
  if(mode === 'reset'){
    trip.activities.forEach(a => { a.date = ''; a.time = ''; });
    pool = trip.activities.slice();
  } else {
    pool = trip.activities.filter(a => !a.date);
  }
  if(!pool.length){ alert('Нет мест.'); return; }

  const booked = {};
  days.forEach(d => { booked[d] = []; });
  trip.activities.forEach(a => {
    if(a.date && days.includes(a.date)) booked[a.date].push(a);
  });

  function lodgingForDay(d){
    return (trip.lodging||[]).find(l => {
      const from = l.checkInDate || l.checkOutDate || '';
      const to = l.checkOutDate || l.checkInDate || '';
      if(!from) return false;
      return d >= from && d <= to;
    }) || null;
  }

  const sortedPool = pool.slice().sort((a, b) => {
    const da = Number(a.duration) || 60;
    const db = Number(b.duration) || 60;
    if(db !== da) return db - da;
    const oa = (a.openFrom && a.openTo) ? 1 : 0;
    const ob = (b.openFrom && b.openTo) ? 1 : 0;
    return ob - oa;
  });

  const placed = [];
  const failed = [];

  function buildFreeWindows(day){
    const busy = [];
    booked[day].forEach(a => {
      const t = timeToMin(a.time);
      if(t == null) return;
      const dur = Number(a.duration) || 60;
      busy.push([t, t + dur]);
    });
    busy.sort((a,b)=> a[0] - b[0]);
    const windows = [];
    let cur = dayStart;
    const lunchBlock = (lunchOn && lunchStart != null && lunchEnd != null) ? [[lunchStart, lunchEnd]] : [];
    const allBlocks = [...busy, ...lunchBlock].sort((a,b)=> a[0] - b[0]);
    allBlocks.forEach(([bs, be]) => {
      if(bs > cur && bs <= dayEnd) windows.push([cur, bs]);
      if(be > cur) cur = be;
    });
    if(cur < dayEnd) windows.push([cur, dayEnd]);
    return windows.filter(w => w[1] - w[0] >= 15);
  }
  function distance(a1, b1, a2, b2){
    if(a1==null||b1==null||a2==null||b2==null) return 0;
    const R = 6371, toRad = x => x * Math.PI / 180;
    const dLat = toRad(a2 - a1), dLon = toRad(b2 - b1);
    const A = Math.sin(dLat/2)**2 + Math.cos(toRad(a1))*Math.cos(toRad(a2))*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(A));
  }
  function fitsInWindow(item, ws, we){
    const dur = Number(item.duration) || 60;
    const openFrom = timeToMin(item.openFrom);
    const openTo = timeToMin(item.openTo);
    let start = ws;
    if(openFrom != null && start < openFrom) start = openFrom;
    const end = start + dur;
    if(end > we) return null;
    if(openTo != null && end > openTo) return null;
    return { start, end };
  }

  const remaining = sortedPool.slice();

  // Равномерное распределение — по КОЛИЧЕСТВУ мест в день
  let targetPerDayCount = Infinity;
  if(evenMode){
    targetPerDayCount = Math.max(1, Math.ceil(sortedPool.length / days.length));
  }

  days.forEach(day => {
    const windows = buildFreeWindows(day);
    if(!windows.length) return;
    const lodge = lodgingForDay(day);
    let currentLat = lodge ? lodge.lat : null;
    let currentLng = lodge ? lodge.lng : null;
    let dayUsedCount = 0;
    let guard = 0;
    while(remaining.length && guard < 200){
      guard++;
      let placedThis = false;
      for(let wi = 0; wi < windows.length; wi++){
        const [ws, we] = windows[wi];
        if(we - ws < 15) continue;
        let best = null, bestIdx = -1, bestStart = null, bestScore = Infinity;
        for(let i = 0; i < remaining.length; i++){
          const item = remaining[i];
          const fit = fitsInWindow(item, ws, we);
          if(!fit) continue;
          if(evenMode && dayUsedCount >= targetPerDayCount) continue;
          let score = 0;
          if(currentLat != null && currentLng != null && item.lat != null && item.lng != null){
            score = distance(currentLat, currentLng, item.lat, item.lng);
          }
          if(score < bestScore){
            bestScore = score; best = item; bestIdx = i; bestStart = fit.start;
          }
        }
        if(best){
          const dur = Number(best.duration) || 60;
          best.date = day;
          best.time = minToTime(bestStart);
          placed.push(best);
          remaining.splice(bestIdx, 1);
          dayUsedCount += 1;
          windows[wi] = [bestStart + dur, we];
          if(best.lat != null && best.lng != null){ currentLat = best.lat; currentLng = best.lng; }
          placedThis = true;
          break;
        }
      }
      if(!placedThis) break;
    }
  });

  remaining.forEach(item => {
    const dur = Number(item.duration) || 60;
    const openFrom = timeToMin(item.openFrom);
    const openTo = timeToMin(item.openTo);
    let reason = 'не влезло по времени';
    if(openFrom != null && openTo != null){
      if(openTo - openFrom < dur) reason = 'окно работы меньше длительности';
      else if(openTo <= dayStart || openFrom >= dayEnd) reason = 'не попадает в часы дня';
    }
    failed.push({ item, reason });
  });

  trip._autoFailed = failed.map(f => ({ id: f.item.id, reason: f.reason }));
  DB.save(trips);
  closeModal();
  render();
  setTimeout(()=> alert(`Распределено: ${placed.length}. Не поместилось: ${failed.length}.`), 80);
}

/* =============== СВАЙП =============== */
function attachSwipe(el){
  let startX=0, startY=0, dx=0, dragging=false, decided=false, isHorizontal=false;
  const MAX = 90, THRESHOLD = 45;
  el.addEventListener('pointerdown', e=>{
    if(e.target.closest('a,button')) return;
    startX = e.clientX; startY = e.clientY;
    dx = 0; dragging = true; decided = false; isHorizontal = false;
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const mx = e.clientX - startX;
    const my = e.clientY - startY;
    if(!decided){
      if(Math.abs(mx) > 6 || Math.abs(my) > 6){
        decided = true;
        isHorizontal = Math.abs(mx) > Math.abs(my);
        if(!isHorizontal){ dragging = false; el.classList.remove('dragging'); }
      }
    }
    if(isHorizontal){
      dx = Math.max(-MAX, Math.min(0, mx));
      el.style.transform = `translateX(${dx}px)`;
      if(Math.abs(mx) > 4) e.preventDefault();
    }
  });
  const finish = ()=>{
    if(!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    if(dx < -THRESHOLD){
      el.style.transform = `translateX(-${MAX}px)`;
      el.dataset.open = '1';
    } else {
      el.style.transform = 'translateX(0)';
      el.dataset.open = '';
    }
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', finish);
  el.addEventListener('pointerleave', finish);
  el.addEventListener('click', e=>{
    if(el.dataset.open === '1'){
      e.preventDefault(); e.stopPropagation();
      el.style.transform = 'translateX(0)';
      el.dataset.open = '';
    }
  }, true);
}

/* =========================================================
   ГЕОКОДИНГ БИЛЕТОВ
   =========================================================
   Точки from/to геокодируются через Nominatim и кэшируются
   в trip._ticketGeoCache. Чтобы не нарушать лимит 1 запрос/сек,
   делаем последовательную очередь с задержкой 1100 мс.
*/
function ticketGeoCacheKey(tripId){ return 'ticketGeo_' + tripId; }

function loadTicketGeoCache(trip){
  if(trip._ticketGeoCache) return trip._ticketGeoCache;
  try{
    const raw = localStorage.getItem(ticketGeoCacheKey(trip.id));
    trip._ticketGeoCache = raw ? JSON.parse(raw) : {};
  }catch(e){
    trip._ticketGeoCache = {};
  }
  return trip._ticketGeoCache;
}

function saveTicketGeoCache(trip){
  try{
    localStorage.setItem(ticketGeoCacheKey(trip.id), JSON.stringify(trip._ticketGeoCache || {}));
  }catch(e){}
}

/* Собираем все уникальные точки из билетов */
function collectTicketPoints(trip){
  const set = new Set();
  (trip.tickets||[]).forEach(tk => {
    (tk.segments||[]).forEach(sg => {
      if(sg.from) set.add(sg.from.trim());
      if(sg.to) set.add(sg.to.trim());
    });
  });
  return Array.from(set).filter(Boolean);
}

/* Асинхронный геокодинг. callback вызывается, если что-то догрузилось. */
async function geocodeTicketPoints(trip, callback){
  const cache = loadTicketGeoCache(trip);
  const all = collectTicketPoints(trip);
  const missing = all.filter(name => !cache[name]);

  if(!missing.length){
    if(callback) callback();
    return;
  }

  let changed = false;

  for(const name of missing){
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ru&q=${encodeURIComponent(name)}`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if(data.length){
        cache[name] = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
        changed = true;
      } else {
        // Помечаем как «не найдено», чтобы не дёргать снова
        cache[name] = null;
      }
    }catch(e){
      console.warn('Геокодинг не удался:', name, e);
      // Не помечаем как null — попробуем в следующий раз
    }
    // Лимит Nominatim: 1 запрос в секунду
    await new Promise(r => setTimeout(r, 1100));
  }

  if(changed){
    trip._ticketGeoCache = cache;
    saveTicketGeoCache(trip);
    if(callback) callback();
  }
}

const ROUTE_COLORS = ['#2aabee','#34c759','#ff9500','#af52de','#ff2d55','#00c7be','#5856d6','#ffcc00'];
function lodgingForDay(trip, day){
  return (trip.lodging||[]).find(l => {
    const from = l.checkInDate || l.checkOutDate || '';
    const to = l.checkOutDate || l.checkInDate || '';
    if(!from) return false;
    return day >= from && day <= to && l.lat != null && l.lng != null;
  }) || null;
}
function activitiesForDay(trip, day){
  return (trip.activities||[]).filter(a => a.date === day && a.lat != null && a.lng != null);
}
function haversineKm(a1, b1, a2, b2){
  const R = 6371, toRad = x => x * Math.PI / 180;
  const dLat = toRad(a2 - a1), dLon = toRad(b2 - b1);
  const A = Math.sin(dLat/2)**2 + Math.cos(toRad(a1))*Math.cos(toRad(a2))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(A));
}
function buildRouteForDay(trip, day){
  const lodge = lodgingForDay(trip, day);
  const acts = activitiesForDay(trip, day);
  let start = lodge
    ? { lat: lodge.lat, lng: lodge.lng, title: lodge.title||'Жильё', emoji:'🏠', isLodge:true, id:'lodge-start' }
    : (acts.length ? { lat: acts[0].lat, lng: acts[0].lng, title: acts[0].title, emoji: placeTypeIcon(acts[0].type), isLodge:false, id:'start' } : null);
  if(!start || acts.length === 0) return null;

  let pool = acts.slice();
  if(state.routeOrder === 'time'){
    pool.sort((a,b)=>{
      const ta = a.time || '99:99';
      const tb = b.time || '99:99';
      return ta.localeCompare(tb);
    });
  }
  const ordered = [];
  let cur = { lat:start.lat, lng:start.lng };
  if(state.routeOrder === 'time'){
    pool.forEach(a => ordered.push(a));
  } else {
    while(pool.length){
      let best = 0, bestD = Infinity;
      pool.forEach((a, i) => {
        const d = haversineKm(cur.lat, cur.lng, a.lat, a.lng);
        if(d < bestD){ bestD = d; best = i; }
      });
      const next = pool.splice(best, 1)[0];
      ordered.push(next);
      cur = { lat:next.lat, lng:next.lng };
    }
  }
  const points = [start, ...ordered.map(a => ({ lat:a.lat, lng:a.lng, title:a.title, emoji: placeTypeIcon(a.type), isLodge:false, id:a.id, time: a.time }))];
  if(state.routeReturn && lodge){
    points.push({ lat:lodge.lat, lng:lodge.lng, title: (lodge.title||'Жильё') + ' (возврат)', emoji:'🏠', isLodge:true, id:'lodge-end' });
  }
  let distKm = 0;
  for(let i=0; i<points.length-1; i++){
    distKm += haversineKm(points[i].lat, points[i].lng, points[i+1].lat, points[i+1].lng);
  }
  return { day, points, distKm };
}
function renderRoutes(trip){
  const days = daysBetween(trip.start, trip.end);
  if(!days.length){
    document.getElementById('map-status-wrap').innerHTML = `<div class="map-status">Нет дат поездки.</div>`;
    return;
  }
  const daysToRender = state.routeDay === null ? days : [state.routeDay];
  const routes = [];
  daysToRender.forEach(d => {
    const r = buildRouteForDay(trip, d);
    if(r) routes.push(r);
  });
  if(!routes.length){
    document.getElementById('map-status-wrap').innerHTML = `<div class="map-status">Нет точек для маршрута.</div>`;
    return;
  }
  let totalKm = 0, totalPoints = 0;
  routes.forEach((route, idx) => {
    const color = state.routeDay === null ? ROUTE_COLORS[idx % ROUTE_COLORS.length] : '#2aabee';
    const latlngs = route.points.map(p=>[p.lat, p.lng]);
    L.polyline(latlngs, { color, weight: 4, opacity: 0.85 }).addTo(tripMapLayer);
        // Пунктирные линии билетов этого дня
    const tks = (trip.tickets||[]).filter(tk =>
      (tk.segments||[]).some(sg => sg.departDate === route.day || sg.arriveDate === route.day)
    );
    const geoCache = loadTicketGeoCache(trip);
    tks.forEach(tk => {
      (tk.segments||[]).forEach(sg => {
        const a = sg.from ? geoCache[sg.from.trim()] : null;
        const b = sg.to ? geoCache[sg.to.trim()] : null;
        if(a && b){
          L.polyline([a, b], {
            color: '#34c759',
            weight: 3,
            opacity: 0.7,
            dashArray: '8 8'
          }).addTo(tripMapLayer);
        }
      });
    });
    route.points.forEach((p, i) => {
      const isFirst = i === 0;
      let label;
      if(p.isLodge) label = '🏠';
      else if(isFirst) label = '1';
      else label = String(route.points.slice(0, i+1).filter(x=>!x.isLodge).length);
      const html = p.isLodge
        ? `<div class="route-marker-icon lodge">${p.emoji}</div>`
        : `<div class="route-marker-icon" style="background:${color}">${label}</div>`;
      const icon = L.divIcon({ className:'', html, iconSize:[26,26], iconAnchor:[13,13] });
      const popup = `<b>${esc(p.title)}</b>${p.time?`<br><span style="color:#8e8e93">🕒 ${p.time}</span>`:''}<br><a href="https://yandex.ru/maps/?pt=${p.lng},${p.lat}&z=15&l=map" target="_blank">🟡 Яндекс</a>`;
      L.marker([p.lat,p.lng], { icon }).addTo(tripMapLayer).bindPopup(popup);
    });
    totalKm += route.distKm;
    totalPoints += route.points.length;
  });
  const allCoords = routes.flatMap(r => r.points.map(p=>[p.lat, p.lng]));
  tripMap.fitBounds(L.latLngBounds(allCoords).pad(0.15));
  let yandexLink = '';
  if(state.routeDay !== null){
    const r = routes[0];
    const pointsStr = r.points.map(p=>encodeURIComponent(p.title)).join('~');
    if(pointsStr) yandexLink = `<a href="https://yandex.ru/maps/?rtext=${pointsStr}&rtt=auto" target="_blank">🗺 Открыть в Яндекс.Картах</a>`;
  }
  const summaryLabel = state.routeDay === null
    ? `Все дни (${routes.length})`
    : `День ${days.indexOf(state.routeDay)+1} · ${new Date(state.routeDay).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}`;
  document.getElementById('map-status-wrap').innerHTML = `
    <div class="map-summary">
      <div>
        <div><b>${esc(summaryLabel)}</b></div>
        <div class="stat" style="margin-top:4px">Точек: <b>${totalPoints}</b> · Расстояние: <b>~${totalKm.toFixed(1)} км</b> <span class="muted" style="font-size:11px"> · по прямой</span></div>
      </div>
      ${yandexLink}
    </div>`;
}
function initTripMap(trip){
  try{
    if(tripMap){ tripMap.remove(); tripMap = null; }
    if(typeof L !== 'undefined') L.TileLayer.prototype.options.referrerPolicy = 'strict-origin-when-cross-origin';
    tripMap = L.map('trip-map').setView([41.7151,44.8271], 6);
    tripMapLayer = L.layerGroup().addTo(tripMap);
    const TILE_SOURCES = [
      { url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr:'© OpenStreetMap', max:19 },
      { url:'https://tile.openstreetmap.de/{z}/{x}/{y}.png', attr:'© OpenStreetMap DE', max:19 },
      { url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', attr:'© OpenStreetMap, © CARTO', max:20 }
    ];
    function addTiles(i){
      if(i >= TILE_SOURCES.length){
        document.getElementById('map-status-wrap').innerHTML = `<div class="map-status">⚠️ Не удалось загрузить тайлы.</div>`;
        return;
      }
      const s = TILE_SOURCES[i];
      const layer = L.tileLayer(s.url, { attribution: s.attr, maxZoom: s.max, referrerPolicy: 'strict-origin-when-cross-origin' }).addTo(tripMap);
      let loaded = false;
      layer.on('load', ()=>{ loaded = true; tripMapTilesLoaded = true; });
      layer.on('tileerror', ()=>{});
      setTimeout(()=>{
        if(!loaded && i+1 < TILE_SOURCES.length){
          tripMap.removeLayer(layer);
          addTiles(i+1);
        }
      }, 4000);
    }
    addTiles(0);
    renderMapTabMarkers(trip);
  }catch(e){
    document.getElementById('map-status-wrap').innerHTML = `<div class="map-status">⚠️ Ошибка карты: ${esc(e.message)}</div>`;
    console.error(e);
  }
}

function renderLodgingTab(trip){
  const c = document.getElementById('tab-content');
  const list = (trip.lodging||[]).slice().sort((a,b)=>{
    const da = a.checkInDate || '9999-99-99';
    const db = b.checkInDate || '9999-99-99';
    return da.localeCompare(db);
  });
  let html = '<div style="overflow-y:auto;flex:1;padding-bottom:80px"><div class="list">';
  if(!list.length){
    html += `<div class="empty empty-lodging">Пока нет жилья.<br>Добавь место проживания.</div>`;
  } else {
    list.forEach(l => { html += lodgingCard(l, trip); });
  }
  html += '</div></div>';
  c.innerHTML = html;
}
function lodgingCard(l, trip){
  const inDate = l.checkInDate ? fmtDate(l.checkInDate) : '';
  const outDate = l.checkOutDate ? fmtDate(l.checkOutDate) : '';
  const inTime = l.checkInTime ? `, ${esc(l.checkInTime)}` : '';
  const outTime = l.checkOutTime ? `, ${esc(l.checkOutTime)}` : '';
  const dates = (inDate || outDate) ? `📅 ${inDate}${inTime} → ${outDate}${outTime}` : '📅 Даты не указаны';
  const priceLine = l.price ? `💰 ${fmtMoney(l.price, 'RUB')}${l.priceNote?' · '+esc(l.priceNote):''}` : '';
  const addrLine = l.address ? `📍 ${esc(l.address)}` : '';
  const mapLinks = l.lat!=null && l.lng!=null ? `
    <div class="map-links" onclick="event.stopPropagation()">
      <a href="https://yandex.ru/maps/?pt=${l.lng},${l.lat}&z=15&l=map" target="_blank">🟡 Яндекс</a>
      <a href="https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}" target="_blank">🔵 Google</a>
      ${l.link?`<a href="${esc(l.link)}" target="_blank">🔗 Бронь</a>`:''}
    </div>` : (l.link ? `<div class="map-links" onclick="event.stopPropagation()"><a href="${esc(l.link)}" target="_blank">🔗 Бронь</a></div>` : '');
  return `<div class="lodge-card" onclick="openLodgingModal('${l.id}')">
    <div class="title"><span class="icon">🏠</span>${esc(l.title||'Жильё')}</div>
    <div class="dates">${dates}</div>
    ${priceLine?`<div class="price">${priceLine}</div>`:''}
    ${addrLine?`<div class="addr">${addrLine}</div>`:''}
    ${l.notes?`<div class="notes">${esc(l.notes)}</div>`:''}
    ${mapLinks}
  </div>`;
}

    <div class="modal-body">

        <div><label>Время</label><input id="l-in-time" type="time" value="${l&&l.checkInTime?l.checkInTime:''}" /></div>
      </div>
      <div class="row">
