<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Поездки" />
<link rel="apple-touch-icon" href="icon.png" />
<meta name="theme-color" content="#ffffff" />
<title>БЕРИЛЕТИ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'" />

  if (typeof L === 'undefined') {
    document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>');
  } else {
    L.TileLayer.prototype.options.referrerPolicy = 'strict-origin-when-cross-origin';
  }
</script>

<style>
    :root,
  [data-theme="light"]{
    color-scheme: light;
    --bg:#fbf8f0;
    --bg-soft:#f3eddc;
    --bg-elev:#ffffff;
    --text:#0c3b2c;
    --muted:#5c7a6d;
    --accent:#0d5c3f;
    --accent-2:#0a4a32;
    --accent-soft:#e2efe6;
    --border:#e6ddc4;
    --radius:18px;
    --radius-sm:12px;
    --radius-lg:24px;
    --danger:#b23a2f;
    --overlay:rgba(12,59,44,.5);
    --shadow:0 4px 20px rgba(12,59,44,.06);
    --shadow-lg:0 12px 32px rgba(12,59,44,.10);
    --shadow-fab:0 8px 24px rgba(13,92,63,.35);
    --warn:#c8951e;
    --ok:#1a9e5c;
    --font-head:"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif";
  }
  [data-theme="dark"]{
    color-scheme: dark;
    --bg:#0c3b2c;
    --bg-soft:#0a3226;
    --bg-elev:#0f4433;
    --text:#f5f2e8;
    --muted:#a9c0b2;
    --accent:#eec33a;
    --accent-2:#f4d117;
    --accent-soft:#2b3320;
    --border:#1c5540;
    --danger:#e5484d;
    --overlay:rgba(0,0,0,.6);
    --shadow:0 4px 20px rgba(0,0,0,.30);
    --shadow-lg:0 12px 32px rgba(0,0,0,.42);
    --shadow-fab:0 8px 24px rgba(238,195,58,.30);
    --warn:#eec33a;
    --ok:#5fd08a;
  }
  [data-theme="punk"]{
    color-scheme: dark;
    --bg:#0f0f0f; --bg-soft:#1c1c1c; --bg-elev:#181818;
    --text:#f0f0f0; --muted:#9e9e9e;
    --accent:#e6c200; --accent-2:#f4d117; --accent-soft:#4a3f0a;
    --border:#363636; --radius:10px; --radius-sm:8px; --radius-lg:16px;
    --danger:#e5484d; --overlay:rgba(0,0,0,.8);
    --shadow:0 4px 20px rgba(230,194,0,.08);
    --shadow-lg:0 12px 32px rgba(0,0,0,.6);
    --shadow-fab:0 8px 24px rgba(230,194,0,.4);
    --warn:#e6c200; --ok:#7fdd3f;
    --font-head:"Impact,'Arial Black',sans-serif";
  }
  [data-theme="punk"] .btn{color:#000;text-transform:uppercase;letter-spacing:1px}
  [data-theme="punk"] .btn:active{background:var(--accent-2)}
  [data-theme="punk"] header h1{text-transform:uppercase;letter-spacing:2px;font-family:var(--font-head)}
  [data-theme="punk"] .fab{color:#000;font-weight:900}
  [data-theme="noir"]{
    color-scheme: dark;
    --bg:#111116; --bg-soft:#1a1a22; --bg-elev:#18181f;
    --text:#e8e8ec; --muted:#9a9aa6;
    --accent:#c9a227; --accent-2:#dab53a; --accent-soft:#3a300f;
    --border:#353541; --radius:8px; --radius-sm:6px; --radius-lg:14px;
    --danger:#c0392b; --overlay:rgba(0,0,0,.8);
    --shadow:0 4px 20px rgba(0,0,0,.4);
    --shadow-lg:0 12px 32px rgba(0,0,0,.6);
    --shadow-fab:0 8px 24px rgba(201,162,39,.35);
    --warn:#c9a227; --ok:#6aab5c;
    --font-head:"Georgia,'Times New Roman',serif";
  }
  [data-theme="noir"] header h1{font-family:var(--font-head);letter-spacing:1px;font-style:italic}
  [data-theme="noir"] .day-title{letter-spacing:2px;color:var(--accent)}
  [data-theme="noir"] .fab{color:#000}

            [data-theme="picky"]{
    color-scheme: light;
    --bg:#f7f0f2;
    --bg-soft:#f0e4e8;
    --bg-elev:#ffffff;
    --text:#3f2a33;
    --muted:#8a7580;
    --accent:#b8839a;
    --accent-2:#9e6b81;
    --accent-soft:#efe1e7;
    --border:#e8d6dd;
    --radius:20px;
    --radius-sm:14px;
    --radius-lg:26px;
    --danger:#c25b60;
    --overlay:rgba(63,42,51,.4);
    --shadow:0 4px 20px rgba(184,131,154,.08);
    --shadow-lg:0 12px 32px rgba(184,131,154,.14);
    --shadow-fab:0 8px 24px rgba(184,131,154,.30);
    --warn:#c8925a;
    --ok:#5fa878;
    --font-head:"Georgia,'Times New Roman',serif";
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg-soft);color:var(--text);overflow-x:hidden;
    transition:background .3s, color .3s;
  }
  .app{
    max-width:760px;margin:0 auto;min-height:100vh;
    background:var(--bg);display:flex;flex-direction:column;
    position:relative;transition:background .3s, max-width .3s;
  }

  header{
    padding:16px 18px;display:flex;align-items:center;gap:8px;
    border-bottom:1px solid var(--border);position:sticky;top:0;
    z-index:10;transition:background .3s, border-color .3s;
  }
  header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;letter-spacing:-.3px}
  .back{cursor:pointer;color:var(--accent);font-size:24px;line-height:1;background:none;border:none;padding:4px 8px}
  .back:active{opacity:.5}
  .icon-btn{
    background:none;border:none;font-size:20px;cursor:pointer;
    padding:6px 8px;border-radius:10px;line-height:1;color:var(--text);
    transition:background .2s ease;
  }
  .icon-btn:active{background:var(--bg-soft)}

  .btn{
    background:var(--accent);color:#fff;border:none;border-radius:var(--radius);
    padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;
    letter-spacing:.2px;
    transition:transform .12s ease, box-shadow .2s ease, background .2s ease, border-radius .3s;
    box-shadow:var(--shadow-fab);
  }
  .btn:active{background:var(--accent-2);transform:scale(.96)}
  .btn-ghost{background:none;color:var(--accent);padding:8px 10px;border:none;font-size:14px;cursor:pointer;box-shadow:none}
  .btn-danger{background:var(--danger);color:#fff}
  .fab{
    position:fixed;right:calc(50% - 360px + 20px);bottom:24px;
    width:56px;height:56px;border-radius:50%;font-size:28px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-fab);z-index:20;
    transition:transform .12s ease;
  }
  .fab:active{transform:scale(.96)}
  @media(max-width:760px){.fab{right:20px}}

  .search-wrap{padding:12px 12px 4px;display:flex;flex-direction:column;gap:10px}
  .search-box{position:relative}
  .search-box input{padding-left:38px}
  .search-box .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
  .search-box .clear-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:6px 10px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;background:var(--bg-soft);color:var(--text);
    border:1px solid transparent;border-radius:999px;
    padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;
    transition:background .2s, color .2s, border-color .2s;
  }
  .chip.active{background:var(--accent);color:#fff}
  .chip:active{opacity:.7}

  .group{margin-bottom:6px}
  .group-head{display:flex;align-items:center;gap:8px;padding:14px 4px 6px;cursor:pointer;user-select:none}
  .group-head .arrow{font-size:11px;color:var(--muted);transition:transform .2s;display:inline-block}
  .group.collapsed .group-head .arrow{transform:rotate(-90deg)}
  .group-head .title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .group-head .count{margin-left:auto;font-size:11px;color:var(--muted);background:var(--bg-soft);border:1px solid var(--border);padding:2px 8px;border-radius:999px}
  .group.collapsed .group-body{display:none}
  .group.past .group-head .title{opacity:.6}
  .group.past .group-head .count{opacity:.6}

  .list{padding:8px 12px;flex:1}
  .card{
    background:var(--bg-elev);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;cursor:pointer;
    transition:background .15s, transform .15s, border-radius .3s;
    position:relative;box-shadow:var(--shadow);
    animation:softFade .25s ease;
  }
  .card:active{background:var(--bg-soft);transform:scale(.985)}
  .card h3{margin:0 0 4px;font-size:16px;padding-right:70px}
  .card .meta{color:var(--muted);font-size:13px}
  .card.past{opacity:.55}
  .card .badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--warn);color:#000;text-transform:uppercase;letter-spacing:.5px}
  .card .badge.active{background:var(--ok);color:#fff}
  .empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:15px}

  .form{padding:16px;display:flex;flex-direction:column;gap:12px}
  label{
  font-size: 13px;
  color: var(--text);
  opacity: .75;
  font-weight: 600;
  margin-bottom: 6px;
  display: block;
}
  input,textarea,select{
  width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:15px;font-family:inherit;background:var(--bg-elev);color:var(--text);
  transition:background .2s, box-shadow .2s, border-color .2s, border-radius .3s;
}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--bg-elev)}
  input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--text);
    -webkit-box-shadow:0 0 0 1000px var(--bg-soft) inset;
    transition:background-color 5000s ease-in-out 0s;
  }
  input[type="checkbox"]{accent-color:var(--accent)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}

  .act-wrap{position:relative;margin-bottom:8px;border-radius:var(--radius);overflow:hidden;background:var(--danger)}
  .act-delete{position:absolute;right:0;top:0;bottom:0;width:90px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;cursor:pointer;background:var(--danger);border:none}
  .act{
    position:relative;display:flex;gap:12px;align-items:flex-start;
    background:var(--bg-elev);border-radius:var(--radius);
    padding:12px;cursor:pointer;touch-action:pan-y;
    transition:transform .2s ease, background .3s, border-radius .3s;
    will-change:transform;user-select:none;
    box-shadow:var(--shadow);
    animation:softFade .25s ease;
  }
  .act.dragging{transition:none}
  .act .pin{font-size:20px;flex-shrink:0}
  .act .body{flex:1;min-width:0}
  .act .body b{font-size:15px;display:block}
  .act .body .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .act .body p{margin:4px 0 0;font-size:13px;color:var(--muted);word-break:break-word}
  .act .check-progress{font-size:12px;color:var(--accent);margin-top:4px}

  .day-title{font-size:13px;font-weight:600;color:var(--muted);padding:14px 4px 6px;text-transform:uppercase;letter-spacing:.5px}

  .trip-tabs{
    display:flex;background:var(--bg);border-bottom:1px solid var(--border);
    position:sticky;top:53px;z-index:9;overflow-x:auto;scrollbar-width:none;
  }
  .trip-tabs::-webkit-scrollbar{display:none}
  .trip-tab{
    flex:1 0 auto;min-width:80px;text-align:center;padding:12px 6px;font-size:13px;
    color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
    transition:color .2s, border-color .2s;user-select:none;white-space:nowrap;
  }
  .trip-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .trip-tab .ic{display:block;font-size:16px;margin-bottom:2px}

  .budget-hero{
    margin:12px;background:linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius:var(--radius);color:#fff;padding:16px;box-shadow:var(--shadow-fab);
  }
  .budget-hero .label{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.9;font-weight:600}
  .budget-hero .main{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
  .budget-hero .sub{font-size:13px;opacity:.9;margin-top:4px}
  .budget-bar{height:8px;border-radius:999px;margin-top:12px;background:rgba(255,255,255,.25);overflow:hidden}
  .budget-bar > div{height:100%;background:#fff;border-radius:999px;transition:width .4s}
  .budget-bar.warn > div{background:#ffd400}
  .budget-bar.danger > div{background:#ff5545}

  .budget-section{
    margin:16px 12px;background:var(--bg-elev);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);
  }
  .budget-section-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;border-bottom:1px solid var(--border);
    font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  }
  .budget-section-body{padding:6px 0}
  .budget-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
  .budget-row:last-child{border-bottom:none}
  .budget-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .budget-row .name{flex:1;min-width:0;font-size:14px}
  .budget-row .name .note{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .budget-row .amount{font-size:14px;font-weight:600;text-align:right;white-space:nowrap}
  .budget-row .amount .plan{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .budget-row .del{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 6px}
  .budget-row .del:active{color:var(--danger)}
  .budget-add{display:block;width:100%;background:none;border:none;padding:12px 14px;color:var(--accent);font-size:14px;text-align:left;cursor:pointer;font-family:inherit}
  .budget-add:active{background:var(--bg-soft)}

  .cat-bar{height:6px;border-radius:999px;background:var(--bg-soft);margin-top:6px;overflow:hidden}
  .cat-bar > div{height:100%;border-radius:999px}

  .saving-card{padding:12px 14px;border-bottom:1px solid var(--border)}
  .saving-card:last-child{border-bottom:none}
  .saving-head{display:flex;align-items:center;gap:10px}
  .saving-head .name{flex:1;font-weight:600;font-size:14px}
  .saving-head .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px}
  .saving-head .del:active{color:var(--danger)}
  .saving-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .saving-bar{height:6px;border-radius:999px;background:var(--bg-soft);margin-top:6px;overflow:hidden}
  .saving-bar > div{height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
  .saving-actions{display:flex;gap:6px;margin-top:8px}
  .saving-actions .btn-mini{flex:1;background:var(--bg-soft);color:var(--text);border:1px solid transparent;border-radius:10px;padding:8px;font-size:13px;cursor:pointer;font-family:inherit}
  .saving-actions .btn-mini:active{background:var(--border)}

  .lodge-card{background:var(--bg-elev);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:background .15s;box-shadow:var(--shadow)}
  .lodge-card:active{background:var(--bg-soft)}
  .lodge-card .title{font-size:16px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .lodge-card .title .icon{font-size:18px}
  .lodge-card .dates{font-size:13px;color:var(--muted);margin-top:2px}
  .lodge-card .price{font-size:13px;color:var(--accent);margin-top:4px;font-weight:600}
  .lodge-card .addr{font-size:13px;color:var(--muted);margin-top:4px;word-break:break-word}
  .lodge-card .notes{font-size:13px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);white-space:pre-wrap;word-break:break-word}
  .lodge-day{display:flex;align-items:center;gap:8px;margin:6px 4px 0;padding:8px 10px;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--muted);cursor:pointer}
  .lodge-day:active{background:var(--border)}
  .lodge-day .icon{font-size:14px}
  .lodge-day .name{color:var(--text);font-weight:600}

  .ticket-card{background:var(--bg-elev);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;cursor:pointer;transition:background .15s;position:relative;box-shadow:var(--shadow)}
  .ticket-card:active{background:var(--bg-soft)}
  .ticket-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .ticket-head .type{display:flex;align-items:center;gap:6px}
  .ticket-head .num{background:rgba(255,255,255,.25);padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.5px}
  .ticket-body{padding:14px}
  .ticket-route{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;font-weight:700;line-height:1.3}
  .ticket-route .point{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
  .ticket-route .arr{color:var(--accent);font-size:14px;flex-shrink:0}
  .ticket-route .more{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg-soft);border:1px solid var(--border);padding:2px 8px;border-radius:999px}
  .ticket-dates{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .ticket-dates .seg{display:inline-flex;align-items:center;gap:4px}
  .ticket-dates .seg b{color:var(--text);font-weight:600}
  .ticket-perf{position:relative;height:1px;border-top:1px dashed var(--border);margin:0 14px}
  .ticket-perf::before,.ticket-perf::after{content:'';position:absolute;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg-soft);border:1px solid var(--border)}
  .ticket-perf::before{left:-21px}
  .ticket-perf::after{right:-21px}
  .ticket-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 14px;gap:10px;font-size:12px}
  .ticket-foot .carrier{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .ticket-foot .seat{color:var(--muted);padding:2px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;white-space:nowrap}
  .ticket-foot .price{font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap}
  .ticket-barcode{display:flex;gap:1px;align-items:flex-end;height:22px;padding:0 14px 10px;opacity:.65}
  .ticket-barcode > span{display:block;width:2px;background:var(--text);border-radius:1px}
  .ticket-day{display:flex;align-items:flex-start;gap:8px;margin:6px 4px 0;padding:8px 10px;background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--muted);cursor:pointer}
  .ticket-day:active{background:var(--border)}
  .ticket-day .icon{font-size:14px;flex-shrink:0;line-height:1.4}
  .ticket-day .info{flex:1;min-width:0}
  .ticket-day .route{color:var(--text);font-weight:600;display:block}
  .ticket-day .legs{display:block;font-size:12px;margin-top:2px;color:var(--muted);line-height:1.4}

  .segments{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .segment{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--bg-soft);display:flex;flex-direction:column;gap:10px}

  /* =========================================================
   ПОЛИРОВКА 13.5 — hover, анимации, пустые состояния
   ========================================================= */

/* ---------- Hover-эффекты (только для мыши) ---------- */
@media (hover: hover) and (pointer: fine){

  /* Карточки поездок */
  .card:hover{
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    transition: transform .2s ease, box-shadow .2s ease;
  }

  /* Карточки активностей, жилья, билетов, мест */
  .act:hover,
  .lodge-card:hover,
  .ticket-card:hover,
  .place-item:hover,
  .checklist-item:hover{
    background: var(--bg-soft);
    transition: background .15s ease;
  }

  /* Кнопки */
  .btn:hover:not(:active){
    background: var(--accent-2);
    box-shadow: 0 10px 28px rgba(11,107,58,.42);
    transform: translateY(-1px);
  }
  .btn-ghost:hover{
    background: var(--bg-soft);
    border-radius: 10px;
  }
  .icon-btn:hover{
    background: var(--bg-soft);
  }
  .btn-danger:hover:not(:active){
    background: #a52f22;
    box-shadow: 0 10px 28px rgba(192,57,43,.4);
  }

  /* FAB */
  .fab:hover{
    transform: scale(1.06);
    box-shadow: 0 12px 32px rgba(11,107,58,.5);
  }

  /* Чипы */
  .chip:hover:not(.active){
    background: var(--border);
  }

  /* Вкладки поездки */
  .trip-tab:hover:not(.active){
    color: var(--text);
  }

  /* Ссылки в карточках */
  .map-links a:hover{
    background: var(--bg-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Кнопки в меню */
  .menu-item:hover{
    background: var(--bg-soft);
  }

  /* Бюджетные строки */
  .budget-row:hover{
    background: var(--bg-soft);
  }
  .budget-row[style*="cursor:default"]:hover{
    background: transparent;
  }

  /* Пункты списка поездок в группе */
  .group-head:hover{
    color: var(--text);
  }
  .group-head:hover .title{
    color: var(--text);
  }

  /* Клик по ссылке в модалке */
  .suggestion:hover{
    background: var(--bg-soft);
  }
}

/* ---------- Фокус для клавиатуры ---------- */
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
.chip:focus-visible,
.trip-tab:focus-visible{
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- Пустые состояния ---------- */
.empty{
  text-align: center;
  color: var(--muted);
  padding: 60px 24px;
  font-size: 15px;
  line-height: 1.5;
  max-width: 360px;
  margin: 0 auto;
}
.empty::before{
  content: '✈️';
  display: block;
  font-size: 56px;
  opacity: .35;
  margin-bottom: 16px;
  line-height: 1;
}
.empty.empty-places::before{ content: '📍'; }
.empty.empty-map::before{ content: '🗺️'; }
.empty.empty-lodging::before{ content: '🏠'; }
.empty.empty-tickets::before{ content: '✈️'; }
.empty.empty-checklists::before{ content: '🧳'; }
.empty.empty-budget::before{ content: '💰'; }
.empty.empty-places::before{ content: '📍'; }

/* Алиас-классы для разнообразия эмодзи */
.empty.emoji-search::before{ content: '🔍'; }
.empty.emoji-plane::before{ content: '🛫'; }

/* ---------- Плавное появление экранов ---------- */
.list,
.places-wrap,
.checklists-wrap,
.map-wrap,
.desktop-detail #tab-content{
  animation: fadeIn .25s ease;
}
@keyframes fadeIn{
  from{opacity: 0}
  to{opacity: 1}
}

/* Заголовки дней — липкие в плане */
.day-title{
  position: sticky;
  top: 53px;
  z-index: 5;
  background: var(--bg);
  margin: 0 -8px;
  padding: 14px 12px 6px;
  transition: background .2s;
}
[data-theme="dark"] .day-title{
  background: var(--bg);
}

/* На ПК с двухколоночным... ах, мы откатили. Но на всякий — учтём если вернём */

/* ---------- Модалка — плавное появление и уход ---------- */
.modal{
  will-change: transform;
}
.modal-body{
  scroll-behavior: smooth;
}

/* ---------- Групповой разделитель в списке ---------- */
.group + .group{
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
}

/* ---------- Аккуратные разделители в бюджет-секциях ---------- */
.budget-section + .budget-section,
.places-section + .places-section,
.checklist-section + .checklist-section{
  margin-top: 20px;
}

/* ---------- Клик по карточке — мягкое «сжатие» ---------- */
@media (hover: none){
  .card:active,
  .act:active,
  .lodge-card:active,
  .ticket-card:active,
  .place-item:active{
    transform: scale(.985);
    transition: transform .1s ease;
  }
}

/* ---------- Пустые состояния в контейнерах с другим фоном ---------- */
.places-wrap .empty,
.checklists-wrap .empty{
  background: transparent;
}

/* ---------- Анимация появления модалки ---------- */
@keyframes modalSlideUp{
  from{transform: translateY(20px); opacity: 0}
  to{transform: translateY(0); opacity: 1}
}
.modal.show .modal-body{
  animation: modalSlideUp .35s ease;
}

/* На ПК — анимация другая (модалка центрируется) */
@media (min-width: 1100px){
  .modal.modal-sm { max-width: 560px; }
  .modal.modal-lg { max-width: 1200px; }
}

/* ---------- Плавная прокрутка ---------- */
html{
  scroll-behavior: smooth;
}

/* ---------- Ховер на заголовок группы ---------- */
@media (hover: hover){
  .group-head:hover .arrow{
    color: var(--accent);
  }
}

/* ---------- Мягкий пульс для FAB (привлечение внимания) ---------- */
@keyframes fabPulse{
  0%, 100%{ box-shadow: var(--shadow-fab); }
  50%{ box-shadow: 0 10px 32px rgba(11,107,58,.5); }
}
.fab{
  animation: fabPulse 3s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce){
  .fab{ animation: none; }
  .card, .place-item, .act{ animation: none; }
}

/* Явный row внутри сегментов */
.segment .row{
  display: flex !important;
  flex-direction: row !important;
  gap: 8px !important;
  align-items: flex-start !important;
}
.segment .row > *{
  flex: 1 1 0 !important;
  min-width: 0 !important;
}

/* Явный coords-row внутри row */
.segment .coords-row{
  display: flex !important;
  flex-direction: row !important;
  gap: 6px !important;
  align-items: stretch !important;
}
.segment .coords-row > input{
  flex: 1 1 auto !important;
  min-width: 0 !important;
}
.segment .coords-row > button{
  flex: 0 0 auto !important;
  width: auto !important;
}

/* Запрещаем .suggestions появляться внутри .segment (на всякий) */
.segment .suggestions{
  display: none !important;
}

/* На ПК — простые формы не растягиваются */
@media (min-width: 1100px){
  .modal-body > div:only-child,
  .modal-body > .form-narrow{
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }
}

    /* =========================================================
     ТУЛБАР МАРШРУТА — кнопки прокрутки и градиентные маски
     ========================================================= */

  .map-toolbar-wrap{
    position: absolute;
    top: 52px;
    left: 10px;
    right: 10px;
    z-index: 500;
    display: flex;
    align-items: center;
    pointer-events: none;
    gap: 4px;
  }

  /* Внутри обёртки старый .map-toolbar-row уже имеет position:absolute —
     отменяем, чтобы он лёг во flex-контейнер */
  .map-toolbar-wrap .map-toolbar-row{
    position: relative;
    top: auto;
    left: auto;
    right: auto;
    flex: 1;
    min-width: 0;
    pointer-events: auto;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  /* Кнопки-стрелки — только на десктопе (мышь) */
  .map-toolbar-arrow{
    display: none;
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: #fff;
    color: #1c1c1e;
    font-size: 18px;
    line-height: 1;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    align-items: center;
    justify-content: center;
    transition: background .15s, transform .1s;
    pointer-events: auto;
    padding: 0;
  }
  .map-toolbar-arrow:active{ transform: scale(.94); }

  /* Градиентные маски — подсказка «есть ещё» */
  .map-toolbar-wrap::before,
  .map-toolbar-wrap::after{
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 22px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
    z-index: 1;
  }
  .map-toolbar-wrap::before{
    left: 0;
    background: linear-gradient(to right, rgba(255,255,255,.95), rgba(255,255,255,0));
    border-top-left-radius: 999px;
    border-bottom-left-radius: 999px;
  }
  .map-toolbar-wrap::after{
    right: 0;
    background: linear-gradient(to left, rgba(255,255,255,.95), rgba(255,255,255,0));
    border-top-right-radius: 999px;
    border-bottom-right-radius: 999px;
  }
  .map-toolbar-wrap.show-left::before{ opacity: 1; }
  .map-toolbar-wrap.show-right::after{ opacity: 1; }

  /* Тонкий скроллбар на десктопе (вместо скрытого) */
  @media (hover: hover) and (pointer: fine){
    .map-toolbar-wrap .map-toolbar-row{
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,.25) transparent;
      padding-bottom: 6px;
    }
    .map-toolbar-wrap .map-toolbar-row::-webkit-scrollbar{
      display: block;
      height: 4px;
    }
    .map-toolbar-wrap .map-toolbar-row::-webkit-scrollbar-thumb{
      background: rgba(0,0,0,.25);
      border-radius: 4px;
      border: none;
    }
    .map-toolbar-wrap .map-toolbar-row::-webkit-scrollbar-thumb:hover{
      background: rgba(0,0,0,.45);
    }
    .map-toolbar-wrap .map-toolbar-row::-webkit-scrollbar-track{
      background: transparent;
    }

    /* Показываем стрелки только на десктопе и только если есть что скроллить */
    .map-toolbar-wrap:not(.no-scroll) .map-toolbar-arrow{
      display: flex;
    }
    .map-toolbar-arrow:hover{
      background: #f0f0f0;
    }
  }

  /* На тач-устройствах стрелки никогда не показываем,
     маски тоже скрываем — там просто свайп */
  @media (hover: none){
    .map-toolbar-wrap::before,
    .map-toolbar-wrap::after{
      display: none;
    }
  }

  /* Тёмные темы: маски и стрелки должны быть тёмными */
  [data-theme="dark"] .map-toolbar-arrow,
  [data-theme="punk"] .map-toolbar-arrow,
  [data-theme="noir"] .map-toolbar-arrow,
  [data-theme="picky"] .map-toolbar-arrow{
    background: var(--bg-elev);
    color: var(--text);
    border-color: var(--border);
  }
  [data-theme="dark"] .map-toolbar-wrap::before,
  [data-theme="punk"] .map-toolbar-wrap::before,
  [data-theme="noir"] .map-toolbar-wrap::before,
  [data-theme="picky"] .map-toolbar-wrap::before{
    background: linear-gradient(to right, var(--bg) 20%, transparent);
  }
  [data-theme="dark"] .map-toolbar-wrap::after,
  [data-theme="punk"] .map-toolbar-wrap::after,
  [data-theme="noir"] .map-toolbar-wrap::after,
  [data-theme="picky"] .map-toolbar-wrap::after{
    background: linear-gradient(to left, var(--bg) 20%, transparent);
  }

    /* Место, созданное билетом — тонкая подсветка */

          <label>Email</label>
          <input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" />
        </div>
        <div id="auth-error" style="display:none"></div>
        <button class="btn" id="auth-submit" onclick="doForgotPassword()">Отправить ссылку</button>
        <div class="auth-foot">
          <button class="auth-link" onclick="openAuthModal('signin')">Назад ко входу</button>
        </div>
      </div>
    `;
  }

  const titles = {
    signin: 'Войти в аккаунт',
    signup: 'Создать аккаунт',
    forgot: 'Сброс пароля'
  };

  openModal(`
    <div class="modal-head">
      <h3>${titles[mode]}</h3>
      <button class="btn-ghost" onclick="closeModal()">Закрыть</button>
    </div>
    <div class="modal-body">${bodyHtml}</div>
  `);

  // Фокус на первое поле
  setTimeout(() => {
    const el = document.getElementById(mode === 'signup' ? 'auth-name' : 'auth-email');
    if(el) el.focus();
  }, 100);

  // Enter на любом поле — submit
  setTimeout(() => {
    const modalEl = document.getElementById('modal');
    if(!modalEl) return;
    modalEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        if(mode === 'signin') doSignIn();
        else if(mode === 'signup') doSignUp();
        else if(mode === 'forgot') doForgotPassword();
      }
    });
  }, 100);
}

/* Показ/скрытие ошибки в модалке авторизации. */
function authShowError(text){
  const box = document.getElementById('auth-error');
  if(!box) return;
  box.className = 'auth-error';
  box.textContent = text;
  box.style.display = 'block';
}
function authShowInfo(text){
  const box = document.getElementById('auth-error');
  if(!box) return;
  box.className = 'auth-info';
  box.textContent = text;
  box.style.display = 'block';
}
function authHideMsg(){
  const box = document.getElementById('auth-error');
  if(box) box.style.display = 'none';
}
function authSetLoading(loading){
  const btn = document.getElementById('auth-submit');
  if(!btn) return;
  btn.disabled = loading;
  btn.style.opacity = loading ? '0.6' : '';
  btn.style.cursor = loading ? 'wait' : '';
}

/* ---------- ВХОД ПО EMAIL ---------- */
async function doSignIn(){
  authHideMsg();
  const email = (document.getElementById('auth-email')?.value || '').trim();
  const password = document.getElementById('auth-password')?.value || '';
  if(!email) return authShowError('Введите email.');
  if(!password) return authShowError('Введите пароль.');

  authSetLoading(true);
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    currentUser = data.user;
    closeModal();
    showToast('✓ Вы вошли в аккаунт');
    render();
  }catch(err){
    authShowError(getAuthErrorMessage(err));
  }finally{
    authSetLoading(false);
  }
}

/* ---------- РЕГИСТРАЦИЯ ПО EMAIL ---------- */
async function doSignUp(){
  authHideMsg();
  const name = (document.getElementById('auth-name')?.value || '').trim();
  const email = (document.getElementById('auth-email')?.value || '').trim();
  const password = document.getElementById('auth-password')?.value || '';
  const password2 = document.getElementById('auth-password2')?.value || '';

  if(!email) return authShowError('Введите email.');
  if(!/^\S+@\S+\.\S+$/.test(email)) return authShowError('Некорректный email.');
  if(!password || password.length < 6) return authShowError('Пароль должен быть не короче 6 символов.');
  if(password !== password2) return authShowError('Пароли не совпадают.');

  authSetLoading(true);
  try{
    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: {
        data: { full_name: name || '' },
        emailRedirectTo: window.location.origin + window.location.pathname
      }
    });
    if(error) throw error;

    // Если Supabase требует подтверждения email — сессии не будет
    if(!data.session){
      closeModal();
      showToast('✓ Регистрация успешна. Проверьте почту — мы отправили ссылку для подтверждения.', 7000);
      return;
    }

    // Если подтверждение email отключено — сразу вошли
    currentUser = data.user;
    closeModal();
    showToast('✓ Добро пожаловать!');
    render();
  }catch(err){
    authShowError(getAuthErrorMessage(err));
  }finally{
    authSetLoading(false);
  }
}

/* ---------- ВОССТАНОВЛЕНИЕ ПАРОЛЯ ---------- */
async function doForgotPassword(){
  authHideMsg();
  const email = (document.getElementById('auth-email')?.value || '').trim();
  if(!email) return authShowError('Введите email.');

  authSetLoading(true);
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });
    if(error) throw error;
    authShowInfo('Если такой email есть в системе — мы отправили на него ссылку для сброса пароля.');
  }catch(err){
    authShowError(getAuthErrorMessage(err));
  }finally{
    authSetLoading(false);
  }
}

/* Обновляет бейдж на иконке 🔔: показывает количество
   «созревших» напоминаний (at <= now, !dismissed). */

  const btn = document.getElementById('bell-btn');
  if(!btn) return;
  const count = countDueReminders();
  // Убираем старый бейдж, если был
  const old = btn.querySelector('.bell-badge');
  if(old) old.remove();
  if(count > 0){

    badge.className = 'bell-badge';
    badge.textContent = count > 9 ? '9+' : String(count);
    btn.appendChild(badge);
  }
}

/* Считает количество «созозревших» напоминаний по всем поездкам. */
function countDueReminders(){
  const now = Date.now();
  let count = 0;
  (trips || []).forEach(trip => {
    (trip.reminders || []).forEach(r => {
      if(r.dismissed) return;
      if(!r.at) return;
      if(new Date(r.at).getTime() <= now) count++;
    });
  });
  return count;
}

/* Возвращает список всех «созревших» напоминаний с привязкой к поездке. */
function collectDueReminders(){
  const now = Date.now();
  const out = [];
  (trips || []).forEach(trip => {
    (trip.reminders || []).forEach(r => {
      if(r.dismissed) return;
      if(!r.at) return;
      if(new Date(r.at).getTime() <= now){
        out.push({ trip, reminder: r });
      }
    });
  });
  // Сортируем по времени — сначала самые ранние
  out.sort((a, b) => new Date(a.reminder.at) - new Date(b.reminder.at));
  return out;
}

/* Возвращает список всех будущих напоминаний + выполненных, если showDismissed. */
function collectAllReminders(showDismissed){
  const now = Date.now();
  const out = [];
  (trips || []).forEach(trip => {
    (trip.reminders || []).forEach(r => {
      const isDue = r.at && new Date(r.at).getTime() <= now;
      if(r.dismissed && !showDismissed) return;
      // Созревшие и невыполненные не показываем в «Ближайших» — они в «Созревших»
      if(isDue && !r.dismissed) return;
      out.push({ trip, reminder: r, isDue });
    });
  });
  // Сортируем по времени
  out.sort((a, b) => {
    const ta = a.reminder.at ? new Date(a.reminder.at).getTime() : 0;
    const tb = b.reminder.at ? new Date(b.reminder.at).getTime() : 0;
    return ta - tb;
  });
  return out;
}

/* Форматирует «at» в человекочитаемое «Сегодня, 14:00», «Завтра, 09:30»,
   «12 окт, 18:00» и т.п. */
function fmtReminderAt(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((target - today) / 86400000);
  const time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  if(diffDays === 0) return `Сегодня, ${time}`;
  if(diffDays === 1) return `Завтра, ${time}`;
  if(diffDays === -1) return `Вчера, ${time}`;
  if(diffDays > 1 && diffDays <= 7) return `Через ${diffDays} дн., ${time}`;
  const date = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  return `${date}, ${time}`;
}

/* Помечает напоминание как выполненное. */
function dismissReminder(tripId, reminderId){
  const trip = trips.find(t => t.id === tripId);
  if(!trip) return;
  const r = (trip.reminders || []).find(x => x.id === reminderId);
  if(!r) return;
  r.dismissed = true;
  r.dismissedAt = new Date().toISOString();
  syncTrip(tripId);
  updateBellBadge();
  openRemindersModal();
}

/* Возвращает напоминание в активное состояние (для «выполненных»). */
function undismissReminder(tripId, reminderId){
  const trip = trips.find(t => t.id === tripId);
  if(!trip) return;
  const r = (trip.reminders || []).find(x => x.id === reminderId);
  if(!r) return;
  r.dismissed = false;
  r.dismissedAt = null;
  syncTrip(tripId);
  updateBellBadge();
  openRemindersModal();
}

/* Откладывает напоминание на час вперёд. */
function snoozeReminder(tripId, reminderId){
  const trip = trips.find(t => t.id === tripId);
  if(!trip) return;
  const r = (trip.reminders || []).find(x => x.id === reminderId);
  if(!r) return;
  const base = r.at ? new Date(r.at).getTime() : Date.now();
  const newTime = Math.max(base, Date.now()) + 3600000;
  r.at = new Date(newTime).toISOString();
  syncTrip(tripId);
  updateBellBadge();
  openRemindersModal();
}

/* Модалка создания / редактирования напоминания.
   tripId — id поездки (обязателен для создания и для правки).
   reminderId — id напоминания (если редактируем).
   Если tripId не задан — берём текущую поездку из state.tripId.
*/
function openReminderModal(tripId, reminderId){
  const targetTripId = tripId || state.tripId;
  const trip = ensureTrip(trips.find(t => t.id === targetTripId));
  if(!trip){
    alert('Поездка не найдена');
    return;
  }

  const isEdit = !!reminderId;
  const r = isEdit
    ? (trip.reminders || []).find(x => x.id === reminderId)
    : null;

  // Собираем список событий для привязки
  const anchors = collectReminderAnchors(trip);

  // Текущие значения
  const mode = r?.mode || 'absolute';
  const text = r?.text || '';
  const note = r?.note || '';

  // Абсолютная дата/время
  let absDate = '';
  let absTime = '';
  if(r && r.mode === 'absolute' && r.at){
    const d = new Date(r.at);
    absDate = d.toISOString().slice(0,10);
    absTime = d.toTimeString().slice(0,5);
  }

  // Относительный offset
  let relOffset = 1;
  let relUnit = 'days'; // 'minutes' | 'hours' | 'days'
  let relAnchorValue = '';
  if(r && r.mode === 'relative'){
    const total = Math.abs(r.offsetMin || 0);
    if(total % 1440 === 0){ relOffset = total / 1440; relUnit = 'days'; }
    else if(total % 60 === 0){ relOffset = total / 60; relUnit = 'hours'; }
    else { relOffset = total; relUnit = 'minutes'; }
    relAnchorValue = r.anchorId ? `${r.anchorType}::${r.anchorId}` : r.anchorType;
  }

  // Если новый — по умолчанию выберем первое доступное событие
  if(!isEdit && anchors.length){
    relAnchorValue = anchors[0].value;
  }

  const anchorOptions = anchors.map(a =>
    `<option value="${esc(a.value)}" ${a.value === relAnchorValue ? 'selected' : ''}>${esc(a.label)}</option>`
  ).join('');

  openModal(`
    <div class="modal-head">
      <h3>${isEdit ? '🔔 Редактировать' : '🔔 Новое напоминание'}</h3>
      <button class="btn-ghost" onclick="closeModal()">Закрыть</button>
    </div>
    <div class="modal-body">

        <input id="rem-text" placeholder="Например: Взять паспорт"

      <div>
        <label>Заметка (необязательно)</label>
        <input id="rem-note" placeholder="Сборы" value="${esc(note)}" maxlength="200" />
      </div>

      <div>
        <label>Когда напомнить</label>
        <div class="rem-mode-tabs">
          <button type="button" class="rem-mode-tab ${mode==='absolute'?'active':''}"

            В конкретный момент
          </button>
          <button type="button" class="rem-mode-tab ${mode==='relative'?'active':''}"
                  data-mode="relative" onclick="switchReminderMode('relative')">
            За N до события
          </button>
        </div>
      </div>

      <div id="rem-absolute" style="display:${mode==='absolute'?'flex':'none'};flex-direction:column;gap:10px">
        <div class="row">
          <div><label>Дата</label><input id="rem-date" type="date" value="${esc(absDate)}" /></div>
          <div><label>Время</label><input id="rem-time" type="time" value="${esc(absTime)}" /></div>
        </div>
      </div>

      <div id="rem-relative" style="display:${mode==='relative'?'flex':'none'};flex-direction:column;gap:10px">
        <div>
          <label>Событие</label>
          <select id="rem-anchor">
            ${anchorOptions || '<option value="">— нет доступных событий —</option>'}
          </select>
        </div>
        <div class="row">
          <div>
            <label>За</label>
            <input id="rem-offset" type="number" min="1" step="1" value="${relOffset}" />
          </div>
          <div>
            <label>Единица</label>
            <select id="rem-unit">
              <option value="minutes" ${relUnit==='minutes'?'selected':''}>минут</option>
              <option value="hours" ${relUnit==='hours'?'selected':''}>часов</option>
              <option value="days" ${relUnit==='days'?'selected':''}>дней</option>
            </select>
          </div>
        </div>
      </div>

      <div id="rem-error" style="display:none" class="auth-error"></div>
    </div>
    <div class="modal-foot">
      ${isEdit ? `<button class="btn btn-danger" onclick="deleteReminder('${trip.id}','${r.id}')">Удалить</button>` : ''}
      <button class="btn" id="rem-save-btn" onclick="saveReminder('${trip.id}','${isEdit ? r.id : ''}')">
        Сохранить
      </button>
    </div>
  `);

  // Фокус на текст
  setTimeout(() => {
    const el = document.getElementById('rem-text');
    if(el) el.focus();
  }, 100);
}

/* Переключает режим «в момент / до события». */
function switchReminderMode(mode){
  document.querySelectorAll('.rem-mode-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.mode === mode);
  });
  const absBox = document.getElementById('rem-absolute');
  const relBox = document.getElementById('rem-relative');
  if(absBox) absBox.style.display = (mode === 'absolute') ? 'flex' : 'none';
  if(relBox) relBox.style.display = (mode === 'relative') ? 'flex' : 'none';
}

/* Собирает события, к которым можно привязать относительное напоминание.
   Формат: [{ value, label, at, anchorType, anchorId, offsetBase }].
   value — строка "anchorType" или "anchorType::anchorId". */
function collectReminderAnchors(trip){
  const out = [];

  // 1) Начало поездки
  if(trip.start){
    const at = combineDateAndTime(trip.start, trip.dayStart || '09:00');
    if(at) out.push({
      value: 'trip_start',
      label: `🚩 Начало поездки — ${fmtDateFull(at)}`,
      at, anchorType: 'trip_start', anchorId: null
    });
  }

  // 2) Конец поездки
  if(trip.end){
    const at = combineDateAndTime(trip.end, trip.dayEnd || '21:00');
    if(at) out.push({
      value: 'trip_end',
      label: `🏁 Конец поездки — ${fmtDateFull(at)}`,
      at, anchorType: 'trip_end', anchorId: null
    });
  }

  // 3) Вылеты и прилёты билетов
  (trip.tickets || []).forEach(tk => {
    (tk.segments || []).forEach((sg, idx) => {
      if(sg.departDate){
        const at = combineDateAndTime(sg.departDate, sg.departTime || '00:00');
        if(at) out.push({
          value: `ticket_depart::${tk.id}::${idx}`,
          label: `✈️ Вылет ${sg.from || '?'} → ${sg.to || '?'} — ${fmtDateFull(at)}`,
          at, anchorType: 'ticket_depart', anchorId: `${tk.id}::${idx}`
        });
      }
      if(sg.arriveDate){
        const at = combineDateAndTime(sg.arriveDate, sg.arriveTime || '00:00');
        if(at) out.push({
          value: `ticket_arrive::${tk.id}::${idx}`,
          label: `🛬 Прилёт ${sg.from || '?'} → ${sg.to || '?'} — ${fmtDateFull(at)}`,
          at, anchorType: 'ticket_arrive', anchorId: `${tk.id}::${idx}`
        });
      }
    });
  });

  // 4) Заезды/выезды жилья
  (trip.lodging || []).forEach(l => {
    if(l.checkInDate){
      const at = combineDateAndTime(l.checkInDate, l.checkInTime || '14:00');
      if(at) out.push({
        value: `lodging_checkin::${l.id}`,
        label: `🏠 Заезд: ${l.title || 'Жильё'} — ${fmtDateFull(at)}`,
        at, anchorType: 'lodging_checkin', anchorId: l.id
      });
    }
    if(l.checkOutDate){
      const at = combineDateAndTime(l.checkOutDate, l.checkOutTime || '12:00');
      if(at) out.push({
        value: `lodging_checkout::${l.id}`,
        label: `🏠 Выезд: ${l.title || 'Жильё'} — ${fmtDateFull(at)}`,
        at, anchorType: 'lodging_checkout', anchorId: l.id
      });
    }
  });

  // 5) Конкретные места из плана
  (trip.activities || []).forEach(a => {
    if(a.date && a.time && !a.linkedTicketId){
      const at = combineDateAndTime(a.date, a.time);
      if(at) out.push({
        value: `activity::${a.id}`,
        label: `📍 ${a.title || 'Место'} — ${fmtDateFull(at)}`,
        at, anchorType: 'activity', anchorId: a.id
      });
    }
  });

  return out;
}

/* Собирает ISO-дату из date (YYYY-MM-DD) и time (HH:MM). */
function combineDateAndTime(date, time){
  if(!date) return null;
  const t = time || '00:00';
  const d = new Date(`${date}T${t}:00`);
  if(isNaN(d.getTime())) return null;
  return d.toISOString();
}

/* Форматирует дату для селекта — компактно. */
function fmtDateFull(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleString('ru-RU', {
    day: 'numeric', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

/* Сохраняет напоминание (создание или редактирование). */
function saveReminder(tripId, reminderId){
  const trip = ensureTrip(trips.find(t => t.id === tripId));
  if(!trip) return;

  const text = (document.getElementById('rem-text')?.value || '').trim();
  const note = (document.getElementById('rem-note')?.value || '').trim();
  const mode = document.querySelector('.rem-mode-tab.active')?.dataset.mode || 'absolute';

  const errorBox = document.getElementById('rem-error');
  function showErr(msg){
    if(errorBox){
      errorBox.className = 'auth-error';
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }
  }
  function hideErr(){
    if(errorBox) errorBox.style.display = 'none';
  }
  hideErr();

  if(!text){
    showErr('Введите текст напоминания');
    return;
  }

  let at = null;
  let anchorType = null;
  let anchorId = null;
  let offsetMin = null;

    if(mode === 'absolute'){
    const date = document.getElementById('rem-date')?.value || '';
    const time = document.getElementById('rem-time')?.value || '';
    if(!date){
      showErr('Выберите дату');
      return;
    }
    at = combineDateAndTime(date, time || '09:00');
    if(!at){
      showErr('Некорректная дата');
      return;
    }
    // Проверяем, что момент в будущем
    if(new Date(at).getTime() <= Date.now()){
      showErr('Дата и время уже прошли. Выберите момент в будущем.');
      return;
    }
  } else {
    // relative
    const anchorValue = document.getElementById('rem-anchor')?.value || '';
    const offset = parseInt(document.getElementById('rem-offset')?.value || '1', 10);
    const unit = document.getElementById('rem-unit')?.value || 'days';

    if(!anchorValue){
      showErr('Выберите событие');
      return;
    }
    if(isNaN(offset) || offset < 1){
      showErr('Введите число больше 0');
      return;
    }

    // Парсим anchorValue
    const parts = anchorValue.split('::');
    anchorType = parts[0];
    anchorId = parts.length > 1 ? parts.slice(1).join('::') : null;

    // Находим событие в собранном списке anchors, чтобы получить его at
    const anchors = collectReminderAnchors(trip);
    const anchor = anchors.find(a => a.value === anchorValue);
    if(!anchor){
      showErr('Событие не найдено');
      return;
    }

    // Проверяем, что событие в будущем
    const eventTime = new Date(anchor.at).getTime();
    if(eventTime <= Date.now()){
      showErr('Событие уже прошло. Напоминание не имеет смысла.');
      return;
    }

    // Считаем offset
    let offsetMs;
    if(unit === 'minutes') offsetMs = offset * 60 * 1000;
    else if(unit === 'hours') offsetMs = offset * 60 * 60 * 1000;
    else offsetMs = offset * 24 * 60 * 60 * 1000;

    const reminderTime = eventTime - offsetMs;
    // Проверяем, что напоминание ещё в будущем
    if(reminderTime <= Date.now()){
      showErr('Напоминание уже было бы в прошлом. Уменьшите offset.');
      return;
    }

    at = new Date(reminderTime).toISOString();
    offsetMin = Math.round(offsetMs / 60000);
  }

  // Если редактируем — обновляем
  if(reminderId){
    const r = (trip.reminders || []).find(x => x.id === reminderId);
    if(r){
      Object.assign(r, {
        text, note, mode, at,
        anchorType, anchorId, offsetMin,
        dismissed: false,
        dismissedAt: null
      });
    }
  } else {
    // Создаём новое
    if(!Array.isArray(trip.reminders)) trip.reminders = [];
    trip.reminders.push({
      id: uid(),
      text, note, mode, at,
      anchorType, anchorId, offsetMin,
      dismissed: false,
      dismissedAt: null
    });
  }

  syncTrip(tripId);
  closeModal();
  updateBellBadge();
  // Перерисовываем список, если открыт
  if(document.getElementById('modal')?.classList.contains('show')){
    // Ничего
  }
  render();
  showToast('Напоминание сохранено');
}

/* Удаляет напоминание. */
function deleteReminder(tripId, reminderId){
  if(!confirm('Удалить это напоминание?')) return;
  const trip = ensureTrip(trips.find(t => t.id === tripId));
  if(!trip) return;
  trip.reminders = (trip.reminders || []).filter(x => x.id !== reminderId);
  syncTrip(tripId);
  closeModal();
  updateBellBadge();
  render();
  showToast('Напоминание удалено');
}

const TELEGRAM_BOT_USERNAME = 'berileti_notify_bot';

/* Загружает статус привязки Telegram для текущего пользователя
   и обновляет UI в модалке профиля. */
async function loadTelegramStatus(){
  const label = document.getElementById('tg-link-label');

    label.innerHTML = `Подключить Telegram <span class="hint" id="tg-link-hint"><br>Войдите в аккаунт</span>`;

      .eq('user_id', currentUser.id)

    if(error) throw error;
        if(data){

                : (data.first_name || 'подключено');
      label.innerHTML = `Telegram подключён <span class="hint" id="tg-link-hint"><br>${esc(who)} · нажмите, чтобы отключить</span>`;

/* При возврате на страницу — обновляем статус Telegram,
   если открыт профиль. */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    if(document.getElementById('tg-link-label')){
      loadTelegramStatus();
    }
  }
});

async function openTelegramLink(){
  if(!sb || !currentUser){
    showToast('Войдите в аккаунт');
    return;
  }

  // Проверяем, подключён ли уже
  let linked = null;
  try{
    const { data } = await sb
      .from('telegram_links')
      .select('chat_id, username')
      .eq('user_id', currentUser.id)
      .maybeSingle();
    linked = data;
  }catch(e){}

  if(linked){
    // Уже подключён — предлагаем отключить
    if(confirm('Telegram уже подключён.\n\nОтключить уведомления в Telegram?')){
      try{
        await sb.from('telegram_links').delete().eq('user_id', currentUser.id);
        showToast('Telegram отключён');
        loadTelegramStatus();
      }catch(e){
        console.error('Ошибка отключения Telegram:', e);
        showToast('Не удалось отключить. Попробуйте ещё раз.');
      }
    }
    return;
  }

  // Не подключён — открываем бота с deep link
  const startParam = encodeURIComponent(currentUser.id);
  const tgUrl = `tg://resolve?domain=${TELEGRAM_BOT_USERNAME}&start=${startParam}`;
  const webUrl = `https://t.me/${TELEGRAM_BOT_USERNAME}?start=${startParam}`;

  // Hybrid: пробуем сначала tg://, если приложение не открылось — https://
  let appOpened = false;

  const onVisibilityChange = () => {
    if(document.hidden){
      appOpened = true;
      document.removeEventListener('visibilitychange', onVisibilityChange);
    }
  };
  document.addEventListener('visibilitychange', onVisibilityChange);

  // Пробуем нативный протокол
  try{
    window.location.href = tgUrl;
  }catch(e){
    // если что-то пошло не так — сразу в веб
    window.open(webUrl, '_blank', 'noopener');
    document.removeEventListener('visibilitychange', onVisibilityChange);
    return;
  }

  // Через 1.5 сек: если приложение не открылось — открываем веб-версию
  setTimeout(() => {
    document.removeEventListener('visibilitychange', onVisibilityChange);
    if(!appOpened){
      window.open(webUrl, '_blank', 'noopener');
    }
    // Через 3 секунды обновим статус — может, пользователь уже нажал Start
    setTimeout(() => { loadTelegramStatus(); }, 3000);
  }, 1500);
}

/* Выход из аккаунта. */
async function doSignOut(){
  if(!sb) return;

  // Запоминаем ключ ДО выхода, пока currentUser ещё указывает на старого пользователя
  const oldKey = tripsStorageKey();

  try{
    await sb.auth.signOut();
  }catch(err){
    console.error('Ошибка signOut:', err);
  }

  // Чистим кэш СТАРОГО пользователя — по сохранённому ключу
  try{
    localStorage.removeItem(oldKey);
    localStorage.removeItem(SYNC_QUEUE_KEY);
    sessionStorage.removeItem('migration_asked');
    sessionStorage.removeItem('reminders_banner_shown');
  }catch(e){}

  // Локальное состояние
  currentUser = null;
  trips = [];
  state.view = 'list';
  state.tripId = null;
  state.tripTab = 'plan';

  // Вложения — общие для устройства, чистим полностью
  try{
    await clearAllAttachments();
  }catch(e){
    console.error('Не удалось очистить вложения:', e);
  }

  closeModal();
  showToast('Вы вышли из аккаунта');
  render();
}

/* Полная очистка IndexedDB с вложениями. */
function clearAllAttachments(){
  return new Promise((resolve) => {
    try{
      const req = indexedDB.open(ATTACH_DB_NAME, 1);
      req.onsuccess = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(ATTACH_STORE)){
          db.close();
          return resolve();
        }
        const tx = db.transaction(ATTACH_STORE, 'readwrite');
        const store = tx.objectStore(ATTACH_STORE);
        const clearReq = store.clear();
        clearReq.onsuccess = () => { db.close(); resolve(); };
        clearReq.onerror   = () => { db.close(); resolve(); };
      };
      req.onerror = () => resolve();
    }catch(e){
      resolve();
    }
  });
}

function initSupabase(){
  if(typeof window.supabase === 'undefined'){
    console.error('Supabase SDK не загружен');
    return false;
  }
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: window.localStorage,
        storageKey: 'berileti-auth'
      }
    });
    return true;
  }catch(e){
    console.error('Ошибка инициализации Supabase:', e);
    return false;
  }
}

/* Загрузить текущего пользователя, если сессия есть.
   Вызывается при старте приложения. */
async function loadCurrentUser(){
  if(!sb) return null;
  try{
    const { data, error } = await sb.auth.getUser();
    if(error || !data || !data.user){
      currentUser = null;
      return null;
    }
    currentUser = data.user;
    return currentUser;
  }catch(e){
    console.error('Ошибка getUser:', e);
    currentUser = null;
    return null;
  }
}

/* Подписка на изменения авторизации: вход, выход, обновление токена. */
function subscribeAuthChanges(onChange){
  if(!sb) return;
  sb.auth.onAuthStateChange((event, session) => {
    const prevUser = currentUser;

    // На SIGNED_OUT currentUser обнулится — но нам нужен ключ СТАРОГО пользователя,
    // чтобы удалить его кэш поездок. Сохраняем его в глобальной переменной.
    if(event === 'SIGNED_OUT' && prevUser){
      window.__lastSignedOutUserId = prevUser.id;
    }

    currentUser = session ? session.user : null;
    if(typeof onChange === 'function') onChange(event, session);
  });
}

/* Готовит объект trip для отправки в Supabase: раскладывает на таблицы. */
function cloudDecomposeTrip(trip){
  const uid = currentUser.id;
  const now = new Date().toISOString();
  return {
    trip: {
      id: trip.id,
      user_id: uid,
      title: trip.title || 'Без названия',
      place: trip.place || '',
      start_date: trip.start || null,
      end_date: trip.end || null,
      notes: trip.notes || '',
      currency: trip.currency || 'RUB',
      rates: trip.rates || {},
      me: trip.me || 'Я',
      day_start: trip.dayStart || '09:00',
      day_end: trip.dayEnd || '21:00',
      lunch_start: trip.lunchStart || '13:00',
      lunch_end: trip.lunchEnd || '14:00',
      budget_total: (trip.budget && trip.budget.total) || 0,
      updated_at: now
    },
    activities: (trip.activities || []).map(a => ({
      id: a.id,
      user_id: uid,
      trip_id: trip.id,
      title: a.title || 'Без названия',
      date: a.date || null,
      time: a.time || '',
      notes: a.notes || '',
      lat: (typeof a.lat === 'number') ? a.lat : null,
      lng: (typeof a.lng === 'number') ? a.lng : null,
      type: a.type || 'other',
      duration: a.duration || 60,
      open_from: a.openFrom || '',
      open_to: a.openTo || '',
      price: a.price || 0,
      add_to_expense: !!a.addToExpense,
      checklist: a.checklist || [],
      linked_ticket_id: a.linkedTicketId || null,
      linked_ticket_role: a.linkedTicketRole || null,
      linked_ticket_segment_idx: (typeof a.linkedTicketSegmentIdx === 'number') ? a.linkedTicketSegmentIdx : null,
      locked_by_ticket: !!a.lockedByTicket,
      updated_at: now
    })),
    lodging: (trip.lodging || []).map(l => ({
      id: l.id,
      user_id: uid,
      trip_id: trip.id,
      title: l.title || '',
      address: l.address || '',
      lat: (typeof l.lat === 'number') ? l.lat : null,
      lng: (typeof l.lng === 'number') ? l.lng : null,
      check_in_date: l.checkInDate || null,
      check_in_time: l.checkInTime || '',
      check_out_date: l.checkOutDate || null,
      check_out_time: l.checkOutTime || '',
      price: l.price || 0,
      price_note: l.priceNote || '',
      link: l.link || '',
      notes: l.notes || '',
      attachment_id: l.attachmentId || null,
      attachment_name: l.attachmentName || null,
      attachment_size: l.attachmentSize || null,
      attachment_type: l.attachmentType || null,
      updated_at: now
    })),
    tickets: [],
    ticket_segments: [],
    expenses: [],
    categories: [],
    savings: [],
    savings_transactions: [],
    checklists: []
  };
}

/* Собирает билеты и сегменты отдельно (нужно две таблицы). */
function cloudDecomposeTickets(trip, uid, now){
  const tickets = [];
  const segments = [];
  (trip.tickets || []).forEach(tk => {
    tickets.push({
      id: tk.id,
      user_id: uid,
      trip_id: trip.id,
      type: tk.type || 'plane',
      carrier: tk.carrier || '',
      ticket_number: tk.ticketNumber || '',
      price: tk.price || 0,
      link: tk.link || '',
      notes: tk.notes || '',
      to_plan: !!tk.toPlan,
      attachment_id: tk.attachmentId || null,
      attachment_name: tk.attachmentName || null,
      attachment_size: tk.attachmentSize || null,
      attachment_type: tk.attachmentType || null,
      updated_at: now
    });
    (tk.segments || []).forEach((sg, i) => {
      segments.push({
        id: sg.id || `${tk.id}_${i}`,
        user_id: uid,
        ticket_id: tk.id,
        idx: i,
        from_city: sg.from || '',
        to_city: sg.to || '',
        from_lat: (typeof sg.fromLat === 'number') ? sg.fromLat : null,
        from_lng: (typeof sg.fromLng === 'number') ? sg.fromLng : null,
        to_lat: (typeof sg.toLat === 'number') ? sg.toLat : null,
        to_lng: (typeof sg.toLng === 'number') ? sg.toLng : null,
        depart_date: sg.departDate || null,
        depart_time: sg.departTime || '',
        arrive_date: sg.arriveDate || null,
        arrive_time: sg.arriveTime || '',
        carrier: sg.carrier || '',
        number: sg.number || '',
        seat: sg.seat || ''
      });
    });
  });
  return { tickets, segments };
}

/* Собирает бюджет: expenses, categories, savings, savings_transactions. */
function cloudDecomposeBudget(trip, uid, now){
  const b = trip.budget || {};
  const expenses = (b.expenses || []).map(e => ({
    id: e.id,
    user_id: uid,
    trip_id: trip.id,

  const categories = (b.categories || []).map(c => ({

    trip_id: trip.id,

  const savings = [];

/* Сравнивает два массива объектов по полю id.
   Возвращает { toInsert, toUpdate, toDelete }.
   - toInsert: есть в local, нет в cloud
   - toUpdate: есть в обоих (сравниваем по updated_at, чтобы не гонять зря)
   - toDelete: есть в cloud, нет в local
*/
function diffById(localArr, cloudArr){
  const localIds = new Set(localArr.map(x => x.id));
  const cloudIds = new Set(cloudArr.map(x => x.id));

  const toInsert = localArr.filter(x => !cloudIds.has(x.id));
  const toDelete = cloudArr.filter(x => !localIds.has(x.id));

  // Обновлять будем только те строки, у которых updated_at изменился
  // или которых мы не знаем когда обновляли
  const cloudById = {};
  cloudArr.forEach(x => { cloudById[x.id] = x; });

  const toUpdate = localArr.filter(x => {
    const c = cloudById[x.id];
    if(!c) return false;
    // Если в локальной версии updated_at новее — обновляем
    // Если у облачной нет updated_at — обновляем на всякий случай
    if(!c.updated_at) return true;
    const localTs = x.updated_at || 0;
    return new Date(localTs).getTime() >= new Date(c.updated_at).getTime();
  });

  return { toInsert, toUpdate, toDelete };
}

/* Тянет из облака ID + updated_at для указанной таблицы и trip_id. */
async function fetchCloudIds(table, tripId, uid){
  const { data, error } = await sb
    .from(table)
    .select('id, updated_at')
    .eq('trip_id', tripId)
    .eq('user_id', uid);
  if(error){
    // Таблица может не иметь updated_at — тогда пробуем без него
    const fallback = await sb.from(table).select('id').eq('trip_id', tripId).eq('user_id', uid);
    if(fallback.error) throw fallback.error;
    return (fallback.data || []).map(x => ({ id: x.id, updated_at: null }));
  }
  return data || [];
}

/* То же для ticket_segments — но у них нет updated_at и фильтр по ticket_id. */
async function fetchCloudSegmentsIds(ticketIds){
  if(!ticketIds.length) return [];
  const { data, error } = await sb
    .from('ticket_segments')
    .select('id, ticket_id')
    .in('ticket_id', ticketIds);
  if(error) throw error;
  return data || [];
}

/* Проверяет, не изменилась ли поездка в облаке с момента
   последней успешной синхронизации. Возвращает true, если конфликт есть.
*/
async function checkTripConflict(trip){
  if(!sb || !currentUser) return false;
  if(!trip._lastSyncedAt) return false; // ещё не синхронизировали — конфликта быть не может

  try{
    const { data, error } = await sb
      .from('trips')
      .select('updated_at')
      .eq('id', trip.id)
      .eq('user_id', currentUser.id)
      .maybeSingle();

    if(error) return false; // при ошибке не блокируем, просто пробуем сохранить
    if(!data) return false; // поездки в облаке нет — вставляем как новую

    const cloudTime = new Date(data.updated_at).getTime();
    const localTime = new Date(trip._lastSyncedAt).getTime();

    // Если облачная новее более чем на 1 секунду — конфликт
    // (1 секунда — запас на расхождение часов)
    return cloudTime > localTime + 1000;
  }catch(e){
    console.error('Ошибка проверки конфликта:', e);
    return false;
  }
}

/* Показывает диалог разрешения конфликта между локальной и облачной версией.
   Возвращает: 'local' | 'cloud' | 'both' | null (если отмена).
*/
function askConflictResolution(trip){
  return new Promise((resolve) => {
    openModal(`
      <div class="modal-head">
        <h3>Конфликт версий</h3>
        <button class="btn-ghost" onclick="closeModal(); window.__resolveConflict && window.__resolveConflict(null)">Отмена</button>
      </div>
      <div class="modal-body">
        <p class="confirm-text" style="font-size:14.5px">
          Поездка <b>«${esc(trip.title)}»</b> была изменена на другом устройстве.
        </p>
        <p class="muted" style="margin:8px 0 16px;font-size:13px;line-height:1.55">
          Выберите, какую версию оставить. Если сомневаетесь — сохраните обе,
          потом разберётесь и удалите лишнюю.
        </p>
      </div>
      <div class="modal-foot" style="flex-direction:column;gap:8px">
        <button class="btn" data-choice="local" style="width:100%">Оставить мою версию</button>
        <button class="btn-ghost" data-choice="cloud" style="width:100%;padding:12px">Взять версию с другого устройства</button>
        <button class="btn-ghost" data-choice="both" style="width:100%;padding:12px">Сохранить обе</button>
      </div>
    `);

    window.__resolveConflict = (choice) => {
      window.__resolveConflict = null;
      resolve(choice);
    };

    const modalEl = document.getElementById('modal');
    const handler = (e) => {
      const btn = e.target.closest('button[data-choice]');
      if(!btn) return;
      modalEl.removeEventListener('click', handler);
      const choice = btn.dataset.choice;
      closeModal();
      resolve(choice);
    };
    modalEl.addEventListener('click', handler);
  });
}

/* Отправляет одну поездку в облако. Инкрементально:
   - inserts только новых строк
   - updates только изменённых
   - deletes только пропавших
   Это в разы быстрее, чем удалять и вставлять всё заново.
*/
async function cloudSaveTrip(trip){
  if(!sb || !currentUser) throw new Error('Не авторизован');
  const uid = currentUser.id;
  const now = new Date().toISOString();

    const parts = cloudDecomposeTrip(trip);
  const tkParts = cloudDecomposeTickets(trip, uid, now);
  const bParts = cloudDecomposeBudget(trip, uid, now);
  const clItems = cloudDecomposeChecklists(trip, uid);
  const reminders = cloudDecomposeReminders(trip, uid);

  const tripRow    = parts.trip;
  const activities = parts.activities;
  const lodging    = parts.lodging;
  const tickets    = tkParts.tickets;
  const segments   = tkParts.segments;
  const expenses   = bParts.expenses;
  const categories = bParts.categories;
  const savings    = bParts.savings;
  const savingsTx  = bParts.savings_tx;

  // Хелпер для проверки ответа
  function ensure(res, label){
    if(res && res.error){
      throw new Error(`${label}: ${res.error.message || res.error}`);
    }
    return res;
  }

  // 1) Сама поездка — upsert
  ensure(await sb.from('trips').upsert(tripRow), 'trips upsert');

  // 2) Параллельно тянем облачные ID для всех таблиц
  const [
    cloudActivities, cloudLodging, cloudTickets,
    cloudExpenses, cloudCategories, cloudSavings,
    cloudChecklists
  ] = await Promise.all([
    fetchCloudIds('activities', trip.id, uid),
    fetchCloudIds('lodging', trip.id, uid),
    fetchCloudIds('tickets', trip.id, uid),
    fetchCloudIds('expenses', trip.id, uid),
    fetchCloudIds('categories', trip.id, uid),
    fetchCloudIds('savings', trip.id, uid),
    fetchCloudIds('checklists', trip.id, uid)
  ]);

  // Сегменты — привязаны к tickets, а не к trips
  const cloudTicketIds = cloudTickets.map(t => t.id);
  const cloudSegments = await fetchCloudSegmentsIds(cloudTicketIds);

  // Накопления-транзакции — привязаны к savings
  const cloudSavingIds = cloudSavings.map(s => s.id);
  let cloudSavingsTx = [];
  if(cloudSavingIds.length){
    const r = await sb.from('savings_transactions').select('id, saving_id').in('saving_id', cloudSavingIds);
    if(r.error) throw r.error;
    cloudSavingsTx = r.data || [];
  }

  // 3) Считаем diff для каждой таблицы
  const dActs   = diffById(activities, cloudActivities);
  const dLodge  = diffById(lodging,    cloudLodging);
  const dTix    = diffById(tickets,    cloudTickets);
  const dExp    = diffById(expenses,   cloudExpenses);
  const dCat    = diffById(categories, cloudCategories);
  const dSav    = diffById(savings,    cloudSavings);
  const dCl     = diffById(clItems,    cloudChecklists);

  // Для segments — ключ ticket_id, а не trip_id
  const localSegIds = new Set(segments.map(s => s.id));
  const cloudSegIds = new Set(cloudSegments.map(s => s.id));
  const segToInsert = segments.filter(s => !cloudSegIds.has(s.id));
  const segToDeleteIds = cloudSegments.filter(s => !localSegIds.has(s.id)).map(s => s.id);

  // Для savings_transactions — ключ saving_id
  const localTxIds = new Set(savingsTx.map(t => t.id));
  const cloudTxIds = new Set(cloudSavingsTx.map(t => t.id));
  const txToInsert = savingsTx.filter(t => !cloudTxIds.has(t.id));
  const txToDeleteIds = cloudSavingsTx.filter(t => !localTxIds.has(t.id)).map(t => t.id);

  // 4) Применяем изменения. Порядок важен из-за FK:
  //    categories → expenses (categoryId)
  //    tickets → ticket_segments
  //    savings → savings_transactions

  // 4.1. Категории
  if(dCat.toInsert.length) ensure(await sb.from('categories').insert(dCat.toInsert), 'categories insert');
  if(dCat.toUpdate.length) ensure(await sb.from('categories').upsert(dCat.toUpdate), 'categories update');
  if(dCat.toDelete.length) {
    const ids = dCat.toDelete.map(x => x.id);
    ensure(await sb.from('categories').delete().in('id', ids), 'categories delete');
  }

  // 4.2. Активности
  if(dActs.toInsert.length) ensure(await sb.from('activities').insert(dActs.toInsert), 'activities insert');
  if(dActs.toUpdate.length) ensure(await sb.from('activities').upsert(dActs.toUpdate), 'activities update');
  if(dActs.toDelete.length) {
    const ids = dActs.toDelete.map(x => x.id);
    ensure(await sb.from('activities').delete().in('id', ids), 'activities delete');
  }

  // 4.3. Жильё
  if(dLodge.toInsert.length) ensure(await sb.from('lodging').insert(dLodge.toInsert), 'lodging insert');
  if(dLodge.toUpdate.length) ensure(await sb.from('lodging').upsert(dLodge.toUpdate), 'lodging update');
  if(dLodge.toDelete.length) {
    const ids = dLodge.toDelete.map(x => x.id);
    ensure(await sb.from('lodging').delete().in('id', ids), 'lodging delete');
  }

  // 4.4. Билеты — сначала, потом сегменты
  if(dTix.toInsert.length) ensure(await sb.from('tickets').insert(dTix.toInsert), 'tickets insert');

  if(segToDeleteIds.length) ensure(await sb.from('ticket_segments').delete().in('id', segToDeleteIds), 'segments delete');

  // 4.6. Траты — после категорий
  if(dExp.toInsert.length) ensure(await sb.from('expenses').insert(dExp.toInsert), 'expenses insert');
  if(dExp.toUpdate.length) ensure(await sb.from('expenses').upsert(dExp.toUpdate), 'expenses update');
  if(dExp.toDelete.length) {
    const ids = dExp.toDelete.map(x => x.id);
    ensure(await sb.from('expenses').delete().in('id', ids), 'expenses delete');
  }

  // 4.7. Накопления — потом транзакции
  if(dSav.toInsert.length) ensure(await sb.from('savings').insert(dSav.toInsert), 'savings insert');
  if(dSav.toUpdate.length) ensure(await sb.from('savings').upsert(dSav.toUpdate), 'savings update');

    ensure(await sb.from('savings').delete().in('id', ids), 'savings delete');
  }
  if(txToInsert.length) ensure(await sb.from('savings_transactions').insert(txToInsert), 'savings_tx insert');
  if(txToDeleteIds.length) ensure(await sb.from('savings_transactions').delete().in('id', txToDeleteIds), 'savings_tx delete');

    // 4.8. Чек-листы
  if(dCl.toInsert.length) ensure(await sb.from('checklists').insert(dCl.toInsert), 'checklists insert');
  if(dCl.toUpdate.length) ensure(await sb.from('checklists').upsert(dCl.toUpdate), 'checklists update');
  if(dCl.toDelete.length) {
    const ids = dCl.toDelete.map(x => x.id);
    ensure(await sb.from('checklists').delete().in('id', ids), 'checklists delete');
  }

   // 4.9. Напоминания
  const cloudReminders = await fetchCloudIds('reminders', trip.id, uid);
  const dRem = diffById(reminders, cloudReminders);

  if(dRem.toInsert.length) ensure(await sb.from('reminders').insert(dRem.toInsert), 'reminders insert');
