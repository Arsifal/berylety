        <div><label>Время</label><input id="l-out-time" type="time" value="${l&&l.checkOutTime?l.checkOutTime:''}" /></div>
      </div>
      <div class="row">
        <div><label>Цена, ₽</label><input id="l-price" type="number" min="0" step="0.01" value="${l&&l.price?l.price:''}" /></div>
        <div><label>За что</label><input id="l-price-note" placeholder="за ночь / за всё" value="${l?esc(l.priceNote||''):''}" /></div>
      </div>
      <div><label>Ссылка на бронь</label><input id="l-link" placeholder="https://..." value="${l?esc(l.link||''):''}" /></div>
      <div><label>Заметки</label><textarea id="l-notes" rows="3">${l?esc(l.notes||''):''}</textarea></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);margin-top:4px">
        <input type="checkbox" id="l-add-expense" style="width:auto;margin:0" ${isNew?'checked':''} />
        Добавить стоимость в расходы
      </label>
    </div>
    <div class="modal-foot">
      ${l?`<button class="btn btn-danger" onclick="deleteLodging('${l.id}')">Удалить</button>`:''}
      <button class="btn" onclick="saveLodging('${l?l.id:''}')">Сохранить</button>
    </div>`);
  const addrInput = document.getElementById('l-address');
  if(addrInput){
    addrInput.addEventListener('input', ()=> searchLodgingAddress());
    addrInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); searchLodgingAddress(); } });
  }
  setTimeout(()=>{ document.addEventListener('click', outsideLodgingClick, { once:true }); }, 0);
}
function outsideLodgingClick(e){
  const box = document.getElementById('l-suggestions');
  if(box && !e.target.closest('.coords-wrap')) box.innerHTML = '';
}
function saveLodging(id){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const title = document.getElementById('l-title').value.trim() || 'Жильё';
  const address = document.getElementById('l-address').value.trim();
  const coords = document.getElementById('l-coords').value;
  const {lat, lng} = parseCoords(coords);
  const checkInDate = document.getElementById('l-in-date').value;
  const checkInTime = document.getElementById('l-in-time').value;
  const checkOutDate = document.getElementById('l-out-date').value;
  const checkOutTime = document.getElementById('l-out-time').value;
  const price = parseFloat(document.getElementById('l-price').value) || 0;
  const priceNote = document.getElementById('l-price-note').value.trim();
  const link = document.getElementById('l-link').value.trim();
  const notes = document.getElementById('l-notes').value.trim();
  const addExpense = document.getElementById('l-add-expense').checked;
  const data = { title, address, lat, lng, checkInDate, checkInTime, checkOutDate, checkOutTime, price, priceNote, link, notes };
  if(id){
    const l = trip.lodging.find(x=>x.id===id);
    Object.assign(l, data);
  } else {
    trip.lodging.push({ id: uid(), ...data });
  }
  if(addExpense && price > 0){
    let cat = trip.budget.categories.find(c => c.name.toLowerCase() === 'жильё');
    if(!cat){ cat = { id: uid(), name:'Жильё', planned:0, color:'#2aabee' }; trip.budget.categories.push(cat); }
    trip.budget.expenses.push({ id: uid(), title: `${title} (жильё)`, amount: price, date: checkInDate || todayISO(), categoryId: cat.id, note: priceNote || '', priceInRUB: true, isPrepaid: true });
  }
  DB.save(trips);
  closeModal();
  render();
}
function deleteLodging(id){
  if(!confirm('Удалить это жильё?')) return;
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  trip.lodging = trip.lodging.filter(l => l.id !== id);
  DB.save(trips);
  closeModal();
  render();
}
let lodgeAbort = null, lodgeTimer = null;
function searchLodgingAddress(){
  const input = document.getElementById('l-address');
  const box = document.getElementById('l-suggestions');
  if(!input || !box) return;
  const q = input.value.trim();
  if(q.length < 3){ box.innerHTML=''; return; }
  if(lodgeAbort) lodgeAbort.abort();
  clearTimeout(lodgeTimer);
  lodgeTimer = setTimeout(async ()=>{
    box.innerHTML = '<div class="loading">Ищу...</div>';
    lodgeAbort = new AbortController();
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=ru&q=${encodeURIComponent(q)}`;
      const res = await fetch(url, { signal: lodgeAbort.signal, headers: { 'Accept':'application/json' } });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      if(!data.length){ box.innerHTML = '<div class="loading">Ничего не найдено</div>'; return; }
            box.innerHTML = data.map((d, idx) => {
        const name = (d.display_name||'').split(',')[0];
        const addr = (d.display_name||'').split(',').slice(1).join(',').trim();
        return `<div class="suggestion" data-idx="${idx}">
          <span class="name">${esc(name)}</span>
          <span class="addr">${esc(addr)}</span>
        </div>`;
      }).join('');

      box.querySelectorAll('.suggestion').forEach((el, idx) => {
        el.addEventListener('click', ()=>{
          const d = data[idx];
          const lat = parseFloat(d.lat);
          const lng = parseFloat(d.lon);
          pickLodgingSuggestion(lat, lng, d.display_name || '');
        });
      });
    }catch(e){
      if(e.name === 'AbortError') return;
      box.innerHTML = '<div class="loading">Ошибка поиска.</div>';
    }
  }, 500);
}
function pickLodgingSuggestion(lat, lng, fullName){
  const addr = document.getElementById('l-address');
  const coords = document.getElementById('l-coords');
  if(addr) addr.value = fullName || `${lat}, ${lng}`;
  if(coords) coords.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  const box = document.getElementById('l-suggestions');
  if(box) box.innerHTML = '';
}

const TICKET_TYPES = [
  { id:'plane', icon:'✈️', label:'Самолёт' },
  { id:'train', icon:'🚆', label:'Поезд' },
  { id:'bus', icon:'🚌', label:'Автобус' },
  { id:'car', icon:'🚗', label:'Машина' },
  { id:'ferry', icon:'⛴️', label:'Паром' },
  { id:'other', icon:'🎫', label:'Другое' }
];
function ticketIcon(type){ const t = TICKET_TYPES.find(x=>x.id===type); return t ? t.icon : '🎫'; }
function ticketLabel(type){ const t = TICKET_TYPES.find(x=>x.id===type); return t ? t.label : 'Билет'; }

function renderTicketsTab(trip){
  const c = document.getElementById('tab-content');
  const list = (trip.tickets||[]).slice().sort((a,b)=>{
    const sa = (a.segments||[])[0] || {};
    const sb = (b.segments||[])[0] || {};
    const da = (sa.departDate||'9999-99-99') + ' ' + (sa.departTime||'');
    const db = (sb.departDate||'9999-99-99') + ' ' + (sb.departTime||'');
    return da.localeCompare(db);
  });
  let html = '<div style="overflow-y:auto;flex:1;padding-bottom:80px"><div class="list">';
  if(!list.length){
    html += `<div class="empty empty-tickets">Пока нет билетов.<br>Добавь самолёт, поезд или автобус.</div>`;
  } else {
    list.forEach(t => { html += ticketCard(t, trip); });
  }
  html += '</div></div>';
  c.innerHTML = html;
}
function ticketCard(t, trip){
  const segs = t.segments || [];
  const first = segs[0] || {};
  const last = segs[segs.length-1] || {};
  let routeHtml = '';
  if(segs.length === 1){
    routeHtml = `<span class="point">${esc(first.from||'—')}</span><span class="arr">→</span><span class="point">${esc(first.to||'—')}</span>`;
  } else if(segs.length === 2){
    routeHtml = `<span class="point">${esc(segs[0].from||'—')}</span><span class="arr">→</span><span class="point">${esc(segs[0].to||'—')}</span><span class="arr">→</span><span class="point">${esc(segs[1].to||'—')}</span>`;
  } else {
    routeHtml = `<span class="point">${esc(segs[0].from||'—')}</span><span class="arr">→</span><span class="point">${esc(segs[0].to||'—')}</span><span class="more">+ ещё ${segs.length-1}</span>`;
  }
  const depStr = first.departDate ? `${fmtDate(first.departDate)}${first.departTime?' · '+esc(first.departTime):''}` : '';
  const arrStr = last.arriveDate ? `${fmtDate(last.arriveDate)}${last.arriveTime?' · '+esc(last.arriveTime):''}` : '';
  let datesHtml = '';
  if(depStr || arrStr){
    datesHtml = `<div class="ticket-dates">${depStr?`<span class="seg">🛫 <b>${depStr}</b></span>`:''}${arrStr?`<span class="seg">🛬 <b>${arrStr}</b></span>`:''}</div>`;
  }
  const bars = Array.from(t.id || 'x').map((ch, i) => {
    const w = (ch.charCodeAt(0) % 3) + 1;
    const h = ((i * 7) % 12) + 8;
    return `<span style="height:${h}px;width:${w}px"></span>`;
  }).join('');
  const allPoints = [segs[0]?.from, ...segs.map(s=>s.to)].filter(Boolean);
  const mapLink = allPoints.length >= 2 ? `https://yandex.ru/maps/?rtext=${allPoints.map(p=>encodeURIComponent(p)).join('~')}&rtt=auto` : '';
  const priceLine = t.price ? `<span class="price">${fmtMoney(t.price, 'RUB')}</span>` : '';
  const seatsLine = segs.map(s=>s.seat).filter(Boolean);
  const seatHtml = seatsLine.length ? `<span class="seat">место ${esc(seatsLine.join(', '))}</span>` : '';
  const carrierLine = t.carrier || (segs[0] && segs[0].carrier) || '';
  return `<div class="ticket-card" onclick="openTicketModal('${t.id}')">
    <div class="ticket-head">
      <span class="type">${ticketIcon(t.type)} ${ticketLabel(t.type)}</span>
      ${t.ticketNumber?`<span class="num">${esc(t.ticketNumber)}</span>`:''}
    </div>
    <div class="ticket-body">

        <div><label>Время</label><input data-k="departTime" data-i="${i}" type="time" value="${esc(sg.departTime||'')}" /></div>
      </div>
      <div class="row">
        <div><label>Прибытие</label><input data-k="arriveDate" data-i="${i}" type="date" value="${esc(sg.arriveDate||'')}" /></div>

        <div><label>Рейс / поезд</label><input data-k="number" data-i="${i}" value="${esc(sg.number||'')}" placeholder="SU 1234" /></div>
        <div><label>Место</label><input data-k="seat" data-i="${i}" value="${esc(sg.seat||'')}" placeholder="12A" /></div>

    </div>`;
  }).join('');
  box.querySelectorAll('input[data-k]').forEach(el => {
    el.addEventListener('input', ()=>{
      const i = parseInt(el.dataset.i, 10);
      const k = el.dataset.k;
      if(state.ticketSegments[i]) state.ticketSegments[i][k] = el.value;
    });

}
function addTicketSegment(){
  const last = state.ticketSegments[state.ticketSegments.length-1] || {};
  state.ticketSegments.push({ id: uid(), from: last.to || '', to:'', departDate: last.arriveDate || '', departTime:'', arriveDate:'', arriveTime:'', carrier:'', number:'', seat:'' });
  renderTicketSegments();
}
function addReturnSegment(){
  const segs = state.ticketSegments;
  if(!segs.length) return;
  const points = [segs[0].from, ...segs.map(s=>s.to)].filter(Boolean);
  if(points.length < 2){ alert('Заполните откуда и куда'); return; }
  const reversed = points.slice().reverse();
  const returnSegs = [];
  for(let i=0; i<reversed.length-1; i++){
    returnSegs.push({ id: uid(), from: reversed[i], to: reversed[i+1], departDate:'', departTime:'', arriveDate:'', arriveTime:'', carrier:'', number:'', seat:'' });
  }
  state.ticketSegments = state.ticketSegments.concat(returnSegs);
  renderTicketSegments();
}
function removeTicketSegment(i){
  if(state.ticketSegments.length <= 1) return;
  state.ticketSegments.splice(i, 1);
  renderTicketSegments();
}

   ПОИСК ТОЧКИ БИЛЕТА (from/to)
   ========================================================= */
let ticketPointAbort = null;
let ticketPointTimer = null;

function openTicketPointSearch(segmentIndex, field){
  // Сначала синхронизируем все поля сегментов из DOM в state
  const box = document.getElementById('tk-segments');
  if(box){
    box.querySelectorAll('input[data-k]').forEach(el => {
      const i = parseInt(el.dataset.i, 10);
      const k = el.dataset.k;
      if(state.ticketSegments[i]) state.ticketSegments[i][k] = el.value;
    });
  }

  // Также синхронизируем общие поля билета
  const tkType = document.getElementById('tk-type');
  const tkCarrier = document.getElementById('tk-carrier');
  const tkNumber = document.getElementById('tk-ticket-number');
  const tkPrice = document.getElementById('tk-price');
  const tkLink = document.getElementById('tk-link');
  const tkNotes = document.getElementById('tk-notes');
  state._ticketDraft = {
    type: tkType ? tkType.value : 'other',
    carrier: tkCarrier ? tkCarrier.value.trim() : '',
    ticketNumber: tkNumber ? tkNumber.value.trim() : '',
    price: tkPrice ? parseFloat(tkPrice.value) || 0 : 0,
    link: tkLink ? tkLink.value.trim() : '',
    notes: tkNotes ? tkNotes.value.trim() : ''
  };

  const sg = state.ticketSegments[segmentIndex];
  if(!sg) return;
  const curValue = sg[field] || '';
  const curLat = sg[field + 'Lat'];
  const curLng = sg[field + 'Lng'];

  openModal(`
    <div class="modal-head">
      <h3>📍 Точка «${field === 'from' ? 'Откуда' : 'Куда'}»</h3>
      <button class="btn-ghost" onclick="closeTicketPointSearch()">Отмена</button>
    </div>
    <div class="modal-body">
      <label>Название города или аэропорта</label>
<div class="coords-row">
  <input id="tp-query" placeholder="Например: Шереметьево, Москва" value="${esc(curValue)}" autocomplete="off" />
  <button type="button" onclick="runTicketPointSearch(${segmentIndex}, '${field}')">🔍</button>
</div>
<div class="suggestions" id="tp-suggestions"></div>
      ${curLat != null ? `
        <p class="muted" style="margin:0;font-size:12px">
          Текущие координаты: ${curLat.toFixed(4)}, ${curLng.toFixed(4)}
        </p>
      ` : ''}
      <p class="muted" style="margin:0;font-size:12px">
        Выбери точку из подсказок — координаты сохранятся в билете.
      </p>
    </div>
    <div class="modal-foot">
      ${curLat != null ? `<button class="btn btn-danger" onclick="clearTicketPoint(${segmentIndex}, '${field}')">Убрать координаты</button>` : ''}
      <button class="btn" onclick="closeTicketPointSearch()">Готово</button>
    </div>
  `);

  const input = document.getElementById('tp-query');
  if(input){
    input.addEventListener('input', ()=> runTicketPointSearch(segmentIndex, field));
    input.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); runTicketPointSearch(segmentIndex, field); }
    });
  }
}

function runTicketPointSearch(segmentIndex, field){
  const input = document.getElementById('tp-query');
  const box = document.getElementById('tp-suggestions');
  if(!input || !box) return;
  const q = input.value.trim();
  if(q.length < 3){ box.innerHTML = ''; return; }

  if(ticketPointAbort) ticketPointAbort.abort();
  clearTimeout(ticketPointTimer);

  ticketPointTimer = setTimeout(async ()=>{
    box.innerHTML = '<div class="loading">Ищу...</div>';
    ticketPointAbort = new AbortController();
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=ru&q=${encodeURIComponent(q)}`;
      const res = await fetch(url, { signal: ticketPointAbort.signal, headers: { 'Accept': 'application/json' } });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if(!data.length){ box.innerHTML = '<div class="loading">Ничего не найдено</div>'; return; }
            box.innerHTML = data.map((d, idx) => {
        const name = (d.display_name||'').split(',')[0];
        const addr = (d.display_name||'').split(',').slice(1).join(',').trim();
        return `<div class="suggestion" data-idx="${idx}">
          <span class="name">${esc(name)}</span>
          <span class="addr">${esc(addr)}</span>
        </div>`;
      }).join('');

      // Навешиваем обработчики через addEventListener — так надёжнее
      box.querySelectorAll('.suggestion').forEach((el, idx) => {
        el.addEventListener('click', ()=>{
          const d = data[idx];
          const lat = parseFloat(d.lat);
          const lng = parseFloat(d.lon);
          pickTicketPoint(segmentIndex, field, lat, lng, d.display_name || '');
        });
      });
    }catch(e){
      if(e.name === 'AbortError') return;
      box.innerHTML = '<div class="loading">Ошибка поиска.</div>';
    }
  }, 500);
}

function pickTicketPoint(segmentIndex, field, lat, lng, fullName){
  const sg = state.ticketSegments[segmentIndex];
  if(!sg) return;

  // Если пользователь не менял название — оставляем то, что ввёл
  const input = document.getElementById('tp-query');
  if(input && input.value.trim()){
    sg[field] = input.value.trim();
  } else {
    sg[field] = (fullName || '').split(',')[0] || sg[field];
  }
  sg[field + 'Lat'] = lat;
  sg[field + 'Lng'] = lng;

  // Сохраняем прямо в билет, чтобы координаты не потерялись при пересоздании state
  const trip = ensureTrip(trips.find(t => t.id === state.tripId));
  const ticketId = state._editingTicketId;
  if(ticketId){
    const ticket = trip.tickets.find(t => t.id === ticketId);
    if(ticket && ticket.segments && ticket.segments[segmentIndex]){
      ticket.segments[segmentIndex][field] = sg[field];
      ticket.segments[segmentIndex][field + 'Lat'] = lat;
      ticket.segments[segmentIndex][field + 'Lng'] = lng;
      DB.save(trips);
    }
  }

  renderTicketSegments();
  closeTicketPointSearch();
}

function clearTicketPoint(segmentIndex, field){
  const sg = state.ticketSegments[segmentIndex];
  if(!sg) return;
  sg[field + 'Lat'] = null;
  sg[field + 'Lng'] = null;

  const trip = ensureTrip(trips.find(t => t.id === state.tripId));
  const ticketId = state._editingTicketId;
  if(ticketId){
    const ticket = trip.tickets.find(t => t.id === ticketId);
    if(ticket && ticket.segments && ticket.segments[segmentIndex]){
      ticket.segments[segmentIndex][field + 'Lat'] = null;
      ticket.segments[segmentIndex][field + 'Lng'] = null;
      DB.save(trips);
    }
  }

  renderTicketSegments();
  closeTicketPointSearch();
}

function closeTicketPointSearch(){
  // Возвращаемся к модалке билета
  openTicketModalAgain();
}

function openTicketModalAgain(){
  // Перерисовываем модалку билета с текущими сегментами
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const isNew = !state.editingTicketId;
  // Просто заново открываем модалку билета, используя уже существующий state
  // Мы должны знать, редактировали ли билет. Используем трюк: если state.editingId — то это
  // активность, не билет. Для билетов сохраним отдельный маркер.
  // Проще: восстановим модалку через openTicketModal, передав id, если он был.
  const id = state._editingTicketId || null;
  openTicketModal(id);
}

function saveTicket(id){
    state._ticketDraft = null;
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const box = document.getElementById('tk-segments');
  if(box){
    box.querySelectorAll('input[data-k]').forEach(el => {
      const i = parseInt(el.dataset.i, 10);
      const k = el.dataset.k;
      if(state.ticketSegments[i]) state.ticketSegments[i][k] = el.value;
    });
  }
  const type = document.getElementById('tk-type').value || 'other';
  const carrier = document.getElementById('tk-carrier').value.trim();
  const ticketNumber = document.getElementById('tk-ticket-number').value.trim();
  const price = parseFloat(document.getElementById('tk-price').value) || 0;
  const link = document.getElementById('tk-link').value.trim();
  const notes = document.getElementById('tk-notes').value.trim();
  const addExpense = document.getElementById('tk-add-expense').checked;
  const validSegs = state.ticketSegments.filter(sg => sg.from && sg.to);
  if(!validSegs.length){ alert('Заполни хотя бы один сегмент'); return; }
  const data = {
    type, carrier, ticketNumber, price, link, notes,
        segments: state.ticketSegments.map(sg => ({
      id: sg.id || uid(),
      from: sg.from || '', to: sg.to || '',
      fromLat: (typeof sg.fromLat === 'number') ? sg.fromLat : null,
      fromLng: (typeof sg.fromLng === 'number') ? sg.fromLng : null,
      toLat: (typeof sg.toLat === 'number') ? sg.toLat : null,
      toLng: (typeof sg.toLng === 'number') ? sg.toLng : null,
      departDate: sg.departDate || '', departTime: sg.departTime || '',
      arriveDate: sg.arriveDate || '', arriveTime: sg.arriveTime || '',
      carrier: sg.carrier || '', number: sg.number || '', seat: sg.seat || ''
    }))
  };
  if(id){
    const t = trip.tickets.find(x=>x.id===id);
    Object.assign(t, data);
  } else {
    trip.tickets.push({ id: uid(), ...data });
  }
  if(addExpense && price > 0){
    let cat = trip.budget.categories.find(c => c.name.toLowerCase() === 'транспорт');
    if(!cat){ cat = { id: uid(), name:'Транспорт', planned:0, color:'#34c759' }; trip.budget.categories.push(cat); }
    const first = data.segments[0];
    const last = data.segments[data.segments.length-1];
    trip.budget.expenses.push({
      id: uid(),
      title: `${ticketLabel(type)}: ${first.from || '—'} → ${last.to || '—'}`,
      amount: price,
      date: first.departDate || todayISO(),
      categoryId: cat.id,
      note: ticketNumber ? `бронь ${ticketNumber}` : '',
      priceInRUB: true,
      isPrepaid: true
    });
  }
  DB.save(trips);
  closeModal();
  render();
}
function deleteTicket(id){
  if(!confirm('Удалить билет?')) return;
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  trip.tickets = trip.tickets.filter(t => t.id !== id);
  DB.save(trips);
  closeModal();
  render();
}

        return `<div class="budget-row" onclick="openExpenseModal('${e.id}')">

          <div class="name">${esc(e.title||'—')}<span class="note">${e.date?fmtDate(e.date)+' · ':''}${cat?esc(cat.name):'—'}${e.priceInRUB?' · в ₽':''}</span></div>
          <div class="amount">${fmtMoney(rub, 'RUB')}${subLine}</div>
        </div>`;
      }).join('')
    : `<div class="budget-row" style="cursor:default"><div class="name muted">Пока нет трат</div></div>`;

  const savHtml = b.savings.length
    ? b.savings.map(s => `<div class="saving-card">
        <div class="saving-head"><span class="name">${esc(s.title)}</span><button class="del" onclick="event.stopPropagation();deleteSaving('${s.id}')">✕</button></div>
        <div class="saving-meta">${fmtMoney(s.saved, 'RUB')} из ${fmtMoney(s.target, 'RUB')}${s.deadline?' · до '+fmtDate(s.deadline):''}</div>
        <div class="saving-bar"><div style="width:${s.pct}%"></div></div>
        <div class="saving-actions">
          <button class="btn-mini" onclick="openTopUpModal('${s.id}')">💰 Пополнить</button>
          <button class="btn-mini" onclick="openSavingHistory('${s.id}')">📜 История</button>
        </div>
      </div>`).join('')
    : `<div class="saving-card muted">Пока нет целей накопления</div>`;

  const byDays = calcByDays(trip);
  let daysHtml = '';
  if(byDays.days.length){
    const rowsHtml = byDays.days.map(r => {
      const label = new Date(r.date).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'});
      const diffSign = r.diff >= 0 ? '+' : '−';
      return `<div class="budget-row" style="cursor:default">
        <div class="name">${r.isToday ? '🔵 ' : ''}${esc(label)}</div>
        <div class="amount">${fmtMoney(r.fact, 'RUB')}<span class="plan">план: ${fmtMoney(r.plan, 'RUB')}</span><span class="plan" style="color:${r.diff >= 0 ? 'var(--ok)' : 'var(--danger)'}">${diffSign} ${fmtMoney(Math.abs(r.diff), 'RUB')}</span></div>
      </div>`;
    }).join('');
    const totalDiffCls = byDays.diff >= 0 ? 'var(--ok)' : 'var(--danger)';
    const totalDiffSign = byDays.diff >= 0 ? '+' : '−';
    daysHtml = `<div class="budget-section">
      <div class="budget-section-head"><span>📊 Бюджет vs факт по дням</span></div>
      <div class="budget-section-body">
        <div class="budget-row" style="cursor:default"><div class="name muted" style="font-size:12px">Без предоплаченных билетов и жилья — только траты на месте</div></div>
        ${rowsHtml}
      </div>
      ${byDays.prepaidTotal > 0 ? `<div class="checklist-total"><span class="label">Предоплачено (вне дней):</span><span class="value">${fmtMoney(byDays.prepaidTotal, 'RUB')}</span></div>` : ''}
      <div class="checklist-total"><span class="label">Итого план:</span><span class="value">${fmtMoney(byDays.totalPlan, 'RUB')}</span></div>
      <div class="checklist-total" style="border-top:none"><span class="label">Итого факт (на месте):</span><span class="value">${fmtMoney(byDays.totalFact, 'RUB')}</span></div>
      <div class="checklist-total" style="border-top:none"><span class="label">Разница:</span><span class="value" style="color:${totalDiffCls}">${totalDiffSign} ${fmtMoney(Math.abs(byDays.diff), 'RUB')}</span></div>
    </div>`;
  }

  const splits = calcSplits(trip);
  let splitsHtml = '';
  if((trip.budget.expenses||[]).length){
    const othersHtml = splits.others.length
      ? splits.others.map(o => {
          const diff = o.owesMe - o.iOwe;
          let line = '';
          if(diff > 0) line = `<span class="plan" style="color:var(--ok)">должен мне: ${fmtMoney(diff, 'RUB')}</span>`;
          else if(diff < 0) line = `<span class="plan" style="color:var(--danger)">я должен: ${fmtMoney(Math.abs(diff), 'RUB')}</span>`;
          else line = `<span class="plan">в расчёте</span>`;
          return `<div class="budget-row" style="cursor:default">
            <span class="dot" style="background:var(--accent)"></span>
            <div class="name">${esc(o.name)}<span class="note">оплатил: ${fmtMoney(o.paid, 'RUB')}</span></div>
            <div class="amount">${fmtMoney(Math.abs(diff), 'RUB')}${line}</div>
          </div>`;
        }).join('')
      : `<div class="budget-row" style="cursor:default"><div class="name muted">Все траты оплачены вами</div></div>`;
    const bal = splits.balance;
    const balColor = bal > 0 ? 'var(--ok)' : (bal < 0 ? 'var(--danger)' : 'var(--muted)');
    const balText = bal > 0 ? `Мне должны: ${fmtMoney(bal, 'RUB')}` : bal < 0 ? `Я должен: ${fmtMoney(Math.abs(bal), 'RUB')}` : 'Всё в расчёте';
    splitsHtml = `<div class="budget-section">
      <div class="budget-section-head"><span>👥 Кто кому должен</span><button class="btn-ghost" onclick="openMeModal()" style="padding:2px 8px;font-size:12px">Моё имя</button></div>
      <div class="budget-section-body">${othersHtml}</div>
      <div class="checklist-total"><span class="label">Я оплатил:</span><span class="value">${fmtMoney(splits.myPaid, 'RUB')}</span></div>
      <div class="checklist-total" style="border-top:none"><span class="label">Моя доля:</span><span class="value">${fmtMoney(splits.myShare, 'RUB')}</span></div>
      <div class="checklist-total" style="border-top:none"><span class="label">Итог:</span><span class="value" style="color:${balColor}">${balText}</span></div>
    </div>`;
  }

  c.innerHTML = `<div style="overflow-y:auto;flex:1;padding-bottom:80px">
    ${hero}
    <div class="budget-section">
      <div class="budget-section-head"><span>💵 Курсы валют</span><button class="btn-ghost" onclick="openRatesModal()" style="padding:2px 8px;font-size:12px">Изменить</button></div>
      <div class="budget-section-body">
        <div class="budget-row" style="cursor:default"><div class="name">Валюта поездки</div><div class="amount">${trip.currency} ${curSym(trip.currency)}</div></div>
        <div class="budget-row" style="cursor:default"><div class="name">1 USD</div><div class="amount">${fmtMoney(trip.rates.USD||DEFAULT_RATES.USD, 'RUB')}</div></div>
        ${trip.currency !== 'RUB' && trip.currency !== 'USD' ? (() => {
          const unit = rateDisplayUnit(trip.currency);
          const perUnit = trip.rates[trip.currency] || DEFAULT_RATES[trip.currency] || 0;
          return `<div class="budget-row" style="cursor:default"><div class="name">${unit} ${trip.currency}</div><div class="amount">${fmtMoney(perUnit * unit, 'RUB')}</div></div>`;
        })() : ''}
      </div>
    </div>
    <div class="budget-section">
      <div class="budget-section-head"><span>📋 Смета по категориям</span><button class="btn-ghost" onclick="openAddCategoryModal()" style="padding:2px 8px;font-size:12px">+ Категория</button></div>
      <div class="budget-section-body">${catsHtml}</div>
    </div>
    <div class="budget-section">
      <div class="budget-section-head"><span>💸 Траты</span><button class="btn-ghost" onclick="openExpenseModal()" style="padding:2px 8px;font-size:12px">+ Трата</button></div>
      <div class="budget-section-body">${expHtml}</div>
    </div>
    <div class="budget-section">
      <div class="budget-section-head"><span>🎯 Накопления</span><button class="btn-ghost" onclick="openSavingModal()" style="padding:2px 8px;font-size:12px">+ Цель</button></div>
      <div class="budget-section-body">${savHtml}</div>
    </div>
    ${daysHtml}
    ${splitsHtml}
  </div>`;
}

function openRatesModal(){

      ${cur !== 'RUB' && cur !== 'USD' ? (() => {
        const unit = rateDisplayUnit(cur);
        const perUnit = trip.rates[cur] || DEFAULT_RATES[cur] || 0;
        return `<div><label>${unit} ${cur} = ? ₽</label><input id="r-trip" type="number" min="0" step="0.01" value="${perUnit * unit || ''}" /></div>`;
      })() : ''}
    </div>
    <div class="modal-foot"><button class="btn" onclick="saveRates()">Сохранить</button></div>`);
}
function saveRates(){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const usd = parseFloat(document.getElementById('r-usd').value);
  if(!isNaN(usd) && usd > 0) trip.rates.USD = usd;
  const el = document.getElementById('r-trip');
  if(el){
    const v = parseFloat(el.value);
    const unit = rateDisplayUnit(trip.currency);
    if(!isNaN(v) && v > 0) trip.rates[trip.currency] = v / unit;
  }
  DB.save(trips); closeModal(); render();
}
const CAT_COLORS = ['#2aabee','#34c759','#ff9500','#af52de','#ff2d55','#ff0000','#8e8e93','#00c7be','#5856d6','#ffcc00'];

function pickCatColor(color){
  document.getElementById('c-color').value = color;

}
function saveCategory(id){

  if(!name){ alert('Введите название'); return; }
  const plan = parseFloat(document.getElementById('c-plan').value) || 0;
  const color = document.getElementById('c-color').value || CAT_COLORS[0];
  if(id){
    const cat = trip.budget.categories.find(c=>c.id===id);
    Object.assign(cat, {name, planned:plan, color});
  } else {
    trip.budget.categories.push({ id:uid(), name, planned:plan, color });

  DB.save(trips); closeModal(); render();
}
function deleteCategory(id){

function saveExpense(id){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const title = document.getElementById('e-title').value.trim() || 'Без названия';
  const amount = parseFloat(document.getElementById('e-amount').value);
  if(isNaN(amount) || amount < 0){ alert('Введите сумму'); return; }
  const date = document.getElementById('e-date').value;
  const categoryId = document.getElementById('e-cat').value;
  const note = document.getElementById('e-note').value.trim();
  const paidBy = (document.getElementById('e-paid-by').value || trip.me || 'Я').trim();
  const splitWith = Math.max(1, parseInt(document.getElementById('e-split').value, 10) || 1);
  if(id){
    const e = trip.budget.expenses.find(x=>x.id===id);
    Object.assign(e, {title, amount, date, categoryId, note, paidBy, splitWith});
  } else {
    trip.budget.expenses.push({ id:uid(), title, amount, date, categoryId, note, paidBy, splitWith });
  }
  DB.save(trips); closeModal(); render();
}
function deleteExpense(id){
  if(!confirm('Удалить трату?')) return;
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  trip.budget.expenses = trip.budget.expenses.filter(x=>x.id!==id);
  DB.save(trips); closeModal(); render();
}

function saveSaving(id){

function deleteSaving(id){

function openTopUpModal(savingId){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const s = trip.budget.savings.find(x=>x.id===savingId);
  if(!s) return;

    </div>
    <div class="modal-foot"><button class="btn" onclick="saveTopUp('${savingId}')">Пополнить</button></div>`);
}
function saveTopUp(savingId){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const s = trip.budget.savings.find(x=>x.id===savingId);
  if(!s) return;
  const amount = parseFloat(document.getElementById('t-amount').value);
  if(isNaN(amount) || amount === 0){ alert('Введите сумму'); return; }
  const date = document.getElementById('t-date').value;

function openSavingHistory(savingId){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const s = trip.budget.savings.find(x=>x.id===savingId);
  if(!s) return;
  const list = (s.transactions||[]).slice().reverse();
  openModal(`
    <div class="modal-head"><h3>История: ${esc(s.title)}</h3><button class="btn-ghost" onclick="closeModal()">Закрыть</button></div>
    <div class="modal-body">
      ${list.length ? list.map(tr => `
        <div class="budget-row" style="cursor:default">
          <div class="name">${fmtMoney(tr.amount, 'RUB')}<span class="note">${tr.date?fmtDate(tr.date):''} ${tr.note?'· '+esc(tr.note):''}</span></div>
          <button class="del" onclick="deleteTopUp('${savingId}','${tr.id}')">✕</button>
        </div>`).join('') : `<p class="muted center">Пока нет пополнений</p>`}
    </div>`);
}
function deleteTopUp(savingId, trId){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const s = trip.budget.savings.find(x=>x.id===savingId);
  if(!s) return;
  s.transactions = (s.transactions||[]).filter(t=>t.id!==trId);
  DB.save(trips);
  openSavingHistory(savingId);
  render();
}

/* =============== МОДАЛКА АКТИВНОСТИ =============== */
function openActivityModal(id){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  state.editingId = id || null;
  state.tempChecklist = null;
  const a = id ? trip.activities.find(x=>x.id===id) : null;
  const days = daysBetween(trip.start, trip.end);
  const dateOptions = days.map(d => {
    const label = new Date(d).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'});
    return `<option value="${d}" ${a && a.date===d ? 'selected':''}>${label}</option>`;
  }).join('');
  const checklistHtml = (a && a.checklist ? a.checklist : []).map(c => `
    <div class="check-item ${c.done?'done':''}" data-id="${c.id}">

function attachChecklistSwipe(el){
  let startX=0, startY=0, dx=0, dragging=false, decided=false, isHorizontal=false;
  let longPressTimer = null, longPressFired = false;
  const MAX = 170, THRESHOLD = 70;
  const cancelLongPress = ()=>{ if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; } };
  el.addEventListener('pointerdown', e=>{
    if(e.target.closest('a,button')) return;
    startX = e.clientX; startY = e.clientY;
    dx = 0; dragging = true; decided = false; isHorizontal = false;
    longPressFired = false;
    cancelLongPress();
    const id = el.dataset.id;
    const section = el.dataset.section;
    longPressTimer = setTimeout(()=>{
      if(dragging && !decided){
        longPressFired = true;
        dragging = false;
        el.classList.remove('dragging');
        if(navigator.vibrate) navigator.vibrate(15);
        openChecklistItemModal(section, id);
      }
    }, 500);
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const mx = e.clientX - startX;
    const my = e.clientY - startY;
    if(!decided){
      if(Math.abs(mx) > 6 || Math.abs(my) > 6){
        decided = true;
        cancelLongPress();
        isHorizontal = Math.abs(mx) > Math.abs(my);
        if(!isHorizontal){ dragging = false; el.classList.remove('dragging'); }
      }
    }
    if(isHorizontal){
      dx = Math.max(-MAX, Math.min(0, mx));
      el.style.transform = `translateX(${dx}px)`;
      if(Math.abs(mx) > 4) e.preventDefault();
    }
  });
  const finish = ()=>{
    cancelLongPress();
    if(!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    if(dx < -THRESHOLD){
      el.style.transform = `translateX(-${MAX}px)`;
      el.dataset.open = '1';
    } else {
      el.style.transform = 'translateX(0)';
      el.dataset.open = '';
    }
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', finish);
  el.addEventListener('pointerleave', finish);
  el.addEventListener('click', e=>{
    if(longPressFired){ e.preventDefault(); e.stopPropagation(); longPressFired = false; return; }
    if(el.dataset.open === '1'){ e.preventDefault(); e.stopPropagation(); el.style.transform = 'translateX(0)'; el.dataset.open = ''; return; }
    e.preventDefault(); e.stopPropagation();
    toggleChecklistItem(el.dataset.section, el.dataset.id);
  }, true);
}

function saveChecklistItem(id, originalSection){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const section = document.getElementById('cl-section').value;
  const text = document.getElementById('cl-text').value.trim();
  if(!text){ alert('Введите текст'); return; }
  const note = document.getElementById('cl-note').value.trim();
  const price = parseFloat(document.getElementById('cl-price').value) || 0;
  const addToBudget = document.getElementById('cl-add-to-budget').checked;
  const data = { text, note, price };
  if(section === 'shopping') data.addToBudget = !!addToBudget;
  if(id && originalSection !== section){
    trip.checklists[originalSection] = trip.checklists[originalSection].filter(x=>x.id!==id);
  }
  if(id && originalSection === section){
    const item = trip.checklists[section].find(x=>x.id===id);
    Object.assign(item, data);
  } else {
    trip.checklists[section].push({ id: uid(), done:false, ...data });
  }
  DB.save(trips);
  closeModal();
  render();
}
function openCopyChecklistModal(){
  const current = ensureTrip(trips.find(t=>t.id===state.tripId));
  const candidates = trips.filter(t => t.id !== current.id).map(ensureTrip).filter(t => (t.checklists.packing||[]).length > 0);
  openModal(`

        ? `<p class="muted center" style="padding:20px 0">Нет других поездок с чек-листом сборов.</p>`
        : candidates.map(t => `<div class="prev-trip-item" onclick="copyPackingFrom('${t.id}')">
            <div class="title">${esc(t.title)}</div>
            <div class="meta">${(t.checklists.packing||[]).length} пунктов сборов</div>
          </div>`).join('')}

}
function copyPackingFrom(sourceTripId){
  const current = ensureTrip(trips.find(t=>t.id===state.tripId));
  const source = ensureTrip(trips.find(t=>t.id===sourceTripId));
  if(!source) return;
  const existingTexts = new Set(current.checklists.packing.map(x => (x.text||'').toLowerCase().trim()));
  let added = 0;
  (source.checklists.packing||[]).forEach(item => {
    const key = (item.text||'').toLowerCase().trim();
    if(existingTexts.has(key)) return;
    current.checklists.packing.push({ id: uid(), text: item.text || '', note: item.note || '', price: Number(item.price) || 0, done: false });
    added++;
  });
  DB.save(trips);
  closeModal();
  render();
  setTimeout(()=> alert(`Добавлено пунктов: ${added}.`), 50);
}

        <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text);font-weight:500;opacity:1;margin:0">
          <input type="checkbox" id="pr-budget" checked style="width:auto;margin:0" />
          Бюджет
        </label>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="doPrint()">Открыть окно печати</button>
      </div>
    `);
  }, 100);
}

function doPrint(){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  if(!trip) return;

  const include = {
    info: document.getElementById('pr-info').checked,
    lodging: document.getElementById('pr-lodging').checked,
    tickets: document.getElementById('pr-tickets').checked,
    activities: document.getElementById('pr-activities').checked,
    checklists: document.getElementById('pr-checklists').checked,
    budget: document.getElementById('pr-budget').checked
  };

  closeModal();

  const html = buildPrintHtml(trip, include);
  const win = window.open('', '_blank');
  if(!win){
    alert('Разреши всплывающие окна в браузере, чтобы открыть окно печати.');
    return;
  }
  win.document.write(html);
  win.document.close();

  // Ждём загрузки и вызываем печать
  win.onload = ()=>{
    setTimeout(()=>{ win.focus(); win.print(); }, 300);
  };
  // Резерв на случай, если onload не сработал
  setTimeout(()=>{
    try { win.focus(); win.print(); } catch(e){}
  }, 800);
}

function buildPrintHtml(trip, include){
  const days = daysBetween(trip.start, trip.end);
  const esc2 = s => (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDateRu = d => d ? new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}) : '—';

  let body = '';

  // Шапка
  body += `<header class="doc-head">
    <h1>${esc2(trip.title)}</h1>
    <div class="doc-sub">
      ${trip.place ? esc2(trip.place) + ' · ' : ''}
      ${fmtDateRu(trip.start)} — ${fmtDateRu(trip.end)}

  // Общая информация
  if(include.info){
    body += `<section>

        <tr><td>Название</td><td>${esc2(trip.title)}</td></tr>
        <tr><td>Место</td><td>${esc2(trip.place||'—')}</td></tr>
        <tr><td>Даты</td><td>${fmtDateRu(trip.start)} — ${fmtDateRu(trip.end)} (${days.length} дн.)</td></tr>
        ${trip.notes ? `<tr><td>Заметки</td><td>${esc2(trip.notes).replace(/\n/g,'<br>')}</td></tr>` : ''}
      </table>
    </section>`;
  }

  // Жильё
  if(include.lodging && (trip.lodging||[]).length){
    body += `<section>

        <div class="card">
          <div class="card-title">${esc2(l.title||'Жильё')}</div>

          ${l.address ? `<div class="line">📍 ${esc2(l.address)}</div>` : ''}
          ${l.price ? `<div class="line">💰 ${fmtMoney(l.price, 'RUB')}${l.priceNote?' · '+esc2(l.priceNote):''}</div>` : ''}
          ${l.link ? `<div class="line">🔗 ${esc2(l.link)}</div>` : ''}
          ${l.notes ? `<div class="line pre">${esc2(l.notes)}</div>` : ''}
        </div>
      `).join('')}
    </section>`;
  }

  // Билеты
  if(include.tickets && (trip.tickets||[]).length){
    body += `<section>
      <h2>✈️ Билеты</h2>
      ${(trip.tickets||[]).map(tk => {
        const segs = tk.segments || [];
        const first = segs[0] || {};
        const last = segs[segs.length-1] || {};
        const route = [first.from, ...segs.map(s=>s.to)].filter(Boolean).join(' → ');
        return `
          <div class="card">
            <div class="card-title">${ticketIcon(tk.type)} ${ticketLabel(tk.type)}${tk.ticketNumber?' · '+esc2(tk.ticketNumber):''}</div>
            <div class="line"><b>${esc2(route || '—')}</b></div>
            ${first.departDate ? `<div class="line">🛫 Отправление: ${fmtDateRu(first.departDate)}${first.departTime?' · '+esc2(first.departTime):''}</div>` : ''}
            ${last.arriveDate ? `<div class="line">🛬 Прибытие: ${fmtDateRu(last.arriveDate)}${last.arriveTime?' · '+esc2(last.arriveTime):''}</div>` : ''}
            ${tk.carrier ? `<div class="line">Перевозчик: ${esc2(tk.carrier)}</div>` : ''}
            ${segs.length > 1 ? `<div class="line">Сегментов: ${segs.length}</div>` : ''}
            ${segs.map((sg, i) => `
              <div class="line small">
                ${i+1}. ${esc2(sg.from||'—')} → ${esc2(sg.to||'—')}

                ${sg.number?' · рейс '+esc2(sg.number):''}
                ${sg.seat?' · место '+esc2(sg.seat):''}

            ${tk.price ? `<div class="line">💰 ${fmtMoney(tk.price, 'RUB')}</div>` : ''}

          </div>
        `;
      }).join('')}
    </section>`;
  }

  // Места по дням
  if(include.activities && (trip.activities||[]).length && days.length){
    body += `<section>
      <h2>📍 Места по дням</h2>
      ${days.map(d => {
        const list = (trip.activities||[]).filter(a => a.date === d);

        const label = new Date(d).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});

      ${(trip.activities||[]).filter(a=>!a.date).length ? `

  // Чек-листы
  if(include.checklists && trip.checklists && ((trip.checklists.packing||[]).length || (trip.checklists.shopping||[]).length)){

          ${(trip.checklists.packing||[]).map(item => `

            </div>
          `).join('')}
        </div>
      ` : ''}
      ${(trip.checklists.shopping||[]).length ? `
        <div class="card">
          <div class="card-title">Желаемые покупки</div>
          ${(trip.checklists.shopping||[]).map(item => `
            <div class="check-line ${item.done?'done':''}">
              <span class="check-box">${item.done?'☑':'☐'}</span>
              <span>${esc2(item.text)}${item.price?' · '+fmtMoney(item.price, 'RUB'):''}${item.note?' — '+esc2(item.note):''}</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </section>`;
  }

  // Бюджет
  if(include.budget){
    const b = calcBudget(trip);
    body += `<section>
      <h2>💰 Бюджет</h2>
      <table class="kv">
        <tr><td>Общий бюджет</td><td>${fmtMoney(b.total, 'RUB')}</td></tr>
        <tr><td>Потрачено</td><td>${fmtMoney(b.factRUB, 'RUB')}</td></tr>
        <tr><td>Осталось</td><td>${fmtMoney(b.left, 'RUB')}</td></tr>
      </table>
      ${b.byCat.length ? `
        <h3 class="sub-h">По категориям</h3>
        <table class="kv">
          <thead><tr><th>Категория</th><th>План</th><th>Факт</th></tr></thead>
          <tbody>
            ${b.byCat.map(x => `
              <tr>
                <td>${esc2(x.cat.name)}</td>
                <td>${fmtMoney(x.planned, 'RUB')}</td>
                <td>${fmtMoney(x.fact, 'RUB')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : ''}
      ${(trip.budget.expenses||[]).length ? `
        <h3 class="sub-h">Траты</h3>
        <table class="kv">
          <thead><tr><th>Дата</th><th>Название</th><th>Сумма</th></tr></thead>
          <tbody>
            ${(trip.budget.expenses||[]).slice().sort((a,b2)=> (a.date||'').localeCompare(b2.date||'')).map(e => {
              const cat = trip.budget.categories.find(c=>c.id===e.categoryId);
              const rub = e.priceInRUB ? (e.amount||0) : toRUB(e.amount||0, trip.currency, trip);
              return `<tr>
                <td>${e.date?fmtDateRu(e.date):'—'}</td>
                <td>${esc2(e.title||'—')}${cat?' · '+esc2(cat.name):''}</td>
                <td>${fmtMoney(rub, 'RUB')}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      ` : ''}
      ${b.savings.length ? `
        <h3 class="sub-h">Накопления</h3>
        <table class="kv">
          <thead><tr><th>Цель</th><th>Накоплено</th><th>Цель, ₽</th></tr></thead>
          <tbody>
            ${b.savings.map(s => `<tr>
              <td>${esc2(s.title)}</td>
              <td>${fmtMoney(s.saved, 'RUB')}</td>
              <td>${fmtMoney(s.target, 'RUB')}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      ` : ''}
    </section>`;
  }

  // Финальный HTML
  return `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>${esc2(trip.title)} — дорожная книга</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px 32px;

/* =============== ЭКСПОРТ / ИМПОРТ =============== */
function downloadJSON(data, filename){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportAll(){
  if(!trips.length){ alert('Нет поездок'); return; }
  downloadJSON({ app:'trips-planner', version:12, exportedAt:new Date().toISOString(), trips }, `trips-all-${todayISO()}.json`);
  closeModal();
}
function exportTrip(id){
  const trip = ensureTrip(trips.find(t=>t.id===id));
  if(!trip) return;
  downloadJSON({ app:'trips-planner', version:1, exportedAt:new Date().toISOString(), trips:[trip] }, `trip-${(trip.title||'trip').replace(/[^\wа-яА-Я\-]+/g,'_').slice(0,40)}-${todayISO()}.json`);
  closeModal();
}
const importInput = document.getElementById('import-file');
function triggerImport(){ closeModal(); importInput.value = ''; importInput.click(); }
importInput.addEventListener('change', async (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const incoming = normalizeImport(data);
    if(!incoming.length){ alert('В файле не найдено поездок.'); return; }
    askImportMode(incoming);
  }catch(err){
    console.error(err);
    alert('Не удалось прочитать файл: ' + err.message);
  }
});
function normalizeImport(data){
  let raw;
  if(Array.isArray(data)) raw = data;
  else if(data && Array.isArray(data.trips)) raw = data.trips;
  else return [];
  return raw.map(t => {
    if(!t || typeof t !== 'object') return null;
    const trip = {
      id: t.id || uid(),
      title: String(t.title || 'Без названия'),
      place: String(t.place || ''),
      start: String(t.start || ''),
      end: String(t.end || ''),
      notes: String(t.notes || ''),
      currency: t.currency || 'RUB',
      me: String(t.me || 'Я'),
      dayStart: String(t.dayStart || '09:00'),
      dayEnd: String(t.dayEnd || '21:00'),
      rates: (t.rates && typeof t.rates === 'object') ? t.rates : { ...DEFAULT_RATES },
      activities: Array.isArray(t.activities) ? t.activities.map(a=>({
        id: a.id || uid(), title: String(a.title || 'Без названия'),
        date: String(a.date || ''), time: String(a.time || ''),
        notes: String(a.notes || ''),
        lat: (typeof a.lat === 'number') ? a.lat : null,
        lng: (typeof a.lng === 'number') ? a.lng : null,
        type: String(a.type || 'other'),
        duration: Number(a.duration) || 60,
        openFrom: String(a.openFrom || ''),
        openTo: String(a.openTo || ''),
        checklist: Array.isArray(a.checklist) ? a.checklist.map(c=>({ id: c.id || uid(), text: String(c.text || ''), done: !!c.done })) : []
      })) : []
    };
    if(t.budget && typeof t.budget === 'object'){
      trip.budget = {
        total: Number(t.budget.total) || 0,
        categories: Array.isArray(t.budget.categories) ? t.budget.categories.map(c=>({ id: c.id || uid(), name: String(c.name || 'Категория'), planned: Number(c.planned) || 0, color: c.color || '#8e8e93' })) : [],
        expenses: Array.isArray(t.budget.expenses) ? t.budget.expenses.map(e=>({
          id: e.id || uid(), title: String(e.title || ''),
          amount: Number(e.amount) || 0, date: String(e.date || ''),
          categoryId: e.categoryId || '', note: String(e.note || ''),
          priceInRUB: !!e.priceInRUB, isPrepaid: !!e.isPrepaid,
          paidBy: String(e.paidBy || ''), splitWith: Math.max(1, parseInt(e.splitWith, 10) || 1)
        })) : [],
        savings: Array.isArray(t.budget.savings) ? t.budget.savings.map(s=>({
          id: s.id || uid(), title: String(s.title || ''),
          target: Number(s.target) || 0, deadline: String(s.deadline || ''),
          transactions: Array.isArray(s.transactions) ? s.transactions.map(tr=>({ id: tr.id || uid(), amount: Number(tr.amount) || 0, date: String(tr.date || ''), note: String(tr.note || '') })) : []
        })) : []
      };
    }
    trip.lodging = Array.isArray(t.lodging) ? t.lodging.map(l => ({
      id: l.id || uid(), title: String(l.title || ''), address: String(l.address || ''),
      lat: (typeof l.lat === 'number') ? l.lat : null,
      lng: (typeof l.lng === 'number') ? l.lng : null,
      checkInDate: String(l.checkInDate || ''), checkInTime: String(l.checkInTime || ''),
      checkOutDate: String(l.checkOutDate || ''), checkOutTime: String(l.checkOutTime || ''),
      price: Number(l.price) || 0, priceNote: String(l.priceNote || ''),
      link: String(l.link || ''), notes: String(l.notes || '')
    })) : [];
    trip.tickets = Array.isArray(t.tickets) ? t.tickets.map(tk => {
      if(Array.isArray(tk.segments)){
        return {
          id: tk.id || uid(), type: tk.type || 'other',
          ticketNumber: String(tk.ticketNumber || ''), carrier: String(tk.carrier || ''),
          price: Number(tk.price) || 0, link: String(tk.link || ''), notes: String(tk.notes || ''),
                    segments: tk.segments.map(sg => ({
            id: sg.id || uid(),
            from: String(sg.from || ''), to: String(sg.to || ''),
            fromLat: (typeof sg.fromLat === 'number') ? sg.fromLat : null,
            fromLng: (typeof sg.fromLng === 'number') ? sg.fromLng : null,
            toLat: (typeof sg.toLat === 'number') ? sg.toLat : null,
            toLng: (typeof sg.toLng === 'number') ? sg.toLng : null,
            departDate: String(sg.departDate || ''), departTime: String(sg.departTime || ''),
            arriveDate: String(sg.arriveDate || ''), arriveTime: String(sg.arriveTime || ''),
            carrier: String(sg.carrier || ''), number: String(sg.number || ''), seat: String(sg.seat || '')
          }))
        };
      }
      return migrateTicket({
        id: tk.id || uid(), type: tk.type || 'other',
        ticketNumber: tk.number || '', carrier: tk.carrier || '',
        price: Number(tk.price) || 0, link: String(tk.link || ''), notes: String(tk.notes || ''),
        from: tk.from || '', to: tk.to || '',
        departDate: tk.departDate || '', departTime: tk.departTime || '',
        arriveDate: tk.arriveDate || '', arriveTime: tk.arriveTime || '',
        number: tk.number || '', seat: tk.seat || ''
      });
    }) : [];
    trip.checklists = {
      packing: (t.checklists && Array.isArray(t.checklists.packing))
        ? t.checklists.packing.map(x => ({ id: x.id || uid(), text: String(x.text || ''), note: String(x.note || ''), price: Number(x.price) || 0, done: !!x.done }))
        : [],
      shopping: (t.checklists && Array.isArray(t.checklists.shopping))
        ? t.checklists.shopping.map(x => ({ id: x.id || uid(), text: String(x.text || ''), note: String(x.note || ''), price: Number(x.price) || 0, done: !!x.done, addToBudget: !!x.addToBudget }))
        : []
    };
    return ensureTrip(trip);
  }).filter(Boolean);
}
function askImportMode(incoming){
  openModal(`
    <div class="modal-head"><h3>Импорт поездок</h3><button class="btn-ghost" onclick="closeModal()">Отмена</button></div>
    <div class="modal-body">
      <p style="margin:0;font-size:14px;color:var(--muted)">В файле найдено поездок: <b style="color:var(--text)">${incoming.length}</b>. Что сделать?</p>
      <div class="menu-list" style="margin-top:8px">
        <button class="menu-item" onclick='doImport("merge", ${JSON.stringify(incoming).replace(/'/g,"&#39;")})'>
          <span class="emoji">🔀</span><span class="label">Объединить</span>
        </button>
        <button class="menu-item" onclick='doImport("replace", ${JSON.stringify(incoming).replace(/'/g,"&#39;")})'>
          <span class="emoji">♻️</span><span class="label">Заменить</span>
        </button>
      </div>
    </div>`);
}
function doImport(mode, incoming){
  if(typeof incoming === 'string') incoming = JSON.parse(incoming);
  let addedCount = 0;
  if(mode === 'replace'){ trips = incoming; addedCount = incoming.length; }
  else {
    const existingIds = new Set(trips.map(t=>t.id));
    const added = incoming.filter(t=>!existingIds.has(t.id));
    addedCount = added.length;
    trips = trips.concat(added);
  }
  DB.save(trips);
  closeModal();
  render();
  setTimeout(()=> alert(mode === 'replace' ? `Загружено: ${addedCount}.` : `Добавлено: ${addedCount}.`), 50);
}

/* =============== ПОИСК АДРЕСА =============== */
let searchAbort = null, searchTimerAddr = null;
function searchAddress(){
  const input = document.getElementById('m-coords');
  const box = document.getElementById('m-suggestions');
  if(!input || !box) return;
  const q = input.value.trim();
  if(q.length < 3){ box.innerHTML=''; return; }
  if(searchAbort) searchAbort.abort();
  clearTimeout(searchTimerAddr);
  searchTimerAddr = setTimeout(async ()=>{
    box.innerHTML = '<div class="loading">Ищу...</div>';
    searchAbort = new AbortController();
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=ru&q=${encodeURIComponent(q)}`;
      const res = await fetch(url, { signal: searchAbort.signal, headers: { 'Accept':'application/json' } });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      if(!data.length){ box.innerHTML = '<div class="loading">Ничего не найдено</div>'; return; }
            box.innerHTML = data.map((d, idx) => {
        const name = (d.display_name||'').split(',')[0];
        const addr = (d.display_name||'').split(',').slice(1).join(',').trim();
        return `<div class="suggestion" data-idx="${idx}">
          <span class="name">${esc(name)}</span>
          <span class="addr">${esc(addr)}</span>
        </div>`;
      }).join('');

      box.querySelectorAll('.suggestion').forEach((el, idx) => {
        el.addEventListener('click', ()=>{
          const d = data[idx];
          const lat = parseFloat(d.lat);
          const lng = parseFloat(d.lon);
          pickSuggestion(lat, lng);
        });
      });
    }catch(e){
      if(e.name === 'AbortError') return;
      box.innerHTML = '<div class="loading">Ошибка поиска.</div>';
    }
  }, 500);
}
function pickSuggestion(lat, lng){
  const input = document.getElementById('m-coords');
  if(!input) return;
  input.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  const box = document.getElementById('m-suggestions');
  if(box) box.innerHTML = '';
}

/* =============== МИГРАЦИЯ ПРЕДОПЛАТ =============== */
const TICKET_TITLE_PREFIXES = ['Самолёт:','Поезд:','Автобус:','Машина:','Паром:','Другое:','✈️','🚆','🚌','🚗','⛴️','🎫'];
function looksLikePrepaidExpense(e){
  if(e.isPrepaid) return true;
  const title = (e.title || '').trim();
  const note = (e.note || '').trim();
  if(title.includes('(жильё)')) return true;
  for(const p of TICKET_TITLE_PREFIXES){ if(title.startsWith(p)) return true; }
  if(note.startsWith('бронь ')) return true;
  if(e.priceInRUB) return true;
  return false;
}
function migratePrepaidExpenses(){
  let changed = 0;
  trips.forEach(t => {
    ensureTrip(t);
    (t.budget.expenses || []).forEach(e => {
      if(!e.isPrepaid && looksLikePrepaidExpense(e)){ e.isPrepaid = true; changed++; }
    });
  });
  if(changed > 0){
    DB.save(trips);
    console.log(`Миграция предоплат: помечено ${changed} трат.`);
  }
}

/* =============== СТАРТ =============== */
trips.forEach(ensureTrip);
migratePrepaidExpenses();
DB.save(trips);
render();
