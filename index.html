  if(dRem.toDelete.length) {
    const ids = dRem.toDelete.map(x => x.id);
    ensure(await sb.from('reminders').delete().in('id', ids), 'reminders delete');
  }

  // Запоминаем, когда последний раз успешно синхронизировали
  trip._lastSyncedAt = now;
}

/* Загружает все поездки пользователя из облака.
   Собирает обратно в формат trip-объекта. */
async function cloudLoadTrips(){
  if(!sb || !currentUser) return [];
  const uid = currentUser.id;
  authLoading = true;

  try {

  // 1) Все поездки
  const { data: tripsData, error: tripsErr } = await sb
    .from('trips')
    .select('*')
    .eq('user_id', uid)
    .order('start_date', { ascending: false });
  if(tripsErr) throw tripsErr;
  if(!tripsData || !tripsData.length) return [];

  const tripIds = tripsData.map(t => t.id);

  // 2) Параллельно тянем все вложенные таблицы
    const [
    { data: actsData },
    { data: lodgeData },
    { data: ticketsData },
    { data: segmentsData },
    { data: expensesData },
    { data: categoriesData },
    { data: savingsData },
    { data: savingsTxData },
    { data: clData },
    { data: remData }
  ] = await Promise.all([
    sb.from('activities').select('*').in('trip_id', tripIds),
    sb.from('lodging').select('*').in('trip_id', tripIds),
    sb.from('tickets').select('*').in('trip_id', tripIds),
    sb.from('ticket_segments').select('*').in('ticket_id', (await sb.from('tickets').select('id').in('trip_id', tripIds)).data?.map(t => t.id) || []),
    sb.from('expenses').select('*').in('trip_id', tripIds),
    sb.from('categories').select('*').in('trip_id', tripIds),
    sb.from('savings').select('*').in('trip_id', tripIds),
    sb.from('savings_transactions').select('*').in('saving_id', (await sb.from('savings').select('id').in('trip_id', tripIds)).data?.map(s => s.id) || []),
    sb.from('checklists').select('*').in('trip_id', tripIds),
    sb.from('reminders').select('*').in('trip_id', tripIds)
  ]);

  // 3) Индексируем по trip_id
  const idx = {};
  tripIds.forEach(id => {
    idx[id] = { acts: [], lodge: [], tickets: [], expenses: [], categories: [], savings: [], cl: [], rem: [] };
  });
  (actsData || []).forEach(x => idx[x.trip_id]?.acts.push(x));
  (lodgeData || []).forEach(x => idx[x.trip_id]?.lodge.push(x));
  (ticketsData || []).forEach(x => idx[x.trip_id]?.tickets.push(x));
  (expensesData || []).forEach(x => idx[x.trip_id]?.expenses.push(x));
  (categoriesData || []).forEach(x => idx[x.trip_id]?.categories.push(x));
  (savingsData || []).forEach(x => idx[x.trip_id]?.savings.push(x));
  (clData || []).forEach(x => idx[x.trip_id]?.cl.push(x));
  (remData || []).forEach(x => idx[x.trip_id]?.rem.push(x));

  // 4) Индексируем сегменты по ticket_id
  const segByTicket = {};
  (segmentsData || []).forEach(sg => {
    if(!segByTicket[sg.ticket_id]) segByTicket[sg.ticket_id] = [];
    segByTicket[sg.ticket_id].push(sg);
  });
  Object.values(segByTicket).forEach(list => list.sort((a, b) => a.idx - b.idx));

  // 5) Индексируем транзакции накоплений по saving_id
  const txBySaving = {};
  (savingsTxData || []).forEach(tr => {
    if(!txBySaving[tr.saving_id]) txBySaving[tr.saving_id] = [];
    txBySaving[tr.saving_id].push(tr);
  });

  // 6) Собираем trips
  return tripsData.map(t => {
    const parts = idx[t.id];
    const activities = parts.acts.map(a => ({
      id: a.id,
      title: a.title,
      date: a.date || '',
      time: a.time || '',
      notes: a.notes || '',
      lat: a.lat,
      lng: a.lng,
      type: a.type || 'other',
      duration: a.duration || 60,
      openFrom: a.open_from || '',
      openTo: a.open_to || '',
      price: a.price || 0,
      addToExpense: !!a.add_to_expense,
      checklist: a.checklist || [],
      linkedTicketId: a.linked_ticket_id || null,
      linkedTicketRole: a.linked_ticket_role || null,
      linkedTicketSegmentIdx: (typeof a.linked_ticket_segment_idx === 'number') ? a.linked_ticket_segment_idx : null,
      lockedByTicket: !!a.locked_by_ticket
    }));
    const lodging = parts.lodge.map(l => ({
      id: l.id,
      title: l.title || '',
      address: l.address || '',
      lat: l.lat,
      lng: l.lng,
      checkInDate: l.check_in_date || '',
      checkInTime: l.check_in_time || '',
      checkOutDate: l.check_out_date || '',
      checkOutTime: l.check_out_time || '',
      price: l.price || 0,
      priceNote: l.price_note || '',
      link: l.link || '',
      notes: l.notes || '',
      attachmentId: l.attachment_id || null,
      attachmentName: l.attachment_name || null,
      attachmentSize: l.attachment_size || null,
      attachmentType: l.attachment_type || null
    }));
    const tickets = parts.tickets.map(tk => ({
      id: tk.id,
      type: tk.type || 'plane',
      carrier: tk.carrier || '',
      ticketNumber: tk.ticket_number || '',
      price: tk.price || 0,
      link: tk.link || '',
      notes: tk.notes || '',
      toPlan: !!tk.to_plan,
      attachmentId: tk.attachment_id || null,
      attachmentName: tk.attachment_name || null,
      attachmentSize: tk.attachment_size || null,
      attachmentType: tk.attachment_type || null,
      segments: (segByTicket[tk.id] || []).map(sg => ({
        id: sg.id,
        from: sg.from_city || '',
        to: sg.to_city || '',
        fromLat: sg.from_lat,
        fromLng: sg.from_lng,
        toLat: sg.to_lat,
        toLng: sg.to_lng,
        departDate: sg.depart_date || '',
        departTime: sg.depart_time || '',
        arriveDate: sg.arrive_date || '',
        arriveTime: sg.arrive_time || '',
        carrier: sg.carrier || '',
        number: sg.number || '',
        seat: sg.seat || ''
      }))
    }));
    const categories = parts.categories.map(c => ({
      id: c.id,
      name: c.name || '',
      planned: c.planned || 0,
      color: c.color || '#8e8e93'
    }));
    const expenses = parts.expenses.map(e => ({
      id: e.id,
      title: e.title || '',
      amount: e.amount || 0,
      date: e.date || '',
      categoryId: e.category_id || '',
      note: e.note || '',
      priceInRUB: !!e.price_in_rub,
      isPrepaid: !!e.is_prepaid,
      paidBy: e.paid_by || 'Я',
      splitWith: e.split_with || 1,
      linkedActivityId: e.linked_activity_id || null
    }));
    const savings = parts.savings.map(s => ({
      id: s.id,
      title: s.title || '',
      target: s.target || 0,
      deadline: s.deadline || '',
      transactions: (txBySaving[s.id] || []).map(tr => ({
        id: tr.id,
        amount: tr.amount || 0,
        date: tr.date || '',
        note: tr.note || ''
      }))
    }));
        const packing = parts.cl.filter(x => x.section === 'packing').map(x => ({
      id: x.id, text: x.text, note: x.note, price: x.price, done: !!x.done
    }));
    const shopping = parts.cl.filter(x => x.section === 'shopping').map(x => ({
      id: x.id, text: x.text, note: x.note, price: x.price, done: !!x.done, addToBudget: !!x.add_to_budget
    }));

    const reminders = parts.rem.map(r => ({
      id: r.id,
      text: r.text || '',
      note: r.note || '',
      mode: r.mode || 'absolute',
      at: r.at || null,
      anchorType: r.anchor_type || null,
      anchorId: r.anchor_id || null,
      offsetMin: (typeof r.offset_min === 'number') ? r.offset_min : null,
      dismissed: !!r.dismissed,
      dismissedAt: r.dismissed_at || null
    }));

        return {
      id: t.id,
      title: t.title || 'Без названия',
      place: t.place || '',
      start: t.start_date || '',
      end: t.end_date || '',
      notes: t.notes || '',
      currency: t.currency || 'RUB',
      rates: t.rates || {},
      me: t.me || 'Я',
      dayStart: t.day_start || '09:00',
      dayEnd: t.day_end || '21:00',
      lunchStart: t.lunch_start || '13:00',
      lunchEnd: t.lunch_end || '14:00',
      _lastSyncedAt: t.updated_at,
      activities,
      lodging,
      tickets,
      reminders,
      budget: {
        total: t.budget_total || 0,
        categories,
        expenses,
        savings
      },
            checklists: { packing, shopping }
    };
  });

  } finally {
    authLoading = false;
  }
}

/* =========================================================
   СИНХРОНИЗАЦИЯ — Двусторонняя, с офлайн-очередью
   ========================================================= */

const SYNC_QUEUE_KEY = 'berileti-sync-queue';
const SYNC_STATUS_KEY = 'berileti-sync-status';

/* Состояние синхронизации. Отображается в шапке. */
let syncState = {
  status: 'idle',   // 'idle' | 'syncing' | 'synced' | 'offline' | 'error'
  pending: 0,       // сколько операций в очереди
  lastSync: null,   // timestamp
};

function updateSyncStatus(status, extra){
  syncState.status = status;
  if(extra && typeof extra.pending === 'number') syncState.pending = extra.pending;
  if(status === 'synced') syncState.lastSync = Date.now();
  renderSyncIndicator();
}

/* Отрисовывает/обновляет индикатор синхронизации в шапке.
   Ищет #sync-indicator и обновляет содержимое. */
function renderSyncIndicator(){
  const el = document.getElementById('sync-indicator');
  if(!el) return;
  if(!currentUser){
    el.style.display = 'none';
    return;
  }
  el.style.display = '';
  const map = {
    idle:     { icon: '☁️', title: 'Всё синхронизировано' },
    syncing:  { icon: '⟳',  title: 'Синхронизация…' },
    synced:   { icon: '☁️✓', title: 'Всё синхронизировано' },
    offline:  { icon: '☁️⚠', title: `Офлайн · ${syncState.pending} в очереди` },
    error:    { icon: '☁️✕', title: 'Ошибка синхронизации' },
  };
  const s = map[syncState.status] || map.idle;
  el.textContent = s.icon;
  el.title = s.title;
  el.classList.toggle('sync-error', syncState.status === 'error');
  el.classList.toggle('sync-offline', syncState.status === 'offline');
}

/* ---------- Очередь ---------- */
function loadSyncQueue(){
  try{
    return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
  }catch(e){ return []; }
}
function saveSyncQueue(q){
  try{
    localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q));
  }catch(e){}
}
function enqueueSync(op){
  const q = loadSyncQueue();
  // Схлопываем операции: если уже есть операция по тому же tripId —
  // заменяем её (сохраняем только последнее состояние поездки).
  const idx = q.findIndex(x => x.tripId === op.tripId);
  if(idx >= 0) q[idx] = op;
  else q.push(op);
  saveSyncQueue(q);
  updateSyncStatus(navigator.onLine ? 'syncing' : 'offline', { pending: q.length });
}
function dequeueSync(tripId){
  const q = loadSyncQueue();
  const idx = q.findIndex(x => x.tripId === tripId);
  if(idx >= 0){
    q.splice(idx, 1);
    saveSyncQueue(q);
  }
  updateSyncStatus(navigator.onLine ? 'syncing' : 'offline', { pending: q.length });
}

/* ---------- Главная функция синхронизации одной поездки ---------- */
/* Вызывается после каждого изменения поездки в UI.
   Гарантирует: локально всегда сохранено; в облако — по возможности. */
/* Список tripId, которые ждут отправки. Склеиваем частые вызовы. */
const _syncPending = new Set();
let _syncTimer = null;
const SYNC_DEBOUNCE_MS = 800;

/* Вызывается сразу после каждого изменения поездки в UI.
   Локально сохраняет всегда. В облако отправляет с задержкой
   и только один раз на поездку, даже если вызвали 10 раз за секунду. */
function syncTrip(tripId){
  const trip = trips.find(t => t.id === tripId);
  if(!trip) return;

  // 1) Локально — всегда и сразу
  DB.save(trips);

  // 2) Без аккаунта — синхронизировать некуда
  if(!sb || !currentUser) return;

  // 2a) Пока идёт загрузка поездок из облака — не трогаем сеть
  if(authLoading) return;

  // 3) Помечаем как «грязный» и запускаем таймер
  _syncPending.add(tripId);

  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(flushSyncPending, SYNC_DEBOUNCE_MS);
}

/* Отправляет все накопленные tripId в облако. */
/* Отправляет все накопленные tripId в облако. */
async function flushSyncPending(){
  const ids = Array.from(_syncPending);
  _syncPending.clear();
  _syncTimer = null;
  if(!ids.length) return;

  if(!sb || !currentUser) return;
  if(authLoading) return;

  // Если офлайн — в очередь
  if(!navigator.onLine){
    for(const id of ids){
      enqueueSync({ type: 'upsert', tripId: id, ts: Date.now() });
    }
    return;
  }

  updateSyncStatus('syncing');
  let failedCount = 0;
  let conflictCount = 0;

  for(const id of ids){
    const trip = trips.find(t => t.id === id);
    if(!trip) continue;

    // Проверяем, нет ли конфликта с облаком
    let hasConflict = false;
    try{
      hasConflict = await checkTripConflict(trip);
    }catch(e){
      console.error('Ошибка проверки конфликта:', e);
    }

    if(hasConflict){
      // Спрашиваем пользователя
      const choice = await askConflictResolution(trip);
      if(choice === null){
        // Отмена — оставляем в очереди, попробуем в следующий раз
        enqueueSync({ type: 'upsert', tripId: id, ts: Date.now() });
        conflictCount++;
        continue;
      }
      if(choice === 'cloud'){
        // Взять облачную версию: не сохраняем локальную,
        // а наоборот, подтягиваем облако и заменяем локальную
        try{
          await replaceLocalTripWithCloud(id);
          dequeueSync(id);
          conflictCount++;
          continue;
        }catch(e){
          console.error('Ошибка загрузки облачной версии:', e);
          enqueueSync({ type: 'upsert', tripId: id, ts: Date.now() });
          failedCount++;
          continue;
        }
      }
      if(choice === 'both'){
        // Создаём копию локальной поездки с новым id и отправляем её в облако.
        // Облачную не трогаем. Локальную заменяем на облачную.
        try{
          const copy = JSON.parse(JSON.stringify(trip));
          copy.id = uid();
          copy.title = copy.title + ' (конфликт)';
          delete copy._lastSyncedAt;
          copy.activities.forEach(a => a.id = uid());
          copy.lodging.forEach(l => l.id = uid());
          copy.tickets.forEach(tk => {
            const oldId = tk.id;
            tk.id = uid();
            (tk.segments || []).forEach(sg => {
              sg.id = uid();
              sg.ticketId = tk.id;
            });
          });
          copy.budget.categories.forEach(c => c.id = uid());
          copy.budget.expenses.forEach(e => e.id = uid());
          copy.budget.savings.forEach(s => {
            s.id = uid();
            (s.transactions || []).forEach(tr => tr.id = uid());
          });
          copy.checklists.packing.forEach(x => x.id = uid());
          copy.checklists.shopping.forEach(x => x.id = uid());

          // Отправляем копию в облако
          await cloudSaveTrip(copy);

          // Заменяем локальную на облачную
          await replaceLocalTripWithCloud(id);

          dequeueSync(id);
          conflictCount++;
          continue;
        }catch(e){
          console.error('Ошибка создания копии:', e);
          enqueueSync({ type: 'upsert', tripId: id, ts: Date.now() });
          failedCount++;
          continue;
        }
      }
      // choice === 'local' — перезаписываем облако, как раньше
      // (просто выходим из if и идём в try cloudSaveTrip)
    }

    try{
      await cloudSaveTrip(trip);
      dequeueSync(id);
    }catch(e){
      console.error('Ошибка синхронизации поездки:', e);
      enqueueSync({ type: 'upsert', tripId: id, ts: Date.now() });
      failedCount++;
    }
  }

  if(failedCount === 0 && conflictCount === 0){
    updateSyncStatus('synced', { pending: loadSyncQueue().length });
  } else if(conflictCount > 0){
    updateSyncStatus('synced', { pending: loadSyncQueue().length });
  } else {
    updateSyncStatus('error', { pending: loadSyncQueue().length });
  }

  // Обновляем UI, если что-то поменялось
  render();
}

/* ---------- Удаление поездки из облака ---------- */
async function cloudDeleteTrip(tripId){
  if(!sb || !currentUser) return;
  // Каскадное удаление в БД сработает через on delete cascade
  const { error } = await sb.from('trips').delete().eq('id', tripId).eq('user_id', currentUser.id);
  if(error) throw error;
}

/* Вызывается при удалении поездки. Локально уже удалили. */
async function syncTripDelete(tripId){
  if(!sb || !currentUser) return;

  if(!navigator.onLine){
    enqueueSync({ type: 'delete', tripId, ts: Date.now() });
    return;
  }

  updateSyncStatus('syncing');
  try{
    await cloudDeleteTrip(tripId);
    dequeueSync(tripId);
    updateSyncStatus('synced', { pending: loadSyncQueue().length });
  }catch(e){
    console.error('Ошибка удаления поездки из облака:', e);
    enqueueSync({ type: 'delete', tripId, ts: Date.now() });
    updateSyncStatus('error', { pending: loadSyncQueue().length });
  }
}

/* ---------- Обработка очереди при появлении сети ---------- */
async function processSyncQueue(){
  if(!sb || !currentUser) return;
  if(!navigator.onLine) return;

  const q = loadSyncQueue();
  if(!q.length) return;

  updateSyncStatus('syncing');
  let failed = 0;

  for(const op of q){
    try{
      if(op.type === 'upsert'){
        const trip = trips.find(t => t.id === op.tripId);
        if(trip) await cloudSaveTrip(trip);
        else await cloudDeleteTrip(op.tripId);
      } else if(op.type === 'delete'){
        await cloudDeleteTrip(op.tripId);
      }
      dequeueSync(op.tripId);
    }catch(e){
      console.error('Ошибка синхронизации очереди:', op, e);
      failed++;
    }
  }

  const remaining = loadSyncQueue().length;
  if(remaining === 0){
    updateSyncStatus('synced');
  } else {
    updateSyncStatus('error', { pending: remaining });
  }
}

/* При появлении сети — прогоняем очередь */
window.addEventListener('online',  () => {
  updateSyncStatus('syncing');
  processSyncQueue();
});
window.addEventListener('offline', () => {
  updateSyncStatus('offline', { pending: loadSyncQueue().length });
});

/* =============== ВЛОЖЕНИЯ (IndexedDB) =============== */
const ATTACH_DB_NAME = 'berileti-attachments';
const ATTACH_STORE   = 'files';
const ATTACH_MAX_SIZE = 15 * 1024 * 1024; // 15 МБ
const ATTACH_ACCEPT   = 'application/pdf,image/*';

let _attachDB = null;
function attachDB(){
  if(_attachDB) return Promise.resolve(_attachDB);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(ATTACH_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(ATTACH_STORE)){
        db.createObjectStore(ATTACH_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => { _attachDB = req.result; resolve(_attachDB); };
    req.onerror   = () => reject(req.error);
  });
}
function attachTx(mode){
  return attachDB().then(db => db.transaction(ATTACH_STORE, mode).objectStore(ATTACH_STORE));
}
function saveAttachment(file){
  return new Promise((resolve, reject) => {
    if(!file) return reject(new Error('Нет файла'));
    if(file.size > ATTACH_MAX_SIZE) return reject(new Error('Файл больше 15 МБ'));
    const okType = file.type === 'application/pdf' || (file.type || '').startsWith('image/');
    if(!okType) return reject(new Error('Только PDF или изображения'));
    const id = 'att_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const rec = {
      id, name: file.name || 'файл',
      size: file.size, type: file.type || '',
      blob: file, createdAt: Date.now()
    };
    attachTx('readwrite').then(store => {
      const req = store.put(rec);
      req.onsuccess = () => resolve(rec);
      req.onerror   = () => reject(req.error);
    }).catch(reject);
  });
}
function getAttachment(id){
  if(!id) return Promise.resolve(null);
  return attachTx('readonly').then(store => new Promise((resolve, reject) => {
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror   = () => reject(req.error);
  })).catch(() => null);
}
function deleteAttachment(id){
  if(!id) return Promise.resolve();
  return attachTx('readwrite').then(store => new Promise((resolve) => {
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror   = () => resolve();
  })).catch(() => {});
}
function fmtBytes(n){
  if(n == null) return '';
  if(n < 1024) return n + ' Б';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' КБ';
  return (n/1024/1024).toFixed(1) + ' МБ';
}
function attachIsImage(a){ return a && (a.type || '').startsWith('image/'); }
function attachIsPdf(a){ return a && a.type === 'application/pdf'; }
function attachIcon(a){
  if(attachIsPdf(a)) return '📄';
  if(attachIsImage(a)) return '🖼️';
  return '📎';
}
async function openAttachment(id){
  const a = await getAttachment(id);
  if(!a || !a.blob){
    alert('Файл не найден в локальном хранилище.');
    return;
  }
  const url = URL.createObjectURL(a.blob);
  window.open(url, '_blank');
  // Даём браузеру минуту, чтобы успеть открыть, потом освобождаем
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function openAttachmentSmart(kind, entityId, attachmentId){
  const a = attachmentId ? await getAttachment(attachmentId) : null;

    const url = URL.createObjectURL(a.blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);

  }
  // Файла нет — предлагаем прикрепить
  const label = kind === 'lodging' ? 'жилья' : 'билета';
  if(confirm(`Файл не найден на этом устройстве.\nОткрыть карточку ${label}, чтобы прикрепить заново?`)){
    if(kind === 'lodging') openLodgingModal(entityId);
    else openTicketModal(entityId);
  }
}

const CURRENCY_SYMBOLS = {
  RUB:'₽', USD:'$', EUR:'€', GEL:'₾', TRY:'₺',
  THB:'฿', JPY:'¥', CNY:'¥', GBP:'£', KZT:'₸',
  UAH:'₴', AMD:'֏', AED:'د.إ', INR:'₹', VND:'₫', KRW:'₩'
};
const DEFAULT_RATES = { USD:100, EUR:105, GEL:37, TRY:3, THB:2.8, KRW:0.07 };
const RATE_DISPLAY_MULT = { KRW:1000, JPY:100, VND:1000 };
function rateDisplayUnit(code){ return RATE_DISPLAY_MULT[code] || 1; }
function curSym(code){ return CURRENCY_SYMBOLS[code] || code; }
function fmtMoney(amount, code){
  if(amount == null || isNaN(amount)) return '—';
  const rounded = Math.round(amount*100)/100;
  const str = rounded.toLocaleString('ru-RU', {maximumFractionDigits:2});
  return `${str} ${curSym(code)}`;
}
function toRUB(amount, fromCur, trip){
  if(fromCur === 'RUB') return amount;
  const rate = (trip.rates && trip.rates[fromCur]) || DEFAULT_RATES[fromCur] || 1;
  return amount * rate;
}
function moneyTriple(amountRUB, trip){
  const usdRate = (trip.rates && trip.rates.USD) || DEFAULT_RATES.USD;
  const usd = usdRate ? amountRUB / usdRate : 0;
  const out = [fmtMoney(amountRUB, 'RUB'), fmtMoney(usd, 'USD')];
  if(trip.currency && trip.currency !== 'RUB' && trip.currency !== 'USD'){
    const r = (trip.rates && trip.rates[trip.currency]) || DEFAULT_RATES[trip.currency] || 1;
    out.push(fmtMoney(r ? amountRUB / r : 0, trip.currency));
  }
  return out.join(' · ');
}

const HistoryMgr = {
  // Стек того, «куда мы хотим попасть» при popstate.
  // Мы не полагаемся на event.state целиком, а держим свою модель экранов —
  // это надёжнее при переходах вида «модалка поверх модалки».
  stack: [{ view: 'list' }],
  suppressPush: false,

  current(){
    return this.stack[this.stack.length - 1] || { view: 'list' };
  },

  push(entry){
    if(this.suppressPush) return;
    this.stack.push(entry);
    history.pushState({ idx: this.stack.length - 1 }, '');
  },

  // Заменяем верхушку стека (например, при переключении вкладок)
  replace(entry){
    if(this.stack.length <= 1){
      this.stack = [entry];
      history.replaceState({ idx: 0 }, '');
      return;
    }
    this.stack[this.stack.length - 1] = entry;
    // В history тоже оставляем ту же запись, ничего не пушим
  },

  // Убрать верхушку, когда мы её закрыли сами (клик по overlay, кнопка Готово)
  popSilently(){
    if(this.stack.length <= 1) return false;
    this.stack.pop();
    history.back(); // popstate выстрелит, но мы его проигнорируем через флаг
    this._ignoreNext = true;
    return true;
  },

  _ignoreNext: false,

  handleBack(){
    if(this._ignoreNext){
      this._ignoreNext = false;
      return;
    }
    if(this.stack.length <= 1){
      // Мы уже в корне — отдаём управление системе (закроет приложение)
      return false;
    }
    this.stack.pop();
    this.apply(this.current());
    return true;
  },

  apply(entry){
    // Закрываем модалки, если по стеку мы не в модалке
    if(!entry.modal && document.getElementById('modal').classList.contains('show')){
      closeModalFromHistory();
    }
    // Переключаем экран
    if(entry.view === 'list'){
      state.view = 'list';
      render();
    } else if(entry.view === 'trip'){
      state.view = 'trip';
      state.tripId = entry.tripId;
      state.tripTab = entry.tab || 'plan';
      render();
    } else if(entry.view === 'new'){
      state.view = 'new';
      render();
    } else if(entry.view === 'editTrip'){
      state.view = 'editTrip';
      state.tripId = entry.tripId;
      render();
    }
    // Если в стеке была модалка — её уже закрыли выше через closeModalFromHistory
  }
};

window.addEventListener('popstate', () => {
  HistoryMgr.handleBack();
});

/* Парсер координат. Поддерживает:
   - "41.69, 44.80" / "41.69 44.80" / "41.69;44.80"
   - "41.69°N, 44.80°E" / "41.69 N 44.80 E"
   - DMS: 41°41'24.0"N 44°48'00.0"E
   - ссылки Google: .../@41.69,44.80,17z/...
   - ссылки Яндекс: ...?pt=44.80,41.69&z=17
   - geo:41.69,44.80
   - любой текст с координатами внутри */
function parseCoords(s){
  if(!s || typeof s !== 'string') return {lat:null, lng:null};
  const text = s.trim();

  // 1) Ссылка Яндекс.Карт: pt=<lng>,<lat>
  //    (у Яндекса порядок: долгота, широта)
  let m = text.match(/[?&]pt=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if(m){
    const lng = parseFloat(m[1]), lat = parseFloat(m[2]);
    if(!isNaN(lat) && !isNaN(lng)) return {lat, lng};
  }

  // 2) Ссылка Google Maps: /@<lat>,<lng>,<zoom>
  m = text.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)(?:,|z|\/|$)/);
  if(m){
    const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    if(!isNaN(lat) && !isNaN(lng)) return {lat, lng};
  }

  // 3) geo: URI
  m = text.match(/^geo:(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/i);
  if(m){
    const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    if(!isNaN(lat) && !isNaN(lng)) return {lat, lng};
  }

  // 4) DMS: 41°41'24.0"N 44°48'00.0"E
  //    или упрощённо 41°41'24"N 44°48'E
  const dmsRe = /(\d{1,3})\s*[°º]\s*(\d{1,2})?\s*['′]?\s*(\d{1,2}(?:\.\d+)?)?\s*["″]?\s*([NnSs])\s*[, ]?\s*(\d{1,3})\s*[°º]\s*(\d{1,2})?\s*['′]?\s*(\d{1,2}(?:\.\d+)?)?\s*["″]?\s*([EeWw])/;
  m = text.match(dmsRe);
  if(m){
    const latDeg = parseFloat(m[1]) + (parseFloat(m[2])||0)/60 + (parseFloat(m[3])||0)/3600;
    const lngDeg = parseFloat(m[5]) + (parseFloat(m[6])||0)/60 + (parseFloat(m[7])||0)/3600;
    const lat = /[Ss]/.test(m[4]) ? -latDeg : latDeg;
    const lng = /[Ww]/.test(m[8]) ? -lngDeg : lngDeg;
    if(!isNaN(lat) && !isNaN(lng)) return {lat, lng};
  }

  // 5) Обычные десятичные координаты с опциональными N/S/E/W:
  //    "41.69, 44.80" / "41.69°N 44.80°E" / "N 41.69 E 44.80"
  m = text.match(/(-?\d+(?:\.\d+)?)\s*[°º]?\s*([NnSs])?\s*[,; ]\s*(-?\d+(?:\.\d+)?)\s*[°º]?\s*([EeWw])?/);
  if(m){
    let lat = parseFloat(m[1]);
    let lng = parseFloat(m[3]);
    if(m[2] && /[Ss]/.test(m[2])) lat = -Math.abs(lat);
    if(m[4] && /[Ww]/.test(m[4])) lng = -Math.abs(lng);
    if(!isNaN(lat) && !isNaN(lng)) return {lat, lng};
  }

  return {lat:null, lng:null};
}
function daysUntil(dateStr){
  if(!dateStr) return Infinity;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}

function migrateTicket(t){
  if(Array.isArray(t.segments)){
    if(t.toPlan === undefined) t.toPlan = false;
    return t;
  }
  return {
    id: t.id || uid(),
    type: t.type || 'plane',
    ticketNumber: t.ticketNumber || t.number || '',
    carrier: t.carrier || '',
    price: Number(t.price) || 0,
    link: t.link || '',
    notes: t.notes || '',
    toPlan: t.toPlan || false,
    segments: [{
      id: uid(),
      from: t.from || '', to: t.to || '',
      departDate: t.departDate || '', departTime: t.departTime || '',
      arriveDate: t.arriveDate || '', arriveTime: t.arriveTime || '',
      carrier: t.carrier || '', number: t.number || '', seat: t.seat || ''
    }]
  };
}

function ensureTrip(t){
  if(!t.budget){
    t.budget = {
      total: 0,
      categories: DEFAULT_CATEGORIES.map(c => ({ id: uid(), name: c.name, planned: 0, color: c.color })),
      expenses: [],
      savings: []
    };
  }
  if(!Array.isArray(t.lodging)) t.lodging = [];
  if(!Array.isArray(t.tickets)) t.tickets = [];
    if(!Array.isArray(t.reminders)) t.reminders = [];
  t.tickets = t.tickets.map(migrateTicket);
  if(!t.checklists || typeof t.checklists !== 'object') t.checklists = { packing: [], shopping: [] };
  if(!Array.isArray(t.checklists.packing)) t.checklists.packing = [];
  if(!Array.isArray(t.checklists.shopping)) t.checklists.shopping = [];
  if(!t.currency) t.currency = 'RUB';
  if(!t.rates) t.rates = { ...DEFAULT_RATES };
  if(!t.me) t.me = 'Я';
  if(!t.dayStart) t.dayStart = '09:00';
  if(!t.dayEnd) t.dayEnd = '21:00';
  if(t.lunchStart === undefined) t.lunchStart = '13:00';
  if(t.lunchEnd === undefined) t.lunchEnd = '14:00';
        if(Array.isArray(t.activities)){
    t.activities.forEach(a => {
      if(typeof a.duration !== 'number') a.duration = 60;
      if(!a.type) a.type = 'other';
      if(a.openFrom === undefined) a.openFrom = '';
      if(a.openTo === undefined) a.openTo = '';
      if(typeof a.price !== 'number' || isNaN(a.price)) a.price = 0;
      if(a.addToExpense === undefined) a.addToExpense = false;
      if(a.linkedTicketId === undefined) a.linkedTicketId = null;
      if(a.linkedTicketRole === undefined) a.linkedTicketRole = null;
      if(a.lockedByTicket === undefined) a.lockedByTicket = false;
      if(a.linkedTicketSegmentIdx === undefined) a.linkedTicketSegmentIdx = null;
    });
  }
  if(t.budget && Array.isArray(t.budget.expenses)){
    t.budget.expenses.forEach(e => {
      if(!e.paidBy) e.paidBy = t.me || 'Я';
      if(typeof e.splitWith !== 'number' || e.splitWith < 1) e.splitWith = 1;
    });
  }
  return t;
}

function tripStatus(t){
  const today = todayISO();
  const end = t.end || t.start;
  if(!t.start && !t.end) return { kind:'undated' };
  if(end && end < today) return { kind:'past' };
  if(t.start && t.start > today){
    const d = daysUntil(t.start);
    if(d <= 30) return { kind:'soon', days:d };
    return { kind:'future' };
  }
  return { kind:'active' };
}
function getVisibleTrips(){
  const q = state.query.trim().toLowerCase();
  let list = trips.slice();
  if(q){
    list = list.filter(t =>
      (t.title||'').toLowerCase().includes(q) ||
      (t.place||'').toLowerCase().includes(q)
    );
  }
  if(state.filter === 'active'){
    list = list.filter(t => {
      const s = tripStatus(t).kind;
      return s === 'active' || s === 'soon' || s === 'future' || s === 'undated';
    });
  } else if(state.filter === 'past'){
    list = list.filter(t => tripStatus(t).kind === 'past');
  }
  return list;
}

const MONTHS_RU = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function monthKeyOf(t){
  const d = t.start || t.end;
  if(!d) return { key:'undated', label:'Без даты', order:Infinity };
  const dt = new Date(d + 'T00:00:00');
  const y = dt.getFullYear(); const m = dt.getMonth();
  const key = `${y}-${String(m+1).padStart(2,'0')}`;
  const label = `${MONTHS_RU[m][0].toUpperCase()}${MONTHS_RU[m].slice(1)} ${y}`;
  return { key, label, order: y*12 + m };
}
function groupTrips(list){
  const map = new Map();
  const now = new Date(); now.setHours(0,0,0,0);
  const currentOrder = now.getFullYear()*12 + now.getMonth();
  list.forEach(t => {
    const mk = monthKeyOf(t);
    if(!map.has(mk.key)){
      map.set(mk.key, { key: mk.key, label: mk.label, order: mk.order, trips: [], past: mk.order !== Infinity && mk.order < currentOrder });
    }
    map.get(mk.key).trips.push(t);
  });
  map.forEach(g => {
    g.trips.sort((a,b)=>{
      const da = a.start || a.end || '9999-99-99';
      const db = b.start || b.end || '9999-99-99';
      return da.localeCompare(db);
    });
  });
  const groups = Array.from(map.values());
  const future = groups.filter(g => g.order !== Infinity && g.order >= currentOrder).sort((a,b)=> a.order - b.order);
  const past   = groups.filter(g => g.order !== Infinity && g.order <  currentOrder).sort((a,b)=> b.order - a.order);
  const undated = groups.filter(g => g.order === Infinity);
  return [...future, ...past, ...undated];
}
function toggleGroup(key){
  if(state.collapsed[key]) delete state.collapsed[key];
  else state.collapsed[key] = true;
  render();
}

function calcBudget(t){
  ensureTrip(t);
  const b = t.budget;
  const total = b.total || 0;

  const shoppingInBudget = (t.checklists && t.checklists.shopping || [])
    .filter(x => x.addToBudget && !x.done)
    .reduce((a, x) => a + (Number(x.price) || 0), 0);

  let plannedRUB = 0;
  const byCat = {};
  b.categories.forEach(c => {
    byCat[c.id] = { cat:c, planned: c.planned||0, fact:0, shopping:0 };
    plannedRUB += (c.planned||0);
  });
  const shoppingCat = b.categories.find(c => c.name.toLowerCase() === 'шоппинг');
  if(shoppingCat && byCat[shoppingCat.id]){
    byCat[shoppingCat.id].shopping = shoppingInBudget;
    byCat[shoppingCat.id].planned += shoppingInBudget;
    plannedRUB += shoppingInBudget;
  }

  let factRUB = 0;
  b.expenses.forEach(e => {
    const sum = e.priceInRUB ? (e.amount||0) : toRUB(e.amount||0, t.currency, t);
    factRUB += sum;
    if(byCat[e.categoryId]) byCat[e.categoryId].fact += sum;
  });

  const left = total - factRUB;
  const percent = total ? Math.min(100, Math.round(factRUB / total * 100)) : 0;
  let barClass = '';
  if(percent >= 100) barClass = 'danger';
  else if(percent >= 80) barClass = 'warn';

  const savings = b.savings.map(s => {
    const saved = (s.transactions||[]).reduce((acc, tr)=> acc + (tr.amount||0), 0);
    const target = s.target||0;
    const pct = target ? Math.min(100, Math.round(saved/target*100)) : 0;
    return { ...s, saved, pct };
  });
  const totalSaved = savings.reduce((a,s)=> a + s.saved, 0);

  return { total, plannedRUB, factRUB, left, percent, barClass, byCat: Object.values(byCat), savings, totalSaved, shoppingInBudget };
}

function calcSplits(t){
  ensureTrip(t);
  const me = t.me || 'Я';
  const expenses = (t.budget && t.budget.expenses) || [];
  const rubOf = e => e.priceInRUB ? (e.amount||0) : toRUB(e.amount||0, t.currency, t);
  let myPaid = 0;
  let myShare = 0;
  const others = {};
  expenses.forEach(e => {
    const rub = rubOf(e);
    const n = Math.max(1, parseInt(e.splitWith, 10) || 1);
    const share = rub / n;
    const paidBy = e.paidBy || me;
    if(paidBy === me){
      myPaid += rub;
      if(n > 1){
        const perOther = (rub - share) / (n - 1);
        for(let i=1; i<n; i++){
          const name = `Участник ${i}`;
          others[name] = others[name] || { name, paid:0, owesMe:0, iOwe:0 };
          others[name].owesMe += perOther;
        }
      }
    } else {
      const name = paidBy;
      others[name] = others[name] || { name, paid:0, owesMe:0, iOwe:0 };
      others[name].paid += rub;
      myShare += share;
      others[name].iOwe += share;
    }
  });
  const balance = myPaid - myShare;
  return { me, myPaid, myShare, balance, others: Object.values(others).sort((a,b)=> (b.owesMe - b.iOwe) - (a.owesMe - a.iOwe)) };
}

function calcByDays(t){
  ensureTrip(t);
  const days = daysBetween(t.start, t.end);
  if(!days.length) return { days: [], totalPlan: 0, totalFact: 0, prepaidTotal: 0, diff: 0 };
  const total = t.budget.total || 0;
  const planPerDay = days.length ? total / days.length : 0;
  const rubOf = e => e.priceInRUB ? (e.amount||0) : toRUB(e.amount||0, t.currency, t);
  const expenses = t.budget.expenses || [];
  const prepaidTotal = expenses.filter(e => e.isPrepaid).reduce((a, e) => a + rubOf(e), 0);
  const dailyExpenses = expenses.filter(e => !e.isPrepaid);
  const rows = days.map(d => {
    const fact = dailyExpenses.filter(e => (e.date || '') === d).reduce((a, e) => a + rubOf(e), 0);
    return { date:d, plan:planPerDay, fact, diff:planPerDay - fact, isToday: d === todayISO() };
  });
  const totalPlan = planPerDay * days.length;
  const totalFact = rows.reduce((a,r)=> a + r.fact, 0);
  return { days: rows, totalPlan, totalFact, diff: totalPlan - totalFact, prepaidTotal };
}

async function getWeatherForTrip(trip){
  let lat = trip.weatherLat, lng = trip.weatherLng;
  if(lat == null || lng == null){
    if(!trip.place) return null;
    const geoKey = 'geo_' + trip.id;
    try{
      const cached = JSON.parse(localStorage.getItem(geoKey) || 'null');
      if(cached && cached.place === trip.place && Date.now() - cached.ts < 86400000){
        lat = cached.lat; lng = cached.lng;
      } else {
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ru&q=${encodeURIComponent(trip.place)}`;
        const res = await fetch(url, { headers: { 'Accept':'application/json' } });
        if(!res.ok) return null;
        const data = await res.json();
        if(!data.length) return null;
        lat = parseFloat(data[0].lat);
        lng = parseFloat(data[0].lon);
        localStorage.setItem(geoKey, JSON.stringify({ place: trip.place, lat, lng, ts: Date.now() }));
      }
      trip.weatherLat = lat;
      trip.weatherLng = lng;
    }catch(e){ console.error('Ошибка геокодинга:', e); return null; }
  }
  const cacheKey = weatherCacheKey(trip.id);
  try{
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if(cached && cached.lat === lat && cached.lng === lng && Date.now() - cached.fetchedAt < 86400000){
      return cached.byDate;
    }
  }catch(e){}
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=16`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    if(!data.daily || !data.daily.time) return null;
    const byDate = {};
    data.daily.time.forEach((d, i) => {
      byDate[d] = { code: data.daily.weather_code[i], tmax: Math.round(data.daily.temperature_2m_max[i]), tmin: Math.round(data.daily.temperature_2m_min[i]) };
    });
    localStorage.setItem(cacheKey, JSON.stringify({ lat, lng, fetchedAt: Date.now(), byDate }));
    return byDate;
  }catch(e){ console.error('Ошибка загрузки погоды:', e); return null; }
}
function weatherLineHtml(dateStr, weather){
  const today = todayISO();
  if(dateStr < today) return '';
  if(!weather){
    const diff = daysUntil(dateStr);
    if(diff > 16) return `<div class="weather-line">🌤️ <span class="desc">прогноз появится позже</span></div>`;
    return '';
  }
  const w = weather[dateStr];
  if(!w){
    const diff = daysUntil(dateStr);
    if(diff > 16) return `<div class="weather-line">🌤️ <span class="desc">прогноз появится позже</span></div>`;
    return '';
  }
  const emoji = WEATHER_EMOJI[w.code] || '🌤️';
  const desc = WEATHER_DESC[w.code] || '';
  return `<div class="weather-line"><span class="emoji">${emoji}</span><span class="temp">+${w.tmax}° / +${w.tmin}°</span><span class="desc">${desc}</span></div>`;
}

function timeToMin(t){
  if(!t) return null;
  const [h, m] = t.split(':').map(x => parseInt(x, 10));
  if(isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}
function minToTime(min){
  min = Math.max(0, Math.min(24*60, Math.round(min)));
  const h = Math.floor(min / 60); const m = min % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

function runAutoDistribute(){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const startStr = document.getElementById('ad-start').value || '09:00';
  const endStr = document.getElementById('ad-end').value || '21:00';
  const lunchOn = document.getElementById('ad-lunch-on').checked;
  const lunchStartStr = lunchOn ? (document.getElementById('ad-lunch-start').value || '') : '';
  const lunchEndStr = lunchOn ? (document.getElementById('ad-lunch-end').value || '') : '';
    const saveDefaults = document.getElementById('ad-save-defaults').checked;
  const evenMode = document.getElementById('ad-even').checked;
  const considerTickets = document.getElementById('ad-tickets').checked;
  const mode = document.getElementById('ad-mode').value;

  const dayStart = timeToMin(startStr);
  const dayEnd = timeToMin(endStr);
  if(dayStart == null || dayEnd == null || dayEnd <= dayStart){ alert('Проверь часы дня.'); return; }
  const lunchStart = timeToMin(lunchStartStr);
  const lunchEnd = timeToMin(lunchEndStr);
  if(lunchOn && lunchStart != null && lunchEnd != null && lunchEnd <= lunchStart){ alert('Проверь обед.'); return; }

  if(saveDefaults){
    trip.dayStart = startStr; trip.dayEnd = endStr;
    trip.lunchStart = lunchOn ? (lunchStartStr || '') : '';
    trip.lunchEnd = lunchOn ? (lunchEndStr || '') : '';
  }

  const days = daysBetween(trip.start, trip.end);
  if(!days.length){ alert('Нет дней.'); return; }

    // Места-билеты не трогаем: у них своя логика привязки к билету,
  // и их нельзя ни сбрасывать, ни перераспределять.
  const isTicketActivity = a => !!a.linkedTicketId;

  let pool;
  if(mode === 'reset'){
    // Сбрасываем только обычные места, не трогая места-билеты
    trip.activities.forEach(a => {
      if(isTicketActivity(a)) return;
      a.date = '';
      a.time = '';
    });
    pool = trip.activities.filter(a => !isTicketActivity(a));
  } else {
    pool = trip.activities.filter(a => !isTicketActivity(a) && !a.date);
  }
  if(!pool.length){ alert('Нет мест для распределения.'); return; }

    const booked = {};
  days.forEach(d => { booked[d] = []; });
  trip.activities.forEach(a => {
    if(a.date && days.includes(a.date)) booked[a.date].push(a);
  });

  function lodgingForDay(d){
    return (trip.lodging||[]).find(l => {
      const from = l.checkInDate || l.checkOutDate || '';
      const to = l.checkOutDate || l.checkInDate || '';
      if(!from) return false;
      return d >= from && d <= to;
    }) || null;
  }

  /* Собирает занятые временные окна на день, порождённые билетами.
   Возвращает массив [startMin, endMin, reason].
   - прилёт: [0, arriveTime + 60] — час на выезд из аэропорта/вокзала
   - вылет:  [departTime - 120, 24*60] — 2 часа до отправления + дорога
   Учитываются только сегменты с указанным временем. */
function ticketWindowsForDay(trip, day){
  const out = [];
  const ARRIVE_BUFFER = 60;   // минут после прилёта
  const DEPART_BUFFER = 120;  // минут до вылета
  (trip.tickets || []).forEach(tk => {
    (tk.segments || []).forEach(sg => {
      // Прилёт в этот день
      if(sg.arriveDate === day && sg.arriveTime){
        const arr = timeToMin(sg.arriveTime);
        if(arr != null){
          out.push([0, arr + ARRIVE_BUFFER, `прилёт в ${sg.arriveTime}`]);
        }
      }
      // Вылет в этот день
      if(sg.departDate === day && sg.departTime){
        const dep = timeToMin(sg.departTime);
        if(dep != null){
          out.push([Math.max(0, dep - DEPART_BUFFER), 24*60, `вылет в ${sg.departTime}`]);
        }
      }
    });
  });
  return out;
}

  const sortedPool = pool.slice().sort((a, b) => {
    const da = Number(a.duration) || 60;
    const db = Number(b.duration) || 60;
    if(db !== da) return db - da;
    const oa = (a.openFrom && a.openTo) ? 1 : 0;
    const ob = (b.openFrom && b.openTo) ? 1 : 0;
    return ob - oa;
  });

  const placed = [];
  const failed = [];

    function buildFreeWindows(day){
    const busy = [];
    booked[day].forEach(a => {
      const t = timeToMin(a.time);
      if(t == null) return;
      const dur = Number(a.duration) || 60;
      busy.push([t, t + dur]);
    });
    busy.sort((a,b)=> a[0] - b[0]);

    const windows = [];
    let cur = dayStart;

    const lunchBlock = (lunchOn && lunchStart != null && lunchEnd != null) ? [[lunchStart, lunchEnd]] : [];

    // Билеты — учитываем прилёт и вылет этого дня
    const ticketBlocks = considerTickets
      ? ticketWindowsForDay(trip, day).map(w => [w[0], w[1]])
      : [];

    const allBlocks = [...busy, ...lunchBlock, ...ticketBlocks].sort((a,b)=> a[0] - b[0]);
    allBlocks.forEach(([bs, be]) => {
      if(bs > cur && bs <= dayEnd) windows.push([cur, bs]);
      if(be > cur) cur = be;
    });
    if(cur < dayEnd) windows.push([cur, dayEnd]);
    return windows.filter(w => w[1] - w[0] >= 15);
  }
  function distance(a1, b1, a2, b2){
    if(a1==null||b1==null||a2==null||b2==null) return 0;
    const R = 6371, toRad = x => x * Math.PI / 180;
    const dLat = toRad(a2 - a1), dLon = toRad(b2 - b1);
    const A = Math.sin(dLat/2)**2 + Math.cos(toRad(a1))*Math.cos(toRad(a2))*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(A));
  }
  function fitsInWindow(item, ws, we){
    const dur = Number(item.duration) || 60;
    const openFrom = timeToMin(item.openFrom);
    const openTo = timeToMin(item.openTo);
    let start = ws;
    if(openFrom != null && start < openFrom) start = openFrom;
    const end = start + dur;
    if(end > we) return null;
    if(openTo != null && end > openTo) return null;
    return { start, end };
  }

  const remaining = sortedPool.slice();

  // Равномерное распределение — по КОЛИЧЕСТВУ мест в день
  let targetPerDayCount = Infinity;
  if(evenMode){
    targetPerDayCount = Math.max(1, Math.ceil(sortedPool.length / days.length));
  }

  days.forEach(day => {
    const windows = buildFreeWindows(day);
    if(!windows.length) return;
    const lodge = lodgingForDay(day);
    let currentLat = lodge ? lodge.lat : null;
    let currentLng = lodge ? lodge.lng : null;
    let dayUsedCount = 0;
    let guard = 0;
    while(remaining.length && guard < 200){
      guard++;
      let placedThis = false;
      for(let wi = 0; wi < windows.length; wi++){
        const [ws, we] = windows[wi];
        if(we - ws < 15) continue;
        let best = null, bestIdx = -1, bestStart = null, bestScore = Infinity;
        for(let i = 0; i < remaining.length; i++){
          const item = remaining[i];
          const fit = fitsInWindow(item, ws, we);
          if(!fit) continue;
          if(evenMode && dayUsedCount >= targetPerDayCount) continue;
          let score = 0;
          if(currentLat != null && currentLng != null && item.lat != null && item.lng != null){
            score = distance(currentLat, currentLng, item.lat, item.lng);
          }
          if(score < bestScore){
            bestScore = score; best = item; bestIdx = i; bestStart = fit.start;
          }
        }
        if(best){
          const dur = Number(best.duration) || 60;
          best.date = day;
          best.time = minToTime(bestStart);
          placed.push(best);
          remaining.splice(bestIdx, 1);
          dayUsedCount += 1;
          windows[wi] = [bestStart + dur, we];
          if(best.lat != null && best.lng != null){ currentLat = best.lat; currentLng = best.lng; }
          placedThis = true;
          break;
        }
      }
      if(!placedThis) break;
    }
  });

    // Собираем для каждого дня окна, порождённые билетами,
  // чтобы потом точнее объяснить, почему место не поместилось
  const ticketBlockersByDay = {};
  if(considerTickets){
    days.forEach(d => {
      const tw = ticketWindowsForDay(trip, d);
      if(tw.length) ticketBlockersByDay[d] = tw;
    });
  }

  remaining.forEach(item => {
    const dur = Number(item.duration) || 60;
    const openFrom = timeToMin(item.openFrom);
    const openTo = timeToMin(item.openTo);
    let reason = 'не влезло по времени';

    if(openFrom != null && openTo != null){
      if(openTo - openFrom < dur) reason = 'окно работы меньше длительности';
      else if(openTo <= dayStart || openFrom >= dayEnd) reason = 'не попадает в часы дня';
    }

    // Проверим, может быть конфликт с билетом
    if(reason === 'не влезло по времени' && considerTickets){
      // Ищем день, где прилёт/вылет съедает всё окно
      const dayStartStr = startStr; // исходная строка
      for(const d of days){
        const blockers = ticketBlockersByDay[d];
        if(!blockers) continue;
        for(const [bs, be, why] of blockers){
          // Если весь день свободен только вне блокера
          const freeBefore = Math.max(0, bs - dayStart);
          const freeAfter  = Math.max(0, dayEnd - be);
          const maxFree = Math.max(freeBefore, freeAfter);
          if(maxFree < dur){
            reason = `конфликт с билетом (${why})`;
            break;
          }
        }
        if(reason.startsWith('конфликт')) break;
      }
    }

    failed.push({ item, reason });
  });

      trip._autoFailed = failed.map(f => ({ id: f.item.id, reason: f.reason }));

  // Синхронизируем все места-билеты по их билетам:
  (trip.tickets || []).forEach(tk => {
    if(tk.toPlan) syncTicketActivities(trip, tk.id);
  });

  closeModal();
  render();
  syncTrip(trip.id);
  setTimeout(()=> alert(`Распределено: ${placed.length}. Не поместилось: ${failed.length}.`), 80);
}

/* =============== СВАЙП =============== */
function attachSwipe(el){
  let startX=0, startY=0, dx=0, dragging=false, decided=false, isHorizontal=false;
  const MAX = 90, THRESHOLD = 45;
  el.addEventListener('pointerdown', e=>{
    if(e.target.closest('a,button')) return;
    startX = e.clientX; startY = e.clientY;
    dx = 0; dragging = true; decided = false; isHorizontal = false;
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const mx = e.clientX - startX;
    const my = e.clientY - startY;
    if(!decided){
      if(Math.abs(mx) > 6 || Math.abs(my) > 6){
        decided = true;
        isHorizontal = Math.abs(mx) > Math.abs(my);
        if(!isHorizontal){ dragging = false; el.classList.remove('dragging'); }
      }
    }
    if(isHorizontal){
      dx = Math.max(-MAX, Math.min(0, mx));
      el.style.transform = `translateX(${dx}px)`;
      if(Math.abs(mx) > 4) e.preventDefault();
    }
  });
  const finish = ()=>{
    if(!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    if(dx < -THRESHOLD){
      el.style.transform = `translateX(-${MAX}px)`;
      el.dataset.open = '1';
    } else {
      el.style.transform = 'translateX(0)';
      el.dataset.open = '';
    }
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', finish);
  el.addEventListener('pointerleave', finish);
  el.addEventListener('click', e=>{
    if(el.dataset.open === '1'){
      e.preventDefault(); e.stopPropagation();
      el.style.transform = 'translateX(0)';
      el.dataset.open = '';
    }
  }, true);
}

/* =========================================================
   ГЕОКОДИНГ БИЛЕТОВ
   =========================================================
   Точки from/to геокодируются через Nominatim и кэшируются
   в trip._ticketGeoCache. Чтобы не нарушать лимит 1 запрос/сек,
   делаем последовательную очередь с задержкой 1100 мс.
*/
function ticketGeoCacheKey(tripId){ return 'ticketGeo_' + tripId; }

function loadTicketGeoCache(trip){
  if(trip._ticketGeoCache) return trip._ticketGeoCache;
  try{
    const raw = localStorage.getItem(ticketGeoCacheKey(trip.id));
    trip._ticketGeoCache = raw ? JSON.parse(raw) : {};
  }catch(e){
    trip._ticketGeoCache = {};
  }
  return trip._ticketGeoCache;
}

function saveTicketGeoCache(trip){
  try{
    localStorage.setItem(ticketGeoCacheKey(trip.id), JSON.stringify(trip._ticketGeoCache || {}));
  }catch(e){}
}

/* Синхронизирует «места-билеты» в плане с состоянием билета.
   Каждый сегмент даёт ДВА места: вылет и прилёт.
   Это корректно работает и для перелётов с пересадками
   (несколько сегментов в одном билете), и для билетов,
   где сразу и «туда», и «обратно».
   Удаление/обновление — строго по linkedTicketId. */
function syncTicketActivities(trip, ticketId){
  const ticket = trip.tickets.find(t => t.id === ticketId);
  if(!ticket){ return; }

  // Сначала убираем все места, привязанные к этому билету
  trip.activities = (trip.activities || []).filter(a => a.linkedTicketId !== ticketId);

  if(!ticket.toPlan) return;

  const segs = ticket.segments || [];
  if(!segs.length) return;

  segs.forEach((sg, segIdx) => {
    const from = sg.from || '—';
    const to   = sg.to   || '—';
    const route = `${from} → ${to}`;
    const segNote = ticket.carrier ? `Перевозчик: ${ticket.carrier}` : '';
    const segNumber = sg.number ? `Рейс: ${sg.number}` : '';
    const notes = [segNote, segNumber].filter(Boolean).join(' · ');

    // Место «Вылет» — по этому сегменту
    if(sg.departDate){
      trip.activities.push({
        id: uid(),
        title: `✈️ ${route} · вылет`,
        date: sg.departDate,
        time: sg.departTime || '',
        notes: notes,
        lat: (typeof sg.fromLat === 'number') ? sg.fromLat : null,
        lng: (typeof sg.fromLng === 'number') ? sg.fromLng : null,
        type: 'other',
        duration: 180, // 3 ч: 2 ч регистрация + 1 ч запас
        openFrom: '',
        openTo: '',
        price: 0,
        addToExpense: false,
        checklist: [],
        linkedTicketId: ticketId,
        linkedTicketRole: 'depart',
        linkedTicketSegmentIdx: segIdx,
        lockedByTicket: true
      });
    }

    // Место «Прилёт» — по этому сегменту
    if(sg.arriveDate){
      trip.activities.push({
        id: uid(),
        title: `✈️ ${route} · прилёт`,
        date: sg.arriveDate,
        time: sg.arriveTime || '',
        notes: notes,
        lat: (typeof sg.toLat === 'number') ? sg.toLat : null,
        lng: (typeof sg.toLng === 'number') ? sg.toLng : null,
        type: 'other',
        duration: 60, // час на выезд из аэропорта/вокзала
        openFrom: '',
        openTo: '',
        price: 0,
        addToExpense: false,
        checklist: [],
        linkedTicketId: ticketId,
        linkedTicketRole: 'arrive',
        linkedTicketSegmentIdx: segIdx,
        lockedByTicket: true
      });
    }
  });
}
/* Собираем все уникальные точки из билетов */
function collectTicketPoints(trip){
  const set = new Set();
  (trip.tickets||[]).forEach(tk => {
    (tk.segments||[]).forEach(sg => {
      if(sg.from) set.add(sg.from.trim());
      if(sg.to) set.add(sg.to.trim());
    });
  });
  return Array.from(set).filter(Boolean);
}

/* Асинхронный геокодинг. callback вызывается, если что-то догрузилось. */
async function geocodeTicketPoints(trip, callback){
  const cache = loadTicketGeoCache(trip);
  const all = collectTicketPoints(trip);
  const missing = all.filter(name => !cache[name]);

  if(!missing.length){
    // Нечего догружать — НЕ вызываем callback, иначе карта перерисуется зря
    return;
  }

  let changed = false;

  for(const name of missing){
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ru&q=${encodeURIComponent(name)}`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if(data.length){
        cache[name] = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
        changed = true;
      } else {
        // Помечаем как «не найдено», чтобы не дёргать снова
        cache[name] = null;
      }
    }catch(e){
      console.warn('Геокодинг не удался:', name, e);
      // Не помечаем как null — попробуем в следующий раз
    }
    // Лимит Nominatim: 1 запрос в секунду
    await new Promise(r => setTimeout(r, 1100));
  }

  if(changed){
    trip._ticketGeoCache = cache;
    saveTicketGeoCache(trip);
    if(callback) callback();
  }
}

    </div>`;

  let tries = 0;

/* Прокрутка тулбара маршрута (кнопки ‹ ›) */
function scrollRouteToolbar(delta){

/* Обновление видимости стрелок и градиентных масок
   в зависимости от позиции скролла. Вызывается после рендера
   карты и по событию scroll/resize. */
function updateRouteToolbarState(){
  const wrap = document.querySelector('.map-toolbar-wrap');
  const el = document.getElementById('route-toolbar');
  if(!wrap || !el) return;

  const maxScroll = el.scrollWidth - el.clientWidth;
  const atStart = el.scrollLeft <= 2;
  const atEnd = el.scrollLeft >= maxScroll - 2;

  // Если всё помещается — прячем стрелки и маски
  if(maxScroll <= 2){
    wrap.classList.add('no-scroll');
    wrap.classList.remove('show-left', 'show-right');
    return;
  }
  wrap.classList.remove('no-scroll');
  wrap.classList.toggle('show-left', !atStart);
  wrap.classList.toggle('show-right', !atEnd);
}

function toggleMapMode(){
  state.mapMode = state.mapMode === 'points' ? 'route' : 'points';
  if(state.mapMode === 'route' && state.routeDay === null && state.tripId){
    const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
    const days = daysBetween(trip.start, trip.end);
    if(days.length){
      const today = todayISO();
      state.routeDay = days.includes(today) ? today : days[0];
    }
  }
  tripMapUserMoved = false;
  render();
}
function setRouteDay(d){ state.routeDay = d; tripMapUserMoved = false; render(); }
function toggleRouteReturn(){ state.routeReturn = !state.routeReturn; tripMapUserMoved = false; render(); }
function setRouteOrder(o){ state.routeOrder = o; tripMapUserMoved = false; render(); }
function setMapFilter(f){
  state.mapFilter = f;
  // Обновляем активный чип без полного render()
  document.querySelectorAll('#map-filters .chip').forEach(el => {
    const isAll = f === 'all' && el.textContent.trim() === 'Все';
    const isLodge = f === 'lodging' && el.textContent.includes('Жильё');
    const isAct = f === 'act' && el.textContent.includes('Активности');
    const isTicket = f === 'ticket' && el.textContent.includes('Билеты');
    el.classList.toggle('active', isAll || isLodge || isAct || isTicket);
  });
  // Сбрасываем «пользователь двигал карту», чтобы fitBounds сработал
  tripMapUserMoved = false;
  if(tripMap && tripMapLayer){
    const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
    renderMapTabMarkers(trip);
  }
}

    <a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank">🔵 Google</a>`;
}
const ROUTE_COLORS = ['#2aabee','#34c759','#ff9500','#af52de','#ff2d55','#00c7be','#5856d6','#ffcc00'];
function lodgingForDay(trip, day){
  return (trip.lodging||[]).find(l => {
    const from = l.checkInDate || l.checkOutDate || '';
    const to = l.checkOutDate || l.checkInDate || '';
    if(!from) return false;
    return day >= from && day <= to && l.lat != null && l.lng != null;
  }) || null;
}
function activitiesForDay(trip, day){
  return (trip.activities||[]).filter(a => a.date === day && a.lat != null && a.lng != null);
}
function haversineKm(a1, b1, a2, b2){
  const R = 6371, toRad = x => x * Math.PI / 180;
  const dLat = toRad(a2 - a1), dLon = toRad(b2 - b1);
  const A = Math.sin(dLat/2)**2 + Math.cos(toRad(a1))*Math.cos(toRad(a2))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(A));
}
function buildRouteForDay(trip, day){
  const lodge = lodgingForDay(trip, day);
  const acts = activitiesForDay(trip, day);
  let start = lodge
    ? { lat: lodge.lat, lng: lodge.lng, title: lodge.title||'Жильё', emoji:'🏠', isLodge:true, id:'lodge-start' }
    : (acts.length ? { lat: acts[0].lat, lng: acts[0].lng, title: acts[0].title, emoji: placeTypeIcon(acts[0].type), isLodge:false, id:'start' } : null);
  if(!start || acts.length === 0) return null;

  let pool = acts.slice();
  if(state.routeOrder === 'time'){
    pool.sort((a,b)=>{
      const ta = a.time || '99:99';
      const tb = b.time || '99:99';
      return ta.localeCompare(tb);
    });
  }
  const ordered = [];
  let cur = { lat:start.lat, lng:start.lng };
  if(state.routeOrder === 'time'){
    pool.forEach(a => ordered.push(a));
  } else {
    while(pool.length){
      let best = 0, bestD = Infinity;
      pool.forEach((a, i) => {
        const d = haversineKm(cur.lat, cur.lng, a.lat, a.lng);
        if(d < bestD){ bestD = d; best = i; }
      });
      const next = pool.splice(best, 1)[0];
      ordered.push(next);
      cur = { lat:next.lat, lng:next.lng };
    }
  }
  const points = [start, ...ordered.map(a => ({ lat:a.lat, lng:a.lng, title:a.title, emoji: placeTypeIcon(a.type), isLodge:false, id:a.id, time: a.time }))];
  if(state.routeReturn && lodge){
    points.push({ lat:lodge.lat, lng:lodge.lng, title: (lodge.title||'Жильё') + ' (возврат)', emoji:'🏠', isLodge:true, id:'lodge-end' });
  }
  let distKm = 0;
  for(let i=0; i<points.length-1; i++){
    distKm += haversineKm(points[i].lat, points[i].lng, points[i+1].lat, points[i+1].lng);
  }
  return { day, points, distKm };
}
function renderRoutes(trip){
  const days = daysBetween(trip.start, trip.end);
  if(!days.length){
    document.getElementById('map-status-wrap').innerHTML = `<div class="map-status">Нет дат поездки.</div>`;
    return;
  }
  const daysToRender = state.routeDay === null ? days : [state.routeDay];
  const routes = [];
  daysToRender.forEach(d => {
    const r = buildRouteForDay(trip, d);
    if(r) routes.push(r);
  });
  if(!routes.length){
    document.getElementById('map-status-wrap').innerHTML = `<div class="map-status">Нет точек для маршрута.</div>`;
    return;
  }
  let totalKm = 0, totalPoints = 0;
  routes.forEach((route, idx) => {
    const color = state.routeDay === null ? ROUTE_COLORS[idx % ROUTE_COLORS.length] : '#2aabee';
    const latlngs = route.points.map(p=>[p.lat, p.lng]);
    L.polyline(latlngs, { color, weight: 4, opacity: 0.85 }).addTo(tripMapLayer);
        // Пунктирные линии билетов этого дня
    const tks = (trip.tickets||[]).filter(tk =>
      (tk.segments||[]).some(sg => sg.departDate === route.day || sg.arriveDate === route.day)
    );
    const geoCache = loadTicketGeoCache(trip);
    tks.forEach(tk => {
      (tk.segments||[]).forEach(sg => {
        const a = sg.from ? geoCache[sg.from.trim()] : null;
        const b = sg.to ? geoCache[sg.to.trim()] : null;
        if(a && b){
          L.polyline([a, b], {
            color: '#34c759',
            weight: 3,
            opacity: 0.7,
            dashArray: '8 8'
          }).addTo(tripMapLayer);
        }
      });
    });
    route.points.forEach((p, i) => {
      const isFirst = i === 0;
      let label;
      if(p.isLodge) label = '🏠';
      else if(isFirst) label = '1';
      else label = String(route.points.slice(0, i+1).filter(x=>!x.isLodge).length);
      const html = p.isLodge
        ? `<div class="route-marker-icon lodge">${p.emoji}</div>`
        : `<div class="route-marker-icon" style="background:${color}">${label}</div>`;
      const icon = L.divIcon({ className:'', html, iconSize:[26,26], iconAnchor:[13,13] });
      const popup = `<b>${esc(p.title)}</b>${p.time?`<br><span style="color:#8e8e93">🕒 ${p.time}</span>`:''}<br><a href="https://yandex.ru/maps/?pt=${p.lng},${p.lat}&z=15&l=map" target="_blank">🟡 Яндекс</a>`;
      L.marker([p.lat,p.lng], { icon }).addTo(tripMapLayer).bindPopup(popup);
    });
    totalKm += route.distKm;
    totalPoints += route.points.length;
  });
  const allCoords = routes.flatMap(r => r.points.map(p=>[p.lat, p.lng]));
  if(!tripMapUserMoved){
    tripMap.fitBounds(L.latLngBounds(allCoords).pad(0.15));
  }
  let yandexLink = '';
  if(state.routeDay !== null){
    const r = routes[0];
    const pointsStr = r.points.map(p=>encodeURIComponent(p.title)).join('~');
    if(pointsStr) yandexLink = `<a href="https://yandex.ru/maps/?rtext=${pointsStr}&rtt=auto" target="_blank">🗺 Открыть в Яндекс.Картах</a>`;
  }
  const summaryLabel = state.routeDay === null
    ? `Все дни (${routes.length})`
    : `День ${days.indexOf(state.routeDay)+1} · ${new Date(state.routeDay).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}`;
  document.getElementById('map-status-wrap').innerHTML = `
    <div class="map-summary">
      <div>
        <div><b>${esc(summaryLabel)}</b></div>
        <div class="stat" style="margin-top:4px">Точек: <b>${totalPoints}</b> · Расстояние: <b>~${totalKm.toFixed(1)} км</b> <span class="muted" style="font-size:11px"> · по прямой</span></div>
      </div>
      ${yandexLink}
    </div>`;
}
let tripMapUserMoved = false;

function initTripMap(trip){
  try{
    // Если карта уже создана в этом же DOM-контейнере — просто перерисовываем маркеры
    const container = document.getElementById('trip-map');
    if(tripMap && container && tripMap.getContainer() === container){
      renderMapTabMarkers(trip);
      return;
    }
    if(tripMap){ tripMap.remove(); tripMap = null; }
    if(typeof L !== 'undefined') L.TileLayer.prototype.options.referrerPolicy = 'strict-origin-when-cross-origin';
    tripMap = L.map('trip-map').setView([41.7151,44.8271], 6);
    tripMapLayer = L.layerGroup().addTo(tripMap);
    tripMapUserMoved = false;
    tripMap.on('movestart', () => { tripMapUserMoved = true; });
    const TILE_SOURCES = [
      { url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr:'© OpenStreetMap', max:19 },
      { url:'https://tile.openstreetmap.de/{z}/{x}/{y}.png', attr:'© OpenStreetMap DE', max:19 },
      { url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', attr:'© OpenStreetMap, © CARTO', max:20 }
    ];
    function addTiles(i){
      if(i >= TILE_SOURCES.length){
        document.getElementById('map-status-wrap').innerHTML = `<div class="map-status">⚠️ Не удалось загрузить тайлы.</div>`;
        return;
      }
      const s = TILE_SOURCES[i];
      const layer = L.tileLayer(s.url, { attribution: s.attr, maxZoom: s.max, referrerPolicy: 'strict-origin-when-cross-origin' }).addTo(tripMap);
      let loaded = false;
      layer.on('load', ()=>{ loaded = true; tripMapTilesLoaded = true; });
      layer.on('tileerror', ()=>{});
      setTimeout(()=>{
        if(!loaded && i+1 < TILE_SOURCES.length){
          tripMap.removeLayer(layer);
          addTiles(i+1);
        }
      }, 4000);
    }
    addTiles(0);
    renderMapTabMarkers(trip);
  }catch(e){
    document.getElementById('map-status-wrap').innerHTML = `<div class="map-status">⚠️ Ошибка карты: ${esc(e.message)}</div>`;
    console.error(e);
  }
}

    </div>` : '';
  return `<div class="lodge-card" onclick="openLodgingModal('${l.id}')">

function removeLodgingAttachment(){

function saveLodging(id){
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const title = document.getElementById('l-title').value.trim() || 'Жильё';
  const address = document.getElementById('l-address').value.trim();
  const coords = document.getElementById('l-coords').value;
  const {lat, lng} = parseCoords(coords);
  const checkInDate = document.getElementById('l-in-date').value;
  const checkInTime = document.getElementById('l-in-time').value;
  const checkOutDate = document.getElementById('l-out-date').value;
  const checkOutTime = document.getElementById('l-out-time').value;
  const price = parseFloat(document.getElementById('l-price').value) || 0;
  const priceNote = document.getElementById('l-price-note').value.trim();
  const link = document.getElementById('l-link').value.trim();
  const notes = document.getElementById('l-notes').value.trim();
  const addExpense = document.getElementById('l-add-expense').checked;
    const data = { title, address, lat, lng, checkInDate, checkInTime, checkOutDate, checkOutTime, price, priceNote, link, notes };
  // Привязка вложения
  data.attachmentId   = null;
  data.attachmentName = null;
  data.attachmentSize = null;
  data.attachmentType = null;
  let attach = null;
  if(state._lodgingAttachDraft){
    attach = state._lodgingAttachDraft;
    state._lodgingAttachDraft = null;
  } else if(id){
    const existing = trip.lodging.find(x=>x.id===id);
    if(existing && existing.attachmentId){
      attach = {
        id: existing.attachmentId,
        name: existing.attachmentName,
        size: existing.attachmentSize,
        type: existing.attachmentType
      };
    }
  }
  if(attach){
    data.attachmentId   = attach.id;
    data.attachmentName = attach.name || 'файл';
    data.attachmentSize = attach.size || 0;
    data.attachmentType = attach.type || '';
  }
  if(id){
    const l = trip.lodging.find(x=>x.id===id);
    Object.assign(l, data);
  } else {
    trip.lodging.push({ id: uid(), ...data });
  }
  if(addExpense && price > 0){
    let cat = trip.budget.categories.find(c => c.name.toLowerCase() === 'жильё');
    if(!cat){ cat = { id: uid(), name:'Жильё', planned:0, color:'#2aabee' }; trip.budget.categories.push(cat); }
    trip.budget.expenses.push({ id: uid(), title: `${title} (жильё)`, amount: price, date: checkInDate || todayISO(), categoryId: cat.id, note: priceNote || '', priceInRUB: true, isPrepaid: true });
  }
    state._editingLodgingId = null;
  state._lodgingAttachDraft = null;
  closeModal();
  render();
  syncTrip(trip.id);
}
function deleteLodging(id){
  if(!confirm('Удалить это жильё?')) return;
  const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
  const doomed = trip.lodging.find(l => l.id === id);
  if(doomed && doomed.attachmentId){
    deleteAttachment(doomed.attachmentId);
  }
  trip.lodging = trip.lodging.filter(l => l.id !== id);
  closeModal();
  render();
  syncTrip(trip.id);
}
let lodgeAbort = null, lodgeTimer = null;
function searchLodgingAddress(){
  const input = document.getElementById('l-address');
  const box = document.getElementById('l-suggestions');
  if(!input || !box) return;
  const q = input.value.trim();
  if(q.length < 3){ box.innerHTML=''; return; }
  if(lodgeAbort) lodgeAbort.abort();
  clearTimeout(lodgeTimer);
  lodgeTimer = setTimeout(async ()=>{
    box.innerHTML = '<div class="loading">Ищу...</div>';
    lodgeAbort = new AbortController();
    try{
      const results = await geocodeSearch(q, lodgeAbort.signal);
      renderSuggestions(box, results, (r) => {
        const addr = document.getElementById('l-address');
        const coords = document.getElementById('l-coords');
        if(addr) addr.value = r.addr ? `${r.name}, ${r.addr}` : r.name;
        if(coords) coords.value = `${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}`;
        box.innerHTML = '';
      });
    }catch(e){
      if(e.name === 'AbortError') return;
      box.innerHTML = '<div class="loading">Ошибка поиска.</div>';
    }
  }, 500);
}
function pickLodgingSuggestion(lat, lng, fullName){
  const addr = document.getElementById('l-address');
  const coords = document.getElementById('l-coords');
  if(addr) addr.value = fullName || `${lat}, ${lng}`;
  if(coords) coords.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  const box = document.getElementById('l-suggestions');
  if(box) box.innerHTML = '';
}

function ticketIcon(type){ const t = TICKET_TYPES.find(x=>x.id===type); return t ? t.icon : '🎫'; }

function renderTicketsTab(trip){
  const c = document.getElementById('tab-content');
  const list = (trip.tickets||[]).slice().sort((a,b)=>{

function ticketCard(t, trip){
  const segs = t.segments || [];

  let routeHtml = '';
  if(segs.length === 1){
    routeHtml = `<span class="point">${esc(first.from||'—')}</span><span class="arr">→</span><span class="point">${esc(first.to||'—')}</span>`;
  } else if(segs.length === 2){
    routeHtml = `<span class="point">${esc(segs[0].from||'—')}</span><span class="arr">→</span><span class="point">${esc(segs[0].to||'—')}</span><span class="arr">→</span><span class="point">${esc(segs[1].to||'—')}</span>`;
  } else {
    routeHtml = `<span class="point">${esc(segs[0].from||'—')}</span><span class="arr">→</span><span class="point">${esc(segs[0].to||'—')}</span><span class="more">+ ещё ${segs.length-1}</span>`;
  }
  const depStr = first.departDate ? `${fmtDate(first.departDate)}${first.departTime?' · '+esc(first.departTime):''}` : '';
  const arrStr = last.arriveDate ? `${fmtDate(last.arriveDate)}${last.arriveTime?' · '+esc(last.arriveTime):''}` : '';
  let datesHtml = '';
  if(depStr || arrStr){
    datesHtml = `<div class="ticket-dates">${depStr?`<span class="seg">🛫 <b>${depStr}</b></span>`:''}${arrStr?`<span class="seg">🛬 <b>${arrStr}</b></span>`:''}</div>`;
  }
  const bars = Array.from(t.id || 'x').map((ch, i) => {
    const w = (ch.charCodeAt(0) % 3) + 1;
    const h = ((i * 7) % 12) + 8;

  }).join('');
  const allPoints = [segs[0]?.from, ...segs.map(s=>s.to)].filter(Boolean);
  const mapLink = allPoints.length >= 2 ? `https://yandex.ru/maps/?rtext=${allPoints.map(p=>encodeURIComponent(p)).join('~')}&rtt=auto` : '';
  const priceLine = t.price ? `<span class="price">${fmtMoney(t.price, 'RUB')}</span>` : '';
  const seatsLine = segs.map(s=>s.seat).filter(Boolean);
  const seatHtml = seatsLine.length ? `<span class="seat">место ${esc(seatsLine.join(', '))}</span>` : '';

      </span>
    </div>
    <div class="ticket-body">
      <div class="ticket-route">${routeHtml}</div>
      ${datesHtml}
    </div>
    <div class="ticket-perf"></div>
    <div class="ticket-foot">
      <span class="carrier">${esc(carrierLine)}</span>
      ${seatHtml}
      ${priceLine}
    </div>
    <div class="ticket-barcode">${bars}</div>
        ${(() => {
      const hasMap = !!mapLink;
      const hasLink = !!t.link;
      const hasFile = !!t.attachmentId;
      if(!hasMap && !hasLink && !hasFile) return '';
      return `<div class="map-links" style="padding:0 14px 12px" onclick="event.stopPropagation()">
        ${hasMap ? `<a href="${mapLink}" target="_blank">🗺️ Открыть маршрут</a>` : ''}
        ${hasLink ? `<a href="${esc(t.link)}" target="_blank">🔗 Бронь</a>` : ''}
        ${hasFile ? `<a href="#" onclick="event.preventDefault();event.stopPropagation();openAttachmentSmart('ticket','${t.id}','${esc(t.attachmentId)}');return false;">📄 Файл</a>` : ''}

async function hydrateTicketAttachBox(aid){
  const a = await getAttachment(aid);
  const status = document.querySelector('#tk-attach-row .attach-status');
  if(!status) return;
  if(a){
    status.textContent = '· на устройстве';
    status.style.color = 'var(--ok)';
  } else {
    status.textContent = '· не перенесён (прикрепите заново)';
    status.style.color = 'var(--warn)';
  }
}
function bindTicketAttachControls(){
  const input = document.getElementById('tk-attach-input');
  if(!input) return;
  input.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    try{
      const rec = await saveAttachment(file);
      // Обновляем state: если сохраняем новый билет — кладём в буфер
      if(state.editingTicketId){
        const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
        const t = trip.tickets.find(x => x.id === state.editingTicketId);
        if(t){
          if(t.attachmentId) deleteAttachment(t.attachmentId);
          t.attachmentId   = rec.id;
          t.attachmentName = rec.name;
          t.attachmentSize = rec.size;
          t.attachmentType = rec.type;
          syncTrip(trip.id);
        }
      } else {
        // Новый билет — держим в черновике state._ticketAttachDraft
        state._ticketAttachDraft = rec;
      }
      const box = document.getElementById('tk-attach-box');
      if(box){
        const fake = {
          attachmentId: rec.id,
          attachmentName: rec.name,
          attachmentSize: rec.size,
          attachmentType: rec.type
        };
        box.innerHTML = ticketAttachBoxHtml(fake);
        hydrateTicketAttachBox(rec.id);
      }
    }catch(err){
      alert(err.message || 'Не удалось сохранить файл');
    }finally{
      input.value = '';
    }
  });
}
function removeTicketAttachment(){
  if(!confirm('Убрать вложение?')) return;
  if(state.editingTicketId){
    const trip = ensureTrip(trips.find(t=>t.id===state.tripId));
    const t = trip.tickets.find(x => x.id === state.editingTicketId);
    if(t && t.attachmentId){
      deleteAttachment(t.attachmentId);
      delete t.attachmentId;
      delete t.attachmentName;
      delete t.attachmentSize;
      delete t.attachmentType;
      syncTrip(trip.id);
    }
  } else {
    if(state._ticketAttachDraft){
      deleteAttachment(state._ticketAttachDraft.id);
      state._ticketAttachDraft = null;
    }
  }
  const box = document.getElementById('tk-attach-box');
  if(box) box.innerHTML = ticketAttachBoxHtml(null);
  bindTicketAttachControls();
}

      </div>
      <div class="row">

function addTicketSegment(){
  const last = state.ticketSegments[state.ticketSegments.length-1] || {};
  state.ticketSegments.push({ id: uid(), from: last.to || '', to:'', departDate: last.arriveDate || '', departTime:'', arriveDate:'', arriveTime:'', carrier:'', number:'', seat:'' });
  renderTicketSegments();
}
function addReturnSegment(){
  const segs = state.ticketSegments;
  if(!segs.length) return;
  const points = [segs[0].from, ...segs.map(s=>s.to)].filter(Boolean);
  if(points.length < 2){ alert('Заполните откуда и куда'); return; }
  const reversed = points.slice().reverse();
  const returnSegs = [];
  for(let i=0; i<reversed.length-1; i++){
    returnSegs.push({ id: uid(), from: reversed[i], to: reversed[i+1], departDate:'', departTime:'', arriveDate:'', arriveTime:'', carrier:'', number:'', seat:'' });
  }
  state.ticketSegments = state.ticketSegments.concat(returnSegs);
  renderTicketSegments();
}
function removeTicketSegment(i){
  if(state.ticketSegments.length <= 1) return;
  state.ticketSegments.splice(i, 1);
  renderTicketSegments();
}

    price: tkPrice ? parseFloat(tkPrice.value) || 0 : 0,

    notes: tkNotes ? tkNotes.value.trim() : ''
  };

  const sg = state.ticketSegments[segmentIndex];

  const curLng = sg[field + 'Lng'];
